<style>
:root{
  --bg:#0f141b; --panel:#161d26; --raised:#1d2631; --line:#2a3542; --line2:#222c37;
  --ink:#d8e0e8; --ink2:#93a1ae; --ink3:#66737f;
  --up:#26a69a; --down:#ef5350; --accent:#4c9be8; --warn:#e0a43a;
  --buy:#1f8f6a; --sell:#c94442;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---- thanh trên ---- */
#top{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;flex:none}
.grp{display:flex;gap:4px;align-items:center;flex:none}
.sp{flex:1 0 0}
.brand{font-weight:800;letter-spacing:.3px;color:var(--ink);font-size:17px;padding:0 4px;white-space:nowrap;flex:none}
.brand b{color:var(--up)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;background:var(--raised);border:1px solid var(--line);border-radius:7px;cursor:pointer;white-space:nowrap;font-size:14px;line-height:1.1}
.b:hover{border-color:var(--ink3)}
.b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.b:disabled{opacity:.4;cursor:default}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.b.pri:hover{background:#5fa9f0}
.b.warn{border-color:var(--warn);color:var(--warn);font-weight:700}
.b.warn:hover{background:rgba(224,164,58,.12)}
.b.mini{min-height:28px;padding:0 8px;font-size:12px}
.b.sq{padding:0;min-width:36px}
.seg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg .b{border:0;background:transparent;min-height:30px;padding:0 10px;border-radius:6px;color:var(--ink2)}
.seg .b:hover{color:var(--ink)}
.seg .b.on{background:var(--accent);color:#fff;font-weight:600}
select,input[type=number],input[type=text],input[type=date],input[type=datetime-local],textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 8px;min-height:36px;min-width:0}
textarea{padding:8px;width:100%;resize:vertical;line-height:1.4}
select:focus,input:focus,textarea:focus,.b:focus-visible,.cta:focus-visible,.big:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:104px}
input[type=checkbox]{width:17px;height:17px;vertical-align:-3px;accent-color:var(--accent)}
#symSel{font-weight:700;max-width:170px}

/* ---- chart ---- */
#main{flex:1;display:flex;min-height:0}
#cw{flex:1;position:relative;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#legend{position:absolute;left:8px;top:6px;font:12px var(--mono);color:var(--ink2);pointer-events:none;white-space:nowrap}
#legend b{color:var(--ink)}
#banner{position:absolute;left:50%;top:28px;transform:translateX(-50%);background:rgba(224,164,58,.15);border:1px solid var(--warn);color:var(--warn);padding:2px 10px;border-radius:5px;font-size:12px;pointer-events:none;display:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:30;background:#263243;border:1px solid var(--ink3);padding:9px 16px;border-radius:8px;display:none;max-width:92vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:14px}
#credit{position:absolute;right:78px;top:22px;font-size:11px;color:var(--ink2);opacity:.8;pointer-events:none;white-space:nowrap;z-index:1}
body.tr #creditN{display:none}
#feeNote{position:absolute;right:78px;top:54px;font-size:11px;color:var(--warn);opacity:.95;pointer-events:none;white-space:nowrap;z-index:1;text-align:right;line-height:1.35}
@media (max-width:820px){#credit{top:auto;bottom:30px}#feeNote{top:50px;right:8px;left:8px;white-space:normal;font-size:10.5px}}
#cnav{position:absolute;left:8px;bottom:30px;display:flex;gap:4px;z-index:2;opacity:.75}
#cnav:hover{opacity:1}
#fab{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3;pointer-events:none;width:max-content;max-width:94%}
#fab>*{pointer-events:auto}
#fabSub{background:rgba(15,20,27,.88);border:1px solid var(--line);padding:3px 12px;border-radius:12px;font-size:12.5px;color:var(--ink2);text-align:center}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 34px;font-size:18px;font-weight:800;border-radius:28px;border:0;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.55),0 0 0 5px rgba(76,155,232,.2)}
.cta:hover{background:#5fa9f0}
.cta.wide{width:100%;border-radius:10px;min-height:52px;font-size:17px;padding:0 10px;box-shadow:none;margin:10px 0 6px}

/* ---- panel bên ---- */
#side{width:356px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px}
h3{margin:2px 0 8px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600}
h3 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.box{background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:10px}
details.box>summary{cursor:pointer;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600;min-height:24px;display:flex;align-items:center;gap:6px;list-style:none}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:'▸';color:var(--ink3)}
details.box[open]>summary::before{content:'▾'}
details.box[open]>summary{margin-bottom:8px}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label:first-child{color:var(--ink2);min-width:78px}
.row .grow{flex:1}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;min-height:30px}
.big{flex:1;min-height:50px;padding:0 8px;font-weight:800;font-size:16px;border-radius:9px;border:0;cursor:pointer;color:#fff;letter-spacing:.02em}
.long{background:var(--buy)}.short{background:var(--sell)}
.long:hover{background:#25a77c}.short:hover{background:#dd504d}
.step1{flex:1 1 100%;min-height:54px;font-size:18px;font-weight:800;border-radius:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.acct .lab{color:var(--ink2);font-size:12px}
.acct .eq{font:800 27px/1.15 var(--mono);margin:1px 0 2px}
.acct .pl{font:600 14px var(--mono);margin-bottom:8px}
.pos{color:var(--up)}.neg{color:var(--down)}
.muted{color:var(--ink3);font-size:12.5px}
.center{text-align:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line2);text-align:right;font-family:var(--mono);white-space:nowrap}
th{color:var(--ink2);font-family:inherit;font-weight:500}
td:first-child,th:first-child{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(76,155,232,.1)}
tr.cur td{background:rgba(76,155,232,.14)}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px var(--mono)}
.foot{padding:2px 2px 12px}

/* ---- menu thả ---- */
.menu{display:none;position:fixed;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;width:270px;max-width:calc(100vw - 8px);max-height:74vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.menu h4{margin:8px 8px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.menu label{display:flex;gap:9px;align-items:center;padding:0 8px;min-height:34px;border-radius:6px;cursor:pointer}
.menu label:hover{background:var(--raised)}
.menu label i{width:10px;height:10px;border-radius:2px;flex:none}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#tools .b{justify-content:flex-start;padding:0 8px;overflow:hidden;font-size:13px}
#tools .b span{width:22px;text-align:center;flex:none}
#colors{display:flex;gap:8px;padding:2px 8px 6px}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:#fff}
.mrow{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.mrow .b{justify-content:flex-start}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:8px}
#mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:min(560px,100%);max-height:94vh;max-height:94dvh;overflow:auto}
#mbox.wide{width:min(900px,100%)}
#mbox h2{margin:0 34px 6px 0;font-size:19px}
#mbox p{margin:6px 0 10px;color:var(--ink2)}
.mx{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--ink2);font-size:20px;cursor:pointer}
.mx:hover{background:var(--raised);color:var(--ink)}
.netbig{font:800 30px/1.2 var(--mono);margin:4px 0 2px}
.learncta{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border:1px solid #6b5722;border-left:4px solid #e3b95a;border-radius:10px;background:linear-gradient(135deg,#2a2210,#1d2631 75%);color:var(--ink);text-decoration:none}
.learncta:hover{border-color:#e3b95a}
.learncta .ic{font-size:26px}
.learncta .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.learncta .tx b{color:#f0cf7a;font-size:15px}
.learncta .tx span{color:var(--ink2);font-size:13px;line-height:1.45}
.learncta .go{white-space:nowrap;font-weight:700;color:#2a1e03;background:#e3b95a;border-radius:8px;padding:7px 11px;font-size:13px}
@media (max-width:640px){.learncta{flex-wrap:wrap}.learncta .go{margin-left:38px}}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mbtns .b{flex:1 1 140px;min-height:44px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--raised);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:0}
.stat small{display:block;color:var(--ink2);font-size:12px}
.stat b{font:700 14.5px var(--mono);overflow-wrap:anywhere}
#eqCv{display:block;width:100%;height:200px;background:var(--bg);border:1px solid var(--line2);border-radius:8px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
.lg i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* hướng dẫn */
.onbTop{display:flex;justify-content:space-between;align-items:center;margin-right:36px}
.ill{height:118px;margin:12px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;overflow:hidden}
.ill .em{font-size:44px;line-height:1}
.ill .chip{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);white-space:nowrap}
.ill .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ill .pill{padding:10px 20px;border-radius:22px;background:var(--accent);color:#fff;font-weight:800;white-space:nowrap}
.ill .buy{background:var(--buy);border-color:var(--buy);color:#fff;font-weight:700}
.ill .sell{background:var(--sell);border-color:var(--sell);color:#fff;font-weight:700}
.cdl{display:flex;align-items:flex-end;gap:5px;height:76px}
.cdl i{width:9px;border-radius:2px;background:var(--up)}
.cdl i.d{background:var(--down)}
.cdl i.h{background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
/* góp ý */
.stars{display:flex;gap:2px;margin:4px 0 6px}
.stars button{font-size:30px;line-height:1;background:none;border:0;color:var(--ink3);cursor:pointer;min-width:44px;min-height:44px;border-radius:8px}
.stars button.on{color:var(--warn)}
#fbMsg{margin-top:8px;min-height:18px;font-size:13.5px;color:var(--ink)}
#fbMsg a{color:var(--accent)}
code{font:12px var(--mono);color:var(--ink2)}

#mbar{display:none}
#bQuitTop{display:none;flex:none;white-space:nowrap;margin-left:auto}
body.tr #bQuitTop{display:inline-flex;align-items:center;position:sticky;right:0;z-index:2;background:var(--panel);box-shadow:-8px 0 8px var(--panel)}
@media (max-width:1180px){#top{gap:6px}.b{padding:0 9px}.seg .b{padding:0 7px}#symSel{max-width:140px}.brand{font-size:15px}}
@media (max-width:640px){.brand{display:none}}
@media (max-width:820px){
  html,body{height:auto}
  #app{height:auto;min-height:100vh}
  #top{padding:6px 8px;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #top::-webkit-scrollbar{display:none}
  .b,select,input[type=number],input[type=text],input[type=date],input[type=datetime-local]{min-height:44px}
  .b.mini{min-height:44px;min-width:44px}
  .b.sq{min-width:44px}
  .seg .b{min-height:44px;padding:0 11px}
  .sp{display:none}
  #main{flex-direction:column}
  #cw{height:58vh;min-height:55vh;flex:none}
  #side{width:auto;border-left:0;border-top:1px solid var(--line)}
  #banner{top:26px;font-size:11px}
  #legend{font-size:11px;right:8px;overflow:hidden;text-overflow:ellipsis}
  #cnav{bottom:28px}
  #fab{bottom:84px}
  #fabSub{pointer-events:none}
  .cta{min-height:54px;font-size:17px;padding:0 26px}
  .menu label{min-height:44px}
  .sw{width:34px;height:34px}
  body.tr #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;gap:5px;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  #mbar .b{padding:0 10px;min-height:46px;font-size:15px;font-weight:700}
  #mbar .big{min-height:46px;padding:0 4px;font-size:14px;min-width:0;overflow:hidden}
  #mpos{font:12px var(--mono);min-width:52px;text-align:center;overflow:hidden}
  body.tr #app{padding-bottom:62px}
  #mbox{padding:14px 14px}
  .mx{width:44px;height:44px;right:4px;top:4px}
  .netbig{font-size:25px}
  .stats{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  #eqCv{height:170px}
}
@media (max-width:400px){
  #mbar{gap:4px}
  #mbar .b{padding:0 7px}
  #mbar .big{font-size:13px;letter-spacing:0;padding:0 2px}
  #mpos{min-width:46px;font-size:11px}
}
.ill{flex-wrap:wrap;height:auto;min-height:118px;padding:10px}
</style>
<script>
/* ===== StockGym: bảng mã, ngôn ngữ ===== */
const VERSION = '2.2';
/* góp ý người dùng: gform = URL …/formResponse của Google Form (để trống -> mở GitHub issue điền sẵn); entry = tên các ô entry.xxx của form */
const FEEDBACK = {gform: '', entry: {rating: '', type: '', text: '', contact: '', ctx: ''}, issues: 'https://github.com/stockgym/stockgym.github.io/issues/new'};
const FX_VND0 = 26000;                       // chỉ dùng để hiện dòng quy đổi VNĐ ở giao diện tiếng Việt
const L2 = (vi, en) => ({vi, en});
/* cls: deriv | stock · cur: tiền của mã · mult: tiền / 1 đơn vị giá / 1 đơn vị KL · lot: bước KL · mr: tỷ lệ ký quỹ
   fee: comm = tiền của mã / đơn vị KL / chiều, slip = % giá trị / chiều, tax = % giá trị chỉ khi BÁN · qu: khóa i18n của đơn vị KL */
const SYMS = {
  xag:  {name: 'XAGUSD', cls: 'deriv', cur: '$', mult: 100, lot: 1, mr: 0.10, dp: 3, g: 'g_cmd', qu: 'u_ct', kind: 'xag', file: 'silver_base.js', f5: 'silver_5m.js',

}
/* MK[key] = {key, SY, DS: {'5','15','30','60','240','D','W'}, meta, hasVol}. Mọi file dữ liệu dùng chung biến window.SILVER_DATA nên phải nạp TUẦN TỰ. */

}
const TFL = [
  {k:'5', lab:'5m', small:true}, {k:'15', lab:'15m', small:true}, {k:'30', lab:'30m', small:true},
  {k:'60', lab:'1H'}, {k:'240', lab:'4H'}, {k:'D', lab:'D'}, {k:'W', lab:'W'}];

function load5m(mk){

    .catch(e => { mk.l5 = null; toast(t('load_fail', mk.SY.name + ' 5m'), 3000); throw e; });
}
function lowerBound(ds, T){ let lo = 0, hi = ds.n; while (lo < hi){ const m = (lo + hi) >> 1; if (ds.t[m] < T) lo = m + 1; else hi = m; } return lo; }

function baseFor(mk, T){

/* giá đóng của nến cơ sở đã đóng cuối cùng ≤ T (không nhìn trước); chưa có nến nào -> NaN */
function priceAt(mk, T){

/* mã đang xem */
let SYM = null, SY = null, MKA = null, DS = null, OZ = 1, VND = false, CFG = null, HASVOL = false;
function bind(key){ SYM = key; SY = SYMS[key]; MKA = MK[key] || null; DS = MKA ? MKA.DS : null; OZ = SY.mult; VND = SY.cur === 'đ'; CFG = cfgOf(key); HASVOL = !!(MKA && MKA.hasVol); }

/* ---------- chỉ báo ---------- */
const INDS = [
  {k:'ema20', lab:'EMA20', col:'#e0a43a'}, {k:'ema50', lab:'EMA50', col:'#4c9be8'}, {k:'sma200', lab:'SMA200', col:'#c678dd'},
  {k:'bb', lab:'Bollinger 20/2', col:'#7f8c99'}, {k:'kc', lk:'ind_kc', col:'#26a69a'},
  {k:'dc', lab:'Donchian 20', col:'#5aa9c8'}, {k:'st', lab:'Supertrend 10/3', col:'#2ee6a0'}, {k:'psar', lk:'ind_psar', col:'#d8e0e8'},
  {k:'ichi', lab:'Ichimoku 9/26/52', col:'#c678dd'}, {k:'lr', lk:'ind_lr', col:'#e08a3a'},
  {k:'zz', lk:'ind_zz', col:'#f2c94c'}, {k:'ew', lk:'ind_ew', col:'#56b6f7'}];
/* khung phụ dưới chart: g = mức kẻ ngang (Volume chỉ có khi mã đang xem có dữ liệu khối lượng) */
const SUBS = [
  {k:'vol', lab:'Volume', names:['Vol', 'MA20'], cols:['#7f8c99', '#e0a43a']},
  {k:'rsi', lab:'RSI 14', names:['RSI'], cols:['#c678dd'], g:[30, 70]},
  {k:'macd', lab:'MACD 12/26/9', names:['MACD', 'Signal', 'Hist'], cols:['#4c9be8', '#e0a43a', '#7f8c99'], g:[0]},
  {k:'stoch', lab:'Stochastic 14/3/3', names:['%K', '%D'], cols:['#4c9be8', '#e0a43a'], g:[20, 80]},
  {k:'adx', lab:'ADX 14', names:['ADX', '+DI', '−DI'], cols:['#e0a43a', '#26a69a', '#ef5350'], g:[25]},
  {k:'atr', lab:'ATR 14', names:['ATR'], cols:['#4c9be8']}];
const subsAvail = () => SUBS.filter(x => x.k !== 'vol' || HASVOL);
function ema(c, len){ const a = new Float64Array(c.length), k = 2 / (len + 1); let e = c[0]; for (let i = 0; i < c.length; i++){ e = i ? e + (c[i] - e) * k : c[i]; a[i] = i >= len - 1 ? e : NaN; } return a; }

function atr(ds, len){ const a = new Float64Array(ds.n); let v = 0; for (let i = 0; i < ds.n; i++){ const tr = i ? Math.max(ds.h[i] - ds.l[i], Math.abs(ds.h[i] - ds.c[i-1]), Math.abs(ds.l[i] - ds.c[i-1])) : ds.h[i] - ds.l[i]; v = i < len ? (v * i + tr) / (i + 1) : (v * (len - 1) + tr) / len; a[i] = v; } return a; }
function ind(ds){
  if (ds.ind) return ds.ind;

  const m = sma(c, 20), up = new Float64Array(n), lo = new Float64Array(n);

function roll(a, len, mx){ const n = a.length, r = new Float64Array(n).fill(NaN); for (let i = len - 1; i < n; i++){ let x = a[i]; for (let j = i - len + 1; j < i; j++) if (mx ? a[j] > x : a[j] < x) x = a[j]; r[i] = x; } return r; }
/* chỉ báo tính lười, nhớ theo từng khung. Mọi công thức đều nhân quả (giá trị tại nến i chỉ dùng dữ liệu tới nến i). */
function calc(ds, k){
  const X = ds.x || (ds.x = {}); if (X[k]) return X[k];

      P[i] = pdi; M[i] = mdi; cnt++;
      if (cnt <= 14){ ax += dx; if (cnt === 14){ ax /= 14; AD[i] = ax; } } else { ax = (ax * 13 + dx) / 14; AD[i] = ax; }

/* ---------- ZigZag + sóng Elliott ----------
   ZigZag: đảo chiều khi giá đi ngược ≥ ZZK × ATR14 tính từ cực trị gần nhất. Chỉ dùng nến đã đóng (tới nc−1) nên không lộ tương lai;
   điểm cuối là cực trị tạm (chưa chốt) và sẽ dời khi có nến mới. Tính trong cửa sổ bắt đầu ở mốc chẵn ZZB nến để kéo chart không bị nhảy. */
const ZZK = 4, ZZB = 2000;
function zigzag(ds, i0, nc){
  const s = Math.max(0, (Math.floor(i0 / ZZB) - 1) * ZZB), e = nc - 1, key = s + ':' + e;
  if (ds.zz && ds.zz.key === key) return ds.zz;
  const h = ds.h, l = ds.l, a = ind(ds).atr14, P = [];
  if (e - s >= 3){
    let dir = 0, hi = s, lo = s;
    for (let i = s + 1; i <= e; i++){
      const thr = ZZK * a[i];
      if (dir >= 0 && h[i] >= h[hi]) hi = i;
      if (dir <= 0 && l[i] <= l[lo]) lo = i;
      if (dir === 0){
        if (hi < i && h[hi] - l[i] >= thr){ P.push({i: hi, p: h[hi], up: true}); dir = -1; lo = i; }
        else if (lo < i && h[i] - l[lo] >= thr){ P.push({i: lo, p: l[lo], up: false}); dir = 1; hi = i; }
      } else if (dir > 0){ if (hi < i && h[hi] - l[i] >= thr){ P.push({i: hi, p: h[hi], up: true}); dir = -1; lo = i; } }
      else if (lo < i && h[i] - l[lo] >= thr){ P.push({i: lo, p: l[lo], up: false}); dir = 1; hi = i; }
    }
    if (dir > 0) P.push({i: hi, p: h[hi], up: true, tmp: true}); else if (dir < 0) P.push({i: lo, p: l[lo], up: false, tmp: true});
  }
  /* Elliott: quét dãy đỉnh/đáy tìm sóng đẩy 5 bước đúng 3 luật cứng (sóng 2 không vượt gốc sóng 1; sóng 3 không ngắn nhất và vượt đỉnh
     sóng 1; sóng 4 không lấn vùng sóng 1), sóng 5 vượt đỉnh sóng 3. Sau đó gắn A-B-C nếu B không vượt đỉnh sóng 5. */
  const L = [], np = P.length;
  const imp = (j, m) => {            // m = số điểm cần kiểm (4..6); trả true nếu các luật áp dụng được đều đúng
    const q = P[j], sg = q.up ? -1 : 1, d = k => (P[j + k].p - q.p) * sg;      // d(k): khoảng cách theo chiều sóng tính từ gốc
    if (!(d(1) > 0 && d(2) > 0 && d(2) < d(1) && d(3) > d(1))) return false;
    if (m >= 5 && !(d(4) > d(1) && d(4) < d(3))) return false;
    if (m >= 6){ const w1 = d(1), w3 = d(3) - d(2), w5 = d(5) - d(4); if (!(d(5) > d(3)) || (w3 < w1 && w3 < w5)) return false; }
    return true;
  };
  let j = 0;
  while (j < np){
    if (j + 5 < np && imp(j, 6)){
      for (let k = 1; k <= 5; k++) L.push({pt: P[j + k], s: '' + k, c: 0});
      let nx = j + 5;
      if (j + 6 < np){
        const top = P[j + 5], sg = top.up ? 1 : -1, okB = j + 7 >= np || (top.p - P[j + 7].p) * sg > 0;
        if (okB){ L.push({pt: P[j + 6], s: 'A', c: 1}); nx = j + 6;
          if (j + 7 < np){ L.push({pt: P[j + 7], s: 'B', c: 1}); nx = j + 7; }
          if (j + 8 < np && (P[j + 6].p - P[j + 8].p) * sg > 0){ L.push({pt: P[j + 8], s: 'C', c: 1}); nx = j + 8; } }
      }
      j = nx; continue;
    }
    if (j + 3 < np && j + 5 >= np){   // đuôi dãy: sóng đẩy đang hình thành (mới có 3 hoặc 4 sóng)
      const m = np - j;
      if (m >= 4 && imp(j, Math.min(m, 5))){ for (let k = 1; k < m; k++) L.push({pt: P[j + k], s: '' + k, c: 2}); break; }
    }
    j++;
  }
  return ds.zz = {key, P, L};
}

/* ---------- tài khoản ---------- */
function equity(){
  let e = TR.cash; const stock = TR.mode === 'stock';
  for (const k of openKeys()){ const p = TR.pos[k], sy = SYMS[k]; let px = curPrice(k); if (!isFinite(px)) px = p.avg;
    e += stock ? p.qty * px * sy.mult : (px - p.avg) * p.qty * sy.mult * p.side; }
  return e;
}
function marginUsed(){
  let m = 0;
  for (const k of openKeys()){ const p = TR.pos[k], sy = SYMS[k]; let px = curPrice(k); if (!isFinite(px)) px = p.avg; m += p.qty * px * sy.mult * (sy.mr || 1); }
  return m;
}
/* cổ phiếu: KL mua tối đa với tiền mặt hiện có (đã gồm phí), làm tròn xuống theo lô */
function maxBuy(key, px){
  const sy = SYMS[key], c = cfgOf(key), per = px * sy.mult * (1 + c.slip / 100) + c.comm;
  if (!(per > 0) || !isFinite(per)) return 0;
  return Math.max(0, rq(Math.floor(TR.cash / per / sy.lot + 1e-9) * sy.lot));
}
function normQty(x, lot){ return x == null || !(x > 0) ? 0 : rq(Math.floor(x / lot + 1e-6) * lot); }
function defaultQty(){
  const lot = SY.lot; if (!TR || TR.mode !== 'stock') return lot;
  const px = curPrice(); if (!isFinite(px)) return lot;
  return Math.max(lot, rq(Math.floor(0.2 * TR.cash0 / (px * SY.mult) / lot) * lot));
}
/* ghi 1 điểm đường vốn tại TR.T, cập nhật đỉnh và sụt giảm lớn nhất */
function markEquity(){
  const e = equity(), q = TR.eq, last = q[q.length - 1], val = +e.toFixed(2);
  if (last && last[0] === TR.T) last[1] = val; else q.push([TR.T, val]);
  if (q.length > 2000) TR.eq = q.filter((x, i) => i % 2 === 0 || i === q.length - 1);
  if (e > TR.peak) TR.peak = e;
  const dd = TR.peak > 0 ? (TR.peak - e) / TR.peak : 0; if (dd > TR.maxDD) TR.maxDD = dd;
  return e;
}

/* ---------- phiên luyện tập ---------- */
function newTR(T, syms, cap){
  const s = {v: 2, id: Date.now(), mode: MODE, cur: SY.cur, syms: syms.slice(), syms0: syms.slice(), active: SYM, tf: S.tf, blind: $('blind').checked, T, startT: T,
    cash0: cap, cash: cap, pos: {}, trades: [], eq: [[T, cap]], peak: cap, maxDD: 0, draws: {}, bh0: {}, bars: 0, barsIn: 0};
  for (const k of s.syms) s.bh0[k] = priceAt(MK[k], T);

}
function startAt(T, syms){
  stopAuto(); closeModal(); if ($('side')) $('side').scrollTop = 0;
  TR = newTR(T, syms, CAP[SY.cur]); LAST = null; S.auto = true; S.sel = null; pending = null; invalidate();
  S.barW = Math.max(S.barW, 5); S.rightIdx = view().n - 1 + 12;

async function ensureTF(){ if (!MKA) return false; if (tfSmall(S.tf) && !DS['5']){ try { await load5m(MKA); } catch(e){ return false; } } return !!DS[S.tf]; }
/* các mã của phiên: phái sinh = 1 mã; cổ phiếu = rổ cùng thị trường (mã không nạp được bị bỏ qua) */
async function prepSyms(){
  if (MODE !== 'stock') return [SYM];
  const b = BASKET[SY.mkt].slice(); if (!b.includes(SYM)) b.unshift(SYM);
  const ok = {};
  await Promise.all(b.map(k => loadMarket(k).then(() => { ok[k] = 1; }, () => {})));
  return b.filter(k => ok[k]);
}
function pickRandomT(syms){
  const ds = DS[S.tf], hist = ds.dur >= 7 * 86400 ? 60 : ds.dur >= 86400 ? 150 : 300;
  const y0 = +$('ry0').value, y1 = +$('ry1').value;
  const a = localToT(Math.min(y0, y1), 1, 1), b = localToT(Math.max(y0, y1) + 1, 1, 1);
  let i0 = Math.max(hist, lowerBound(ds, a)), i1 = Math.min(ds.n - 40, lowerBound(ds, b) - 1);
  if (syms.length > 1){   // mọi mã của rổ phải có ≥150 nến ngày trước mốc và còn ≥40 nến của khung đang xem sau mốc
    let lo = -Infinity, hi = Infinity;
    for (const k of syms){ const d = MK[k].DS['D'], x = MK[k].DS[S.tf] || d; if (d.n < 151 || x.n < 41) return null; lo = Math.max(lo, d.t[149] + d.dur); hi = Math.min(hi, x.t[x.n - 40]); }
    i0 = Math.max(i0, lowerBound(ds, lo)); i1 = Math.min(i1, lowerBound(ds, hi) - 1);
  }
  if (i1 <= i0) return null;
  const j = i0 + Math.floor(Math.random() * (i1 - i0 + 1));
  return ds.t[j] + ds.dur;
}
let starting = false;
async function startRandom(){
  if (starting || TR) return; starting = true;
  try {
    if (!(await ensureTF())) return;
    const syms = await prepSyms(), T = pickRandomT(syms);
    if (T == null){ toast(t('no_range'), 3000); return; }
    startAt(T, syms);
  } finally { starting = false; }
}
$('bRand').onclick = startRandom;
$('bAt').onclick = async () => {

/* kết thúc phiên: đóng mọi vị thế ở giá hiện tại; reason = user | eod | bust */
function endSession(reason, quiet){
  if (!TR) return;
  stopAuto();
  for (const k of openKeys()){ const p = TR.pos[k]; let px = curPrice(k); if (!isFinite(px)) px = p.avg; fill(k, -p.side, p.qty, px, TR.T - 1, reason === 'bust' ? 'bust' : 'end'); }
  const e = markEquity();
  const sess = TR; sess.endT = sess.T; sess.reason = reason; sess.equity = +e.toFixed(2);
  LAST = sess; TR = null; saveTR(); saveHist(sess); invalidate();

}
$('bNew').onclick = () => { if (openKeys().length && !confirm(t('confirm_close_all'))) return; endSession('user', true); startRandom(); };
$('bQuit').onclick = () => { if (openKeys().length && !confirm(t('confirm_close_all'))) return; endSession('user'); };
$('bQuitTop').onclick = () => { if (TR) $('bQuit').onclick(); };
function lastT(mk){ let x = 0; for (const k of ['5', '60', 'D']){ const d = mk.DS[k]; if (d) x = Math.max(x, d.t[d.n - 1] + d.dur); } return x; }
function stepBars(n){
  if (!TR) return;
  for (let s = 0; s < n; s++){
    const v = view();
    if (!v.ds || v.nc >= v.ds.n){ stopAuto(); if (v.ds && (!tfSmall(S.tf) || TR.T >= lastT(MKA) - 1)){ endSession('eod'); return; } toast(t('no_more')); break; }
    const ev = advanceTo(v.ds.t[v.nc] + v.ds.dur); invalidate();
    if (!TR) return;                               // cháy tài khoản -> phiên đã kết thúc
    if (ev){ stopAuto(); break; }
  }
  // giữ nến cuối trong khung nhìn
  const v = view(), vis = pw() / S.barW;
  if (S.rightIdx < v.n + 2) S.rightIdx = Math.max(S.rightIdx, v.n - 1 + Math.min(12, vis * 0.2));
  saveTR(); updPanel(); renderBasket(); req();
}
/* tiến đồng hồ chung tới target: xử lý SL/TP cho MỌI mã đang có vị thế, mỗi mã trên nến cơ sở của chính nó */
function advanceTo(target){
  let ev = false; const T0 = TR.T, keys = openKeys();
  for (const k of keys) if (MK[k] && advanceSym(k, T0, target)) ev = true;
  TR.T = target; TR.bars = (TR.bars || 0) + 1; if (keys.length) TR.barsIn = (TR.barsIn || 0) + 1;
  if (markEquity() <= 0){ endSession('bust'); return true; }
  return ev;
}
function advanceSym(key, T0, target){
  const mk = MK[key]; let T = T0, ev = false, guard = 0, force = null;
  while (T < target && guard++ < 6){
    const b = force || baseFor(mk, T); force = null; let i = closedCount(b, T);
    while (i < b.n && b.t[i] + b.dur <= target){ if (processBar(key, b, i)) ev = true; i++; }
    if (b === mk.DS['5'] && i >= b.n && b.t[b.n - 1] + b.dur < target){      // hết nến 5m (bạc: 5m dừng ở mốc nối) -> đi tiếp bằng 1H / ngày
      T = Math.max(T, b.t[b.n - 1] + b.dur); force = mk.DS['60'] || mk.DS['D'];   // baseFor(T) tại đúng mốc cuối 5m vẫn trả 5m nên phải chỉ định
      if (!force || force === b) break; continue; }
    const e = i > 0 ? b.t[i - 1] + b.dur : T;                 // vừa đi qua mốc có nến mịn hơn -> chuyển cơ sở
    if (e > T && e < target && baseFor(mk, e) !== b){ T = e; continue; }
    break;
  }
  return ev;
}
/* 1 nến cơ sở: gap qua SL/TP khớp giá Open; chạm cả hai trong 1 nến thì tính SL trước */
function processBar(key, b, i){
  const p = TR.pos[key]; if (!p || !p.qty) return false;
  const s = p.side, o = b.o[i], h = b.h[i], l = b.l[i], sl = p.sl, tp = p.tp, tr = p.trade, m = SYMS[key].mult;
  let px = null, why = null;
  if (sl != null && (s > 0 ? o <= sl : o >= sl)){ px = o; why = 'slgap'; }
  else if (tp != null && (s > 0 ? o >= tp : o <= tp)){ px = o; why = 'tpgap'; }
  else if (sl != null && (s > 0 ? l <= sl : h >= sl)){ px = sl; why = 'sl'; }
  else if (tp != null && (s > 0 ? h >= tp : l <= tp)){ px = tp; why = 'tp'; }
  let worst = s > 0 ? l : h, best = s > 0 ? h : l;
  if (px != null){ worst = s > 0 ? Math.min(o, px) : Math.max(o, px); best = s > 0 ? Math.max(o, px) : Math.min(o, px); }
  tr.mae = Math.min(tr.mae, tr.realized + (worst - p.avg) * p.qty * m * s);
  tr.mfe = Math.max(tr.mfe, tr.realized + (best - p.avg) * p.qty * m * s);
  if (px != null){ fill(key, -s, p.qty, px, b.t[i], why); return true; }
  return false;
}
/* khớp 1 lệnh. Phái sinh: tiền mặt đổi theo lãi/lỗ đã chốt và phí. Cổ phiếu: mua trừ tiền, bán cộng tiền. */
function fill(key, side, qty, px, tm, why){
  const p = posOf(key), sy = SYMS[key], fee = feeSide(key, side, px, qty), stock = TR.mode === 'stock';
  if (!p.qty){
    p.trade = {id: Date.now() + Math.random(), sym: key, tf: S.tf, side, start: tm, fills: [], realized: 0, fees: 0, maxQty: 0, initQty: qty, entry: px, initSL: p.sl, mae: 0, mfe: 0, blind: TR.blind};
    p.side = side; p.qty = qty; p.avg = px;
  } else if (side === p.side){ p.avg = (p.avg * p.qty + px * qty) / (p.qty + qty); p.qty = rq(p.qty + qty); }
  else { const g = (px - p.avg) * qty * sy.mult * p.side; p.trade.realized += g; p.qty = rq(p.qty - qty); if (!stock) TR.cash += g; }
  if (stock) TR.cash -= side * px * qty * sy.mult;
  TR.cash -= fee;
  const tr = p.trade;
  tr.maxQty = Math.max(tr.maxQty, p.qty); tr.fees += fee;
  tr.fills.push({t: tm, side, qty, px, fee, why, pos: p.qty});
  if (!p.qty){ finishTrade(key, tr, tm); return true; }
  return false;
}
function finishTrade(key, tr, tm){
  tr.end = tm; TR.trades.push(tr); TR.pos[key] = POS0();
  const sm = summarize(tr); tr.sum = sm;
  JOURNAL.push(sm); if (JOURNAL.length > 5000) JOURNAL.splice(0, JOURNAL.length - 5000); LS.set('sg_journal', JOURNAL);
  if (key === SYM) syncOrderInputs();
  renderJournal();
  toast(t('toast_closed', TR.mode === 'stock' ? '' : sideName(tr.side), SYMS[key].name, fU(sm.net, TR.cur), sm.R != null ? ' (' + (sm.R >= 0 ? '+' : '−') + fx(Math.abs(sm.R), 1) + 'R)' : '').replace('  ', ' '), 3500);
}
function summarize(tr){
  const ent = tr.fills.filter(f => f.side === tr.side), ex = tr.fills.filter(f => f.side !== tr.side), sy = SYMS[tr.sym], m = sy.mult;
  const vw = a => a.reduce((s, f) => s + f.px * f.qty, 0) / a.reduce((s, f) => s + f.qty, 0);
  const net = tr.realized - tr.fees, risk = tr.initSL != null ? Math.abs(tr.entry - tr.initSL) * tr.initQty * m : null;
  const D = MK[tr.sym] ? MK[tr.sym].DS : {}, ds = D[tr.tf] || D['60'] || D['D'];
  return {id: tr.id, sess: TR ? TR.id : null, sym: tr.sym, cur: sy.cur, mode: sy.cls, tf: tr.tf, side: tr.side, start: tr.start, end: tr.end, entry: vw(ent), exit: vw(ex), maxQty: tr.maxQty, adds: ent.length - 1,
    gross: tr.realized, fees: tr.fees, net, R: risk ? net / risk : null, risk, mae: tr.mae, mfe: tr.mfe,
    bars: ds ? Math.max(1, closedCount(ds, tr.end + 1) - closedCount(ds, tr.start + 1) + 1) : 1, hours: (tr.end - tr.start) / 3600,
    pct: net / (vw(ent) * tr.maxQty * m) * 100, why: ex.length ? ex[ex.length - 1].why : ''};
}

/* ---------- đặt lệnh ---------- */
function readNum(id){ const v = parseFloat($(id).value); return isFinite(v) ? v : null; }
function market(side){
  if (!TR || !MKA) return;
  const key = SYM, sy = SY, lot = sy.lot, stock = TR.mode === 'stock', un = qUnit();
  let q = normQty(readNum('qty'), lot); if (!(q >= lot)){ toast(t('qty_min', fQ(lot), un)); return; }
  const px = curPrice(key); if (!isFinite(px)){ toast(t('no_price')); return; }
  const tm = TR.T - 1, p = posOf(key);
  let sl = readNum('slIn'), tp = readNum('tpIn');
  if (stock && side < 0){                       // cổ phiếu: chỉ bán thứ đang có
    if (!p.qty){ toast(t('no_short', sy.name)); return; }
    q = Math.min(q, p.qty); p.sl = sl; p.tp = tp;
    fill(key, -1, q, px, tm, q >= p.qty ? 'close' : 'part'); afterOrder(); return;
  }
  if (p.qty && side !== p.side){                // phái sinh: đóng bớt, vượt quá số đang có thì đảo chiều
    const c = Math.min(q, p.qty), rest = rq(q - c), full = c >= p.qty;
    if (rest > 0 && !marginOK(key, rest, px, key)) return;
    p.sl = sl; p.tp = tp;
    fill(key, side, c, px, tm, full ? (rest > 0 ? 'rev' : 'close') : 'part');
    if (!(rest > 0)){ afterOrder(); return; }
    q = rest; sl = null; tp = null;
  }
  const np = posOf(key);
  if (stock){ const cost = px * q * sy.mult + feeSide(key, 1, px, q); if (cost > TR.cash + 1e-6){ toast(t('no_cash', fQ(maxBuy(key, px)), un), 3500); afterOrder(); return; } }
  else if (np.qty && !marginOK(key, q, px, null)){ afterOrder(); return; }
  else if (!np.qty && p === np && !marginOK(key, q, px, null)){ afterOrder(); return; }
  if (!np.qty){
    if (sl == null && $('autoSL').checked){ const a = curATR(), k = readNum('slK') || 2; if (isFinite(a)) sl = +(px - side * k * a).toFixed(sy.dp); }
    if (sl != null && (side > 0 ? sl >= px : sl <= px)){ toast(t(side > 0 ? 'sl_below' : 'sl_above', fP(px)), 3000); np.sl = null; afterOrder(); return; }
    if (tp != null && (side > 0 ? tp <= px : tp >= px)){ toast(t(side > 0 ? 'tp_above' : 'tp_below'), 3000); tp = null; }
    np.sl = sl; np.tp = tp;
    fill(key, side, q, px, tm, 'open');
  } else { np.sl = sl; np.tp = tp; fill(key, side, q, px, tm, 'add'); }
  afterOrder();
}
/* ký quỹ: Σ |KL|·giá·mult·mr sau lệnh không được vượt vốn hiện có. skip = mã sẽ được đóng hết trước (đảo chiều) */
function marginOK(key, q, px, skip){
  let need = q * px * SYMS[key].mult * (SYMS[key].mr || 1), e = equity();

}

function copyText(s){
  const old = () => { try { const ta = document.createElement('textarea'); ta.value = s; ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return !!ok; } catch(e){ return false; } };

/* ---------- tổng kết phiên ---------- */
/* các mã dùng cho đường mua-và-giữ: rổ lúc bắt đầu phiên, có giá tại mốc bắt đầu và đã nạp dữ liệu */
function bhKeys(sess){ return (sess.syms0 || sess.syms).filter(k => MK[k] && sess.bh0 && sess.bh0[k] > 0); }
/* giá trị mua-và-giữ tại T: chia đều vốn đầu cho các mã, không đòn bẩy, không phí. Chỉ gọi cho phiên ĐÃ kết thúc với T ≤ endT. */
function bhAt(sess, T){
  let s = 0, n = 0;
  for (const k of bhKeys(sess)){ const px = priceAt(MK[k], T); if (isFinite(px)){ s += px / sess.bh0[k]; n++; } }
  return n ? sess.cash0 * s / n : NaN;
}
function sessStats(sess){
  const L = sess.trades.map(x => x.sum), n = L.length, w = L.filter(x => x.net > 0), lo = L.filter(x => x.net <= 0);
  const gw = w.reduce((s, x) => s + x.net, 0), gl = -lo.reduce((s, x) => s + x.net, 0), Rs = L.filter(x => x.R != null);
  const eqv = sess.equity != null ? sess.equity : sess.cash0, pnl = eqv - sess.cash0, ret = pnl / sess.cash0 * 100;
  const bhE = bhAt(sess, sess.endT != null ? sess.endT : sess.T), bh = isFinite(bhE) ? (bhE / sess.cash0 - 1) * 100 : null;
  let best = null, worst = null; const by = {};
  for (const x of L){
    if (!best || x.net > best.net) best = x; if (!worst || x.net < worst.net) worst = x;
    const o = by[x.sym] || (by[x.sym] = {n: 0, net: 0, w: 0}); o.n++; o.net += x.net; if (x.net > 0) o.w++;
  }
  return {n, win: n ? w.length / n * 100 : null, pf: gl > 0 ? gw / gl : gw > 0 ? Infinity : null, avgW: w.length ? gw / w.length : null, avgL: lo.length ? -gl / lo.length : null, best, worst,
    avgR: Rs.length ? Rs.reduce((s, x) => s + x.R, 0) / Rs.length : null, dd: (sess.maxDD || 0) * 100, fees: L.reduce((s, x) => s + x.fees, 0),
    inPos: sess.bars ? (sess.barsIn || 0) / sess.bars * 100 : null, bars: sess.bars || 0, pnl, ret, bh, vs: bh != null ? ret - bh : null, by};
}
const pfTxt = pf => pf == null ? '–' : isFinite(pf) ? fx(pf, 2) : '∞';
const sessNames = sess => sess.syms.map(k => SYMS[k] ? SYMS[k].name : String(k));
function sessText(sess, st){
  const tfl = tfLab(sess.tf, SYMS[sess.syms[0]] || SY);
  return ['StockGym · ' + sessNames(sess).join(', ') + ' · ' + tfl + ' · ' + fDate(sess.startT) + ' → ' + fDate(sess.endT) + ' (' + t('se_bars_v', st.bars) + ')',
    t('share_res') + ': ' + fU(st.pnl, sess.cur) + ' (' + fPc(st.ret) + ')' + (st.bh != null ? ' · ' + t('se_bh') + ': ' + fPc(st.bh) : ''),
    t('share_tr', st.n, st.win != null ? st.win.toFixed(0) + '%' : '–', pfTxt(st.pf), fx(st.dd, 2)),
    'https://stockgym.github.io/'].join('\n');
}
/* đường vốn (từ sess.eq) + đường mua-và-giữ; trục ngang theo số bước nến */
function drawEqCurve(c, sess){
  if (!c || !c.getContext || !sess) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, w = r.width, h = r.height; if (!(w > 0 && h > 0)) return;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const c0 = sess.cash0, E = sess.eq.length > 1 ? sess.eq : [[sess.startT, c0], [sess.endT || sess.startT, sess.equity != null ? sess.equity : c0]];
  const n = E.length, B = E.map(p => bhAt(sess, p[0]));
  let mn = c0, mx = c0;
  for (let i = 0; i < n; i++){ mn = Math.min(mn, E[i][1]); mx = Math.max(mx, E[i][1]); if (isFinite(B[i])){ mn = Math.min(mn, B[i]); mx = Math.max(mx, B[i]); } }
  const pad = (mx - mn) * 0.08 || c0 * 0.01, lo = mn - pad, hi = mx + pad;
  const X0 = 8, X1 = w - 64, Y0 = 6, Y1 = h - 22, x = i => X0 + i / (n - 1) * (X1 - X0), y = v => Y0 + (hi - v) / (hi - lo) * (Y1 - Y0);
  g.font = '11px ui-monospace,Consolas,monospace'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round';
  const lab = v => { g.fillStyle = '#93a1ae'; g.fillText(fPc((v / c0 - 1) * 100), X1 + 6, y(v)); };
  g.strokeStyle = '#3a4756'; g.lineWidth = 1; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(X0, y(c0)); g.lineTo(X1, y(c0)); g.stroke(); g.setLineDash([]);
  lab(c0); if (Math.abs(y(mx) - y(c0)) > 14) lab(mx); if (Math.abs(y(mn) - y(c0)) > 14) lab(mn);
  const line = (val, col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); let on = false;
    for (let i = 0; i < n; i++){ const v = val(i); if (!isFinite(v)) continue; if (on) g.lineTo(x(i), y(v)); else { g.moveTo(x(i), y(v)); on = true; } } g.stroke(); };
  line(i => B[i], '#e0a43a', 1.4);
  const up = E[n - 1][1] >= c0;
  g.beginPath(); g.moveTo(x(0), y(c0)); for (let i = 0; i < n; i++) g.lineTo(x(i), y(E[i][1])); g.lineTo(x(n - 1), y(c0)); g.closePath(); g.fillStyle = up ? 'rgba(38,166,154,.13)' : 'rgba(239,83,80,.13)'; g.fill();
  line(i => E[i][1], up ? '#26a69a' : '#ef5350', 2);
  g.fillStyle = '#66737f'; g.textAlign = 'left'; g.fillText(fDate(E[0][0]), X0, h - 10); g.textAlign = 'right'; g.fillText(fDate(E[n - 1][0]), X1, h - 10);
}
/* bảng tổng kết khi kết thúc phiên (ngày thật luôn hiện, kể cả khi phiên ẩn ngày) */
function showSessionEnd(sess){
  if (!sess) return;
  const miss = (sess.syms0 || []).filter(k => SYMS[k] && !MK[k] && !SYMS[k].missing && !LOADING[k]);
  if (miss.length) Promise.all(miss.map(k => loadMarket(k).catch(() => {}))).then(() => { if (MODAL_ID === 'sum' && LAST === sess) showSessionEnd(sess); });
  const st = sessStats(sess), cur = sess.cur, stock = sess.mode === 'stock', pnl = st.pnl, names = sessNames(sess), tfl = tfLab(sess.tf, SYMS[sess.syms[0]] || SY), nb = bhKeys(sess).length;
  const stat = (lab, val, c) => `<div class="stat"><small>${lab}</small><b class="${c || ''}">${val}</b></div>`;
  const cells = [
    stat(t('se_period'), fDate(sess.startT) + ' → ' + fDate(sess.endT)),
    stat(t('se_bars'), t('se_bars_v', st.bars) + ' ' + tfl),
    stat(t('se_trades'), st.n),
    stat(t('se_win'), st.win != null ? st.win.toFixed(0) + '%' : '–'),
    stat(t('j_pf'), pfTxt(st.pf)),
    stat(t('j_avgwl'), (st.avgW != null ? fN(st.avgW, cur) : '–') + ' / ' + (st.avgL != null ? fN(st.avgL, cur) : '–')),
    stat(t('se_best'), st.best ? fU(st.best.net, cur) : '–', st.best ? cls(st.best.net) : ''),
    stat(t('se_worst'), st.worst ? fU(st.worst.net, cur) : '–', st.worst ? cls(st.worst.net) : ''),
    stat(t('j_r'), st.avgR != null ? fx(st.avgR, 2) + ' R' : '–'),
    stat(t('se_dd'), '−' + fx(st.dd, 2) + '%'),
    stat(t('j_fees'), '−' + fM(st.fees, null, cur)),
    stat(t('se_inpos'), st.inPos != null ? st.inPos.toFixed(0) + '%' : '–'),
    stat(t('se_bh'), st.bh != null ? fPc(st.bh) : '–', st.bh != null ? cls(st.bh) : ''),
    stat(t('se_vs'), st.vs != null ? fPc(st.vs).replace('%', ' ' + t('pp')) : '–', st.vs != null ? cls(st.vs) : '')];
  let h = `<h2>${t('se_' + sess.reason)}</h2>
    <div class="muted">${esc(names.join(', '))} · ${tfl} · ${fDate(sess.startT)} → ${fDate(sess.endT)}</div>
    <div class="netbig ${cls(pnl)}">${fU(pnl, cur)} <span style="font-size:.68em">(${fPc(st.ret)})</span></div>
    <div class="muted">${t('se_cap', fM(sess.cash0, null, cur), fM(sess.equity, null, cur))}${fV(1, cur) ? ' · ' + fV(pnl, cur) : ''}</div>
    <div class="lg"><span><i style="background:${pnl >= 0 ? '#26a69a' : '#ef5350'}"></i>${t('se_you')}</span>${nb ? `<span><i style="background:#e0a43a"></i>${stock ? t('se_bh_s', nb) : t('se_bh_d', esc(names[0]))}</span>` : ''}</div>
    <canvas id="eqCv"></canvas>
    <div class="stats">${cells.join('')}</div>
    <a class="learncta" href="${learnUrl()}" target="_blank" rel="noopener"><span class="ic">📚</span><span class="tx"><b>${t('se_learn_h')}</b><span>${t('se_learn_p')}</span></span><span class="go">${t('se_learn_go')}</span></a>`;
  const syk = Object.keys(st.by);
  if (stock && syk.length){
    syk.sort((a, b) => st.by[b].net - st.by[a].net);
    h += `<h3>${t('se_by_sym')}</h3><div class="tw"><table><tr><th>${t('th_sym')}</th><th>${t('th_n')}</th><th>${t('j_win')}</th><th>${t('th_net')} ${curSym(cur)}</th><th>${t('se_contrib')}</th></tr>` +
      syk.map(k => { const o = st.by[k]; return `<tr><td><b>${esc(SYMS[k] ? SYMS[k].name : k)}</b></td><td>${o.n}</td><td>${(o.w / o.n * 100).toFixed(0)}%</td><td class="${cls(o.net)}">${fU(o.net, cur)}</td><td class="${cls(o.net)}">${fPc(o.net / sess.cash0 * 100)}</td></tr>`; }).join('') + '</table></div>';
  }
  if (st.n){
    h += `<h3 style="margin-top:14px">${t('se_trades_h')}</h3><div class="tw"><table><tr><th>#</th><th>${stock ? t('th_sym') : t('th_side')}</th><th>${t('th_in')}</th><th>${t('th_qty')}</th><th>${t('th_net')} ${curSym(cur)}</th><th>%</th><th>R</th><th>${t('th_out')}</th></tr>` +
      sess.trades.map((x, k) => { const s = x.sum; return `<tr class="click" data-i="${k}"><td>${k + 1}</td><td class="${stock ? '' : s.side > 0 ? 'pos' : 'neg'}">${stock ? esc(SYMS[s.sym] ? SYMS[s.sym].name : s.sym) : s.side > 0 ? 'LONG' : 'SHORT'}</td><td>${fDS(s.start)}</td><td>${fQ(s.maxQty)}</td>` +
        `<td class="${cls(s.net)}">${fN(s.net, cur)}</td><td class="${cls(s.net)}">${fx(s.pct, 2)}</td><td>${s.R != null ? fx(s.R, 2) : '–'}</td><td>${s.why ? t('why_' + s.why) : ''}</td></tr>`; }).join('') + '</table></div>';
  } else h += `<div class="muted">${t('se_no_tr')}</div>`;
  h += `<div class="mbtns"><button class="b pri" id="mNew">${t('b_new')}</button><button class="b" id="mRev">${t('se_review')}</button><button class="b" id="mCopy">${t('se_copy')}</button></div>`;
  openModal('sum', h, {wide: true}); $('toast').style.display = 'none';
  drawEqCurve($('eqCv'), sess);
  $('mRev').onclick = closeModal;
  $('mNew').onclick = () => { closeModal(); startRandom(); };
  $('mCopy').onclick = () => copyText(sessText(sess, st)).then(ok => toast(t(ok ? 'copied' : 'copy_fail')));
  $('mbox').querySelectorAll('tr[data-i]').forEach(r => r.onclick = () => { const tr = sess.trades[+r.dataset.i]; if (tr) showTrade(tr, () => showSessionEnd(sess)); });
}

/* ---------- lịch sử phiên (sg_sessions, tối đa 200) ---------- */
let HIST = LS.get('sg_sessions', []); if (!Array.isArray(HIST)) HIST = [];
function saveHist(sess){
  if (!(sess.bars > 0) && !sess.trades.length) return;
  const st = sessStats(sess), r3 = x => x != null && isFinite(x) ? +x.toFixed(3) : null;
  HIST.push({id: sess.id, at: Date.now(), mode: sess.mode, cur: sess.cur, syms: sess.syms.slice(), tf: sess.tf, startT: sess.startT, endT: sess.endT, cash0: sess.cash0, equity: sess.equity,
    ret: r3(st.ret), n: st.n, win: r3(st.win), dd: r3(st.dd), bh: r3(st.bh), bars: st.bars, reason: sess.reason});
  if (HIST.length > 200) HIST.splice(0, HIST.length - 200);
  LS.set('sg_sessions', HIST);
}
function renderHistory(){
  const A = HIST.filter(x => x && typeof x.ret === 'number' && isFinite(x.ret) && Array.isArray(x.syms)), n = A.length;
  $('histBtns').style.display = n ? '' : 'none';
  if (!n){ $('histStat').innerHTML = ''; $('histT').innerHTML = `<span class="muted">${t('hist_none')}</span>`; return; }
  const w = A.filter(x => x.ret > 0).length, avg = A.reduce((s, x) => s + x.ret, 0) / n, V = A.filter(x => typeof x.bh === 'number');
  let best = -Infinity, worst = Infinity; for (const x of A){ if (x.ret > best) best = x.ret; if (x.ret < worst) worst = x.ret; }
  const rows = [[t('hist_n'), n], [t('hist_win'), (w / n * 100).toFixed(0) + '%'], [t('hist_avg'), `<span class="${cls(avg)}">${fPc(avg)}</span>`],
    [t('hist_bw'), `<span class="${cls(best)}">${fPc(best)}</span> / <span class="${cls(worst)}">${fPc(worst)}</span>`]];
  if (V.length){ const v = V.reduce((s, x) => s + x.ret - x.bh, 0) / V.length; rows.push([t('hist_vs'), `<span class="${cls(v)}">${fPc(v).replace('%', ' ' + t('pp'))}</span>`]); }
  $('histStat').innerHTML = rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
  const nm = x => { const a = x.syms.map(k => SYMS[k] ? SYMS[k].name : String(k)); return esc(a.length > 2 ? a[0] + ' +' + (a.length - 1) : a.join(', ')); };
  $('histT').innerHTML = `<table><tr><th>${t('th_when')}</th><th>${t('th_sym')}</th><th>${t('th_tf')}</th><th>${t('th_ret')}</th><th>${t('th_n')}</th></tr>` +
    A.slice(-8).reverse().map(x => `<tr><td>${fLocalDS(+x.at || 0)}</td><td>${nm(x)}</td><td>${esc(tfLab(String(x.tf), SYMS[x.syms[0]] || SY))}</td><td class="${cls(x.ret)}">${fPc(x.ret)}</td><td>${+x.n || 0}</td></tr>`).join('') +
    '</table>' + (n > 8 ? `<div class="muted">${t('hist_last', 8, n)}</div>` : '');
}

  const h = `<div class="onbTop"><span class="muted">${t('onb_step', i + 1, 4)}</span><span class="grp seg">${['vi', 'en'].map(l => `<button class="b${l === LANG ? ' on' : ''}" data-ol="${l}">${l.toUpperCase()}</button>`).join('')}</span></div>
    <div class="ill">${ills[i]}</div><h2>${t('onb' + (i + 1) + '_h')}</h2><p>${t('onb' + (i + 1) + '_p')}</p>
    <div class="dots">${[0, 1, 2, 3].map(k => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="mbtns">${i < 3 ? `<button class="b" id="oSkip">${t('onb_skip')}</button>` : ''}${i > 0 ? `<button class="b" id="oBack">${t('onb_back')}</button>` : ''}<button class="b pri" id="oNext">${i < 3 ? t('onb_next') : TR ? t('close') : t('b_fab')}</button></div>`;
  openModal('onb', h, {onClose: () => LS.set('sg_onb', 1)});

  $('oNext').onclick = () => { if (i < 3){ showOnb(i + 1); return; } closeModal(); if (!TR) startRandom(); };
}
function firstVisit(){ if (!LS.get('sg_onb', 0)) showOnb(0); }
$('bHelp').onclick = () => showOnb(0);

/* ---------- góp ý người dùng (VOC). Không gửi gì khi người dùng chưa bấm "Gửi". ---------- */
const FB = {rating: 0, type: 'feature', text: '', contact: ''};
function fbCtx(){ return 'v' + VERSION + ' · ' + LANG + ' · ' + MODE + ' · ' + SYM; }     // chỉ gồm: phiên bản trang, ngôn ngữ, chế độ, mã đang xem
function fbBody(d){
  return t('fb_rating') + ': ' + (d.rating ? '★'.repeat(d.rating) + '☆'.repeat(5 - d.rating) + ' (' + d.rating + '/5)' : '–') + '\n' + t('fb_type') + ': ' + t('fb_t_' + d.type) + '\n\n' + d.text +
    (d.contact ? '\n\n' + t('fb_contact') + ': ' + d.contact : '') + '\n\n---\n' + d.ctx;
}
function fbIssueUrl(d){
  const cut = (x, n) => Array.from(x).slice(0, n).join('');              // cắt theo ký tự Unicode, không chẻ đôi emoji (encodeURIComponent sẽ ném lỗi)
  const title = '[' + t('fb_t_' + d.type) + '] ' + cut(d.text.replace(/\s+/g, ' '), 70), mk = b => FEEDBACK.issues + '?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(b);
  let text = d.text, url = mk(fbBody(d));
  while (url.length > 6000 && text.length > 100){ text = cut(text, Math.floor(Array.from(text).length * 0.8)); url = mk(fbBody(Object.assign({}, d, {text: text + ' …'}))); }
  return url;
}
function showFeedback(){
  const types = ['bug', 'feature', 'data', 'other'];
  const keep = () => { const tx = $('fbText'); if (!tx) return; FB.text = String(tx.value || '').slice(0, 2000); FB.type = types.includes($('fbType').value) ? $('fbType').value : 'other'; FB.contact = String($('fbContact').value || '').slice(0, 120); };
  openModal('fb', `<h2>${t('fb_h')}</h2><p>${t('fb_desc')}</p>
    <div class="muted">${t('fb_rating')}</div><div class="stars" id="fbStars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-s="${n}" title="${esc(t('fb_star_tt', n))}">★</button>`).join('')}</div>
    <div class="row"><label for="fbType">${t('fb_type')}</label><select id="fbType" class="grow">${types.map(k => `<option value="${k}">${t('fb_t_' + k)}</option>`).join('')}</select></div>
    <textarea id="fbText" rows="6" maxlength="2000" placeholder="${esc(t('fb_ph'))}"></textarea>
    <div class="muted" style="text-align:right" id="fbCnt"></div>
    <div class="row"><label for="fbContact">${t('fb_contact')}</label><input type="text" id="fbContact" class="grow" maxlength="120" placeholder="${esc(t('fb_contact_ph'))}"></div>
    <div class="muted">${t('fb_ctx')}: <code id="fbCtx"></code></div>
    <div class="muted" style="margin-top:6px">${t(FEEDBACK.gform ? 'fb_private' : 'fb_public')}</div>
    <div class="mbtns"><button class="b pri" id="fbSend">${t('fb_send')}</button><button class="b" id="fbCopy">${t('fb_copy')}</button></div>
    <div id="fbMsg"></div>`, {onClose: keep});
  const tx = $('fbText'), msg = s => { $('fbMsg').textContent = s; };
  tx.value = FB.text; $('fbType').value = FB.type; $('fbContact').value = FB.contact; $('fbCtx').textContent = fbCtx();
  const cnt = () => { $('fbCnt').textContent = String(tx.value || '').length + '/2000'; };
  const stars = () => $('fbStars').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.s <= FB.rating));
  $('fbStars').querySelectorAll('button').forEach(b => b.onclick = () => { FB.rating = FB.rating === +b.dataset.s ? 0 : +b.dataset.s; stars(); });
  tx.oninput = cnt; cnt(); stars();
  const read = () => { keep(); return {rating: FB.rating, type: FB.type, text: FB.text.trim(), contact: FB.contact.trim(), ctx: fbCtx()}; };
  $('fbCopy').onclick = () => { const d = read(); if (!d.text){ msg(t('fb_need')); tx.focus(); return; } copyText(fbBody(d)).then(ok => msg(t(ok ? 'copied' : 'copy_fail'))); };
  $('fbSend').onclick = () => {
    const d = read(); if (!d.text){ msg(t('fb_need')); tx.focus(); return; }
    if (FEEDBACK.gform){
      const fd = new FormData(); for (const k of ['rating', 'type', 'text', 'contact', 'ctx']) if (FEEDBACK.entry[k]) fd.append(FEEDBACK.entry[k], String(d[k] || ''));
      msg(t('fb_sending')); $('fbSend').disabled = true;
      fetch(FEEDBACK.gform, {method: 'POST', mode: 'no-cors', body: fd}).then(() => { FB.text = ''; FB.rating = 0; tx.value = ''; cnt(); stars(); msg(t('fb_sent')); }, () => msg(t('fb_fail'))).then(() => { const b = $('fbSend'); if (b) b.disabled = false; });
      return;
    }
    let url; try { url = fbIssueUrl(d); } catch(e){ copyText(fbBody(d)); msg(t('fb_fail')); return; }
    copyText(fbBody(d));
    try { window.open(url, '_blank', 'noopener'); } catch(e){}
    const m = $('fbMsg'), a = document.createElement('a'); m.textContent = t('fb_opened') + ' ';
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('fb_open_link'); m.appendChild(a);
  };
}
$('bFb').onclick = showFeedback;
function learnUrl(){ return 'learn.html?lang=' + LANG; }
$('bLearn').onclick = () => { window.open(learnUrl(), '_blank'); };

/* ---------- bộ đếm người dùng: mỗi trình duyệt chỉ cộng 1 lần, lỗi mạng thì bỏ qua. Không chạy trong app / máy cục bộ ---------- */
var USERS = 0;
function updCount(){ const e = $('creditN'); if (e) e.textContent = USERS > 0 ? ' · ' + USERS.toLocaleString(LANG === 'vi' ? 'vi-VN' : 'en-US') + ' ' + t('credit_n') : ''; }
(function(){
  if (location.protocol !== 'https:' || typeof fetch !== 'function') return;
  const seen = LS.get('sg_cnt', 0);
  fetch('https://abacus.jasoncameron.dev/' + (seen ? 'get' : 'hit') + '/stockgym-site/visitors').then(r => r.json())
    .then(j => { if (j && j.value > 0){ USERS = +j.value; if (!seen) LS.set('sg_cnt', 1); updCount(); } }).catch(() => {});
})();

/* ---------- khởi động ---------- */
(async function init(){
  applyI18n();
  new ResizeObserver(resize).observe($('cw'));
  let qs = null; try { qs = new URLSearchParams(location.search).get('s'); } catch(e){}
  if (!SYMS[qs]) qs = null;
  { const m = qs ? SYMS[qs].cls : LS.get('sg_mode', 'deriv'); MODE = m === 'stock' ? 'stock' : 'deriv'; bind(qs || defaultSyms(MODE)[0]); buildToolbar(); }
  let saved = LS.get('sg_session', null);
  if (saved && !(saved.v === 2 && Array.isArray(saved.syms) && saved.syms.length && saved.syms.every(k => SYMS[k]) && saved.pos && Array.isArray(saved.eq) && isFinite(saved.T))) saved = null;
  if (saved){   // tiếp tục phiên đang dở: nạp mọi mã của phiên trước
    try {
      await Promise.all(saved.syms.map(k => loadMarket(k)));
      MODE = saved.mode === 'stock' ? 'stock' : 'deriv'; if (saved.tf && TFL.some(x => x.k === saved.tf)) S.tf = saved.tf;
      TR = saved; if (!TR.draws) TR.draws = {}; if (!TR.bh0) TR.bh0 = {}; if (!Array.isArray(TR.trades)) TR.trades = [];
      await setActive(TR.syms.includes(TR.active) ? TR.active : TR.syms[0]);
      syncOrderInputs(); toast(t('restored'), 2500); return;
    } catch(e){ TR = null; toast(t('restore_fail'), 3500); }
  }
  if (await activateFirst([qs, LS.get('sg_sym_' + MODE, null)].concat(defaultSyms(MODE)))){ firstVisit(); return; }
  for (const m of ['deriv', 'stock']){ MODE = m; if (await activateFirst(defaultSyms(m))){ firstVisit(); return; } }
  toast(t('load_fail_all'), 8000);
})();
</script>
