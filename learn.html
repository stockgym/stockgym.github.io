<script>
const PUB = {"sections":[{"key":"ta","lessons":[{"id":"ta-candles","title":{"vi":"Nến Nhật và hành động giá","en":"Japanese candlesticks and price action"},"summary":{"vi":"Mỗi cây nến kể lại cuộc giằng co giữa người mua và người bán trong một khoảng thời gian. Đọc được nến là đọc được ai đang thắng, nhưng chỉ khi bạn đặt nó vào đúng bối cảnh.","en":"Each candle records the tug-of-war between buyers and sellers over one period. Reading candles tells you who is winning, but only when you read them in context."},"points":[{"h":{"vi":"Cấu tạo một cây nến","en":"Anatomy of a candle"},"p":{"vi":"Một cây nến gồm bốn mức giá: mở cửa, cao nhất, thấp nhất và đóng cửa (OHLC). Phần thân là khoảng giữa giá mở và giá đóng; hai bóng nến (râu) là phần giá đã chạm tới nhưng không giữ được. Nến tăng có giá đóng cao hơn giá mở, nến giảm thì ngược lại. Thân dài cho thấy một phe áp đảo, thân ngắn cho thấy lưỡng lự. Bóng trên dài nghĩa là giá bị bán ngược xuống, bóng dưới dài nghĩa là có lực mua đỡ giá lên.","en":"A candle is built from four prices: open, high, low and close (OHLC). The body spans open to close; the wicks (shadows) show prices that were reached but not held. A bullish candle closes above its open, a bearish one below. A long body means one side dominated, a short body means hesitation. A long upper wick shows price was sold back down; a long lower wick shows buyers stepped in and pushed price back up."}},{"h":{"vi":"Mẫu một nến","en":"Single-candle patterns"},"p":{"vi":"Doji có giá mở và giá đóng gần như bằng nhau, thể hiện sự cân bằng tạm thời. Búa (hammer) có thân nhỏ ở phía trên và bóng dưới dài ít nhất gấp đôi thân, xuất hiện sau một nhịp giảm; cùng hình dạng đó sau một nhịp tăng gọi là người treo cổ (hanging man). Sao băng (shooting star) là hình ngược lại: thân nhỏ phía dưới, bóng trên dài, sau một nhịp tăng. Marubozu là nến thân dài gần như không có bóng, cho thấy một phe kiểm soát suốt phiên.","en":"A doji has an open and close that are almost equal and shows a temporary balance. A hammer has a small body at the top and a lower wick at least twice the body, appearing after a decline; the same shape after a rally is called a hanging man. A shooting star is the mirror image: small body at the bottom, long upper wick, after a rally. A marubozu is a long body with almost no wicks, showing one side in control for the whole period."}},{"h":{"vi":"Mẫu hai nến","en":"Two-candle patterns"},"p":{"vi":"Nhấn chìm tăng (bullish engulfing) là một nến tăng có thân bao trùm toàn bộ thân nến giảm trước đó; nhấn chìm giảm là trường hợp ngược lại. Harami là nến thân nhỏ nằm gọn trong thân nến lớn trước nó, báo hiệu đà đang chậm lại. Đường xuyên (piercing line) là nến tăng mở dưới đáy nến giảm trước và đóng trên điểm giữa thân nến đó; mây đen che phủ (dark cloud cover) là phiên bản giảm. Ở thị trường giao dịch gần như liên tục, khoảng trống giá hiếm nên các mẫu này thường không hoàn hảo như sách.","en":"A bullish engulfing is a bullish candle whose body covers the whole body of the previous bearish candle; a bearish engulfing is the opposite. A harami is a small body sitting inside the previous large body and signals that momentum is slowing. A piercing line opens below the prior bearish candle's low and closes above the midpoint of its body; dark cloud cover is the bearish version. In markets that trade almost around the clock, gaps are rare, so these patterns seldom look as clean as in the books."}},{"h":{"vi":"Mẫu ba nến","en":"Three-candle patterns"},"p":{"vi":"Sao mai (morning star) gồm một nến giảm dài, một nến thân nhỏ thể hiện lưỡng lự, rồi một nến tăng dài đóng sâu vào thân nến đầu tiên; sao hôm (evening star) là phiên bản đảo chiều giảm. Ba chàng lính trắng là ba nến tăng liên tiếp có giá đóng cao dần và bóng ngắn; ba con quạ đen là ba nến giảm tương ứng. Mẫu ba nến đáng chú ý hơn mẫu một nến vì nó cho thấy cả quá trình: phe này đuối sức, hai bên cân bằng, rồi phe kia giành quyền.","en":"A morning star is a long bearish candle, then a small-bodied candle showing indecision, then a long bullish candle closing deep into the first body; the evening star is the bearish reversal version. Three white soldiers are three consecutive bullish candles with rising closes and short wicks; three black crows are the bearish equivalent. Three-candle patterns carry more weight than single candles because they show a whole sequence: one side tires, the two sides balance, then the other side takes over."}},{"h":{"vi":"Bối cảnh quyết định ý nghĩa","en":"Context decides the meaning"},"p":{"vi":"Cùng một cây nến búa có thể là tín hiệu đáng xem ở vùng hỗ trợ sau một nhịp giảm dài, và gần như vô nghĩa khi nằm giữa một vùng đi ngang. Trước khi tin một mẫu nến, hãy hỏi ba câu: xu hướng trước đó là gì, nến xuất hiện ở vùng giá nào, và nến kế tiếp có xác nhận không. Khung thời gian lớn (ngày, tuần) ít nhiễu hơn khung 5 phút. Khối lượng tăng ở nến tín hiệu, nếu có dữ liệu, là điểm cộng.","en":"The same hammer can be worth attention at a support zone after a long decline and nearly meaningless in the middle of a sideways range. Before trusting a pattern, ask three questions: what was the prior trend, where on the chart did the candle form, and did the next candle confirm it. Higher timeframes (daily, weekly) are less noisy than the 5-minute chart. Rising volume on the signal candle, where volume data exists, is a plus."}},{"h":{"vi":"Giới hạn của mẫu nến","en":"The limits of candle patterns"},"p":{"vi":"Các nghiên cứu thống kê cho thấy mẫu nến đứng riêng lẻ chỉ có lợi thế rất nhỏ, nhiều mẫu gần như ngang với tung đồng xu sau khi trừ phí. Tên gọi nghe chắc chắn nhưng kết quả thì không. Hãy coi mẫu nến là công cụ chọn thời điểm vào lệnh trong một kế hoạch đã có sẵn xu hướng, vùng giá và điểm cắt lỗ, chứ không phải là lý do duy nhất để giao dịch. Một mẫu nến thất bại cũng là thông tin: nó cho biết phe kia mạnh hơn bạn nghĩ.","en":"Statistical studies show that candle patterns on their own carry only a small edge, and many are close to a coin flip after costs. The names sound certain; the outcomes are not. Treat a pattern as a timing tool inside a plan that already has a trend, a price zone and a stop-loss, not as the only reason to trade. A failed pattern is also information: it tells you the other side is stronger than you thought."}}],"example":{"vi":"Giả sử cổ phiếu X giảm từ 100 xuống vùng 80, nơi giá từng bật lên hai lần trước đó. Phiên hôm nay mở ở 81, có lúc rơi xuống 77,5 rồi đóng cửa ở 81,5. Thân nến chỉ 0,5 trong khi bóng dưới dài 3,5, tức gấp bảy lần thân: đây là nến búa ngay tại hỗ trợ. Bạn chưa mua vội. Hôm sau giá đóng ở 83,5, cao hơn đỉnh nến búa (82), coi như xác nhận. Bạn mua ở 83,5, đặt cắt lỗ ở 77 (dưới đáy búa), rủi ro 6,5 mỗi cổ phiếu. Mục tiêu đầu tiên là vùng kháng cự 96,5, cách 13, tức tỷ lệ lãi trên rủi ro 2:1. Nếu giá thủng 77, mẫu nến đã sai và bạn thoát.","en":"Suppose stock X falls from 100 to the 80 area, where price bounced twice before. Today it opens at 81, drops to 77.5 at one point and closes at 81.5. The body is only 0.5 while the lower wick is 3.5, seven times the body: a hammer right on support. You do not buy yet. The next day price closes at 83.5, above the hammer's high (82), which counts as confirmation. You buy at 83.5 and place the stop at 77 (below the hammer's low), risking 6.5 per share. The first target is resistance at 96.5, 13 away, a 2:1 reward-to-risk ratio. If price breaks 77, the pattern was wrong and you are out."},"story":{"title":{"vi":"Thương nhân gạo ở Sakata","en":"The rice merchant of Sakata"},"text":{"vi":"Thế kỷ 18, sàn gạo Dojima ở Osaka là một trong những thị trường kỳ hạn có tổ chức sớm nhất thế giới, được chính quyền Nhật công nhận năm 1730. Munehisa Homma (khoảng 1724-1803), một thương nhân gạo giàu có từ vùng Sakata, nổi tiếng vì ghi chép giá gạo hằng ngày và nhận ra rằng giá không chỉ phản ánh cung cầu mà còn phản ánh cảm xúc của người buôn. Nhiều chuyện kể về ông mang màu sắc truyền thuyết, và các nhà nghiên cứu cho rằng biểu đồ nến như ta thấy hôm nay có lẽ được hoàn thiện muộn hơn, vào thời Minh Trị. Phương Tây gần như không biết đến kỹ thuật này cho tới khi Steve Nison xuất bản cuốn Japanese Candlestick Charting Techniques năm 1991. Bài học còn nguyên giá trị sau gần ba trăm năm: cây nến là dấu vết của tâm lý đám đông. Bạn không học thuộc tên mẫu nến để đoán tương lai, bạn học để hiểu ai đang sợ và ai đang tham ở mức giá đó.","en":"In the 18th century the Dojima rice exchange in Osaka was one of the world's earliest organised futures markets, officially sanctioned by the Japanese government in 1730. Munehisa Homma (about 1724-1803), a wealthy rice merchant from Sakata, became famous for recording daily rice prices and for noticing that price reflects not only supply and demand but also the emotions of traders. Many tales about him are partly legend, and researchers believe the candlestick chart as we know it was probably refined later, in the Meiji era. The West barely knew the technique until Steve Nison published Japanese Candlestick Charting Techniques in 1991. The lesson still holds after almost three hundred years: a candle is a footprint of crowd psychology. You do not memorise pattern names to predict the future; you study them to see who is afraid and who is greedy at that price."}},"mistakes":{"vi":["Vào lệnh chỉ vì thấy một mẫu nến đẹp mà không xét xu hướng và vùng giá xung quanh.","Hành động khi nến chưa đóng, rồi mẫu nến biến mất ở phút cuối.","Học thuộc hàng chục tên mẫu nến nhưng không hiểu cuộc giằng co mua bán mà nó mô tả.","Dùng mẫu nến trên khung 1-5 phút, nơi nhiễu và phí giao dịch nuốt hết lợi thế nhỏ nhoi."],"en":["Entering just because a pattern looks pretty, without checking the trend and the price zone around it.","Acting before the candle closes, only to see the pattern vanish in the final minute.","Memorising dozens of pattern names without understanding the buyer-seller struggle they describe.","Using patterns on 1-5 minute charts, where noise and trading costs eat the small edge."]},"practice":{"vi":"Mở chế độ luyện tập trên StockGym với khung ngày của FPT hoặc AAPL, tiến từng nến một. Mỗi khi thấy búa, nhấn chìm hay sao mai tại một đường ngang bạn đã vẽ trước, hãy ghi dự đoán, vào lệnh với cắt lỗ dưới đáy mẫu nến, rồi xem nhật ký lệnh để đếm bao nhiêu mẫu thật sự hiệu quả.","en":"Start a StockGym practice session on the daily chart of FPT or AAPL and step one candle at a time. Each time you see a hammer, engulfing or morning star at a horizontal line you drew beforehand, write down your call, enter with the stop below the pattern's low, then review the trade journal to count how many patterns actually worked."}},{"id":"ta-trend","title":{"vi":"Xu hướng, đỉnh đáy và lý thuyết Dow","en":"Trend, swing highs and lows, and Dow theory"},"summary":{"vi":"Xu hướng là khái niệm nền tảng nhất của phân tích kỹ thuật: giá có đang tạo đỉnh và đáy cao dần hay thấp dần? Xác định đúng xu hướng giúp bạn tránh được sai lầm đắt giá nhất là đánh ngược dòng.","en":"Trend is the most basic idea in technical analysis: is price making higher or lower highs and lows? Getting the trend right keeps you away from the costliest mistake, fighting the tide."},"points":[{"h":{"vi":"Đỉnh đáy và định nghĩa xu hướng","en":"Swings and the definition of trend"},"p":{"vi":"Đỉnh (swing high) là một điểm cao có các nến hai bên thấp hơn; đáy (swing low) là điểm thấp có các nến hai bên cao hơn. Xu hướng tăng là chuỗi đỉnh sau cao hơn đỉnh trước và đáy sau cao hơn đáy trước. Xu hướng giảm là chuỗi đỉnh thấp dần và đáy thấp dần. Khi đỉnh đáy không theo trật tự nào, thị trường đi ngang. Định nghĩa này đơn giản nhưng khách quan: bạn chỉ cần đánh dấu các đỉnh đáy rồi so sánh, không cần chỉ báo nào.","en":"A swing high is a peak with lower candles on both sides; a swing low is a trough with higher candles on both sides. An uptrend is a series of higher highs and higher lows. A downtrend is a series of lower highs and lower lows. When swings follow no order, the market is ranging. The definition is simple but objective: mark the swings and compare them, no indicator required."}},{"h":{"vi":"Ba cấp xu hướng theo Dow","en":"Dow's three trend degrees"},"p":{"vi":"Lý thuyết Dow chia chuyển động giá thành ba cấp. Xu hướng chính (cấp một) kéo dài từ khoảng một năm đến vài năm, giống thủy triều. Xu hướng thứ cấp là nhịp điều chỉnh ngược chiều xu hướng chính, thường kéo dài ba tuần đến ba tháng và lấy lại khoảng một phần ba đến hai phần ba nhịp trước đó, giống con sóng. Dao động nhỏ kéo dài dưới ba tuần, giống gợn nước, và chứa nhiều nhiễu nhất. Người giao dịch nên biết mình đang chơi ở cấp nào và cấp lớn hơn đang đi hướng nào.","en":"Dow theory splits price movement into three degrees. The primary trend lasts from about a year to several years, like the tide. The secondary trend is a correction against the primary, usually lasting three weeks to three months and retracing roughly one third to two thirds of the prior move, like a wave. Minor movements last under three weeks, like ripples, and contain the most noise. A trader should know which degree they are trading and which way the larger degree is heading."}},{"h":{"vi":"Các nguyên lý còn lại của Dow","en":"The other Dow principles"},"p":{"vi":"Thứ nhất, giá phản ánh mọi thông tin đã biết. Thứ hai, xu hướng chính có ba giai đoạn: tích lũy (người hiểu biết mua khi tin còn xấu), bùng nổ (đám đông tham gia), và phân phối (người hiểu biết bán khi tin tốt tràn ngập). Thứ ba, các chỉ số phải xác nhận lẫn nhau; bản gốc dùng chỉ số công nghiệp và chỉ số đường sắt. Thứ tư, khối lượng nên tăng theo hướng của xu hướng chính. Thứ năm, xu hướng được coi là còn tiếp diễn cho tới khi có tín hiệu đảo chiều rõ ràng.","en":"First, price discounts all known information. Second, a primary trend has three phases: accumulation (informed buyers act while news is still bad), public participation (the crowd joins), and distribution (informed holders sell into good news). Third, the averages must confirm each other; the original used the industrial and railroad averages. Fourth, volume should expand in the direction of the primary trend. Fifth, a trend is assumed to continue until there is a clear reversal signal."}},{"h":{"vi":"Đường xu hướng và kênh giá","en":"Trend lines and channels"},"p":{"vi":"Đường xu hướng tăng nối ít nhất hai đáy cao dần; đường xu hướng giảm nối ít nhất hai đỉnh thấp dần. Lần chạm thứ ba mới coi là xác nhận. Đường càng được chạm nhiều lần và càng dài thì càng được nhiều người theo dõi. Vẽ thêm một đường song song qua các đỉnh đối diện, bạn có kênh giá. Đường quá dốc thường không bền và hay bị phá sớm mà xu hướng vẫn tiếp tục với độ dốc thoải hơn. Vẽ đường xu hướng mang tính chủ quan, nên hãy nhất quán: luôn dùng thân nến hoặc luôn dùng bóng nến.","en":"An uptrend line connects at least two rising lows; a downtrend line connects at least two falling highs. The third touch is what confirms it. The more touches and the longer the line, the more traders are watching it. Add a parallel line through the opposite swings and you have a channel. Very steep lines rarely last and often break while the trend simply continues at a gentler slope. Drawing trend lines is subjective, so be consistent: always use bodies or always use wicks."}},{"h":{"vi":"Khi nào xu hướng bị phá vỡ","en":"When a trend is broken"},"p":{"vi":"Thủng đường xu hướng chỉ là cảnh báo đầu tiên. Dấu hiệu chắc hơn là cấu trúc đỉnh đáy thay đổi: trong xu hướng tăng, giá không tạo được đỉnh cao hơn, rồi đóng cửa dưới đáy gần nhất. Lúc đó chuỗi đáy cao dần đã chấm dứt. Một cách kiểm tra phổ biến gồm ba bước: đường xu hướng bị phá, giá hồi lại nhưng không vượt được đỉnh cũ, rồi giá thủng đáy trước đó. Cho đến khi đủ bằng chứng, giả định an toàn nhất là xu hướng cũ vẫn còn.","en":"A trend-line break is only the first warning. The stronger sign is a change in swing structure: in an uptrend, price fails to make a higher high and then closes below the most recent swing low. At that point the series of higher lows has ended. A common three-step check is: the trend line breaks, price rallies back but fails to exceed the old high, then price takes out the prior low. Until the evidence is complete, the safest assumption is that the old trend is still alive."}},{"h":{"vi":"Giới hạn cần biết","en":"Limits to keep in mind"},"p":{"vi":"Xác định xu hướng luôn chậm: bạn chỉ biết đỉnh hay đáy sau khi nó đã hình thành, nên không bao giờ mua đúng đáy hay bán đúng đỉnh. Thị trường cũng đi ngang phần lớn thời gian, và trong giai đoạn đó các tín hiệu xu hướng cho nhiều lần sai liên tiếp. Bằng chứng học thuật về theo xu hướng là có thật nhưng khiêm tốn, mạnh hơn ở danh mục nhiều thị trường so với một mã đơn lẻ. Theo xu hướng không đảm bảo lãi; nó giúp bạn thua nhỏ khi sai và giữ được lệnh khi đúng.","en":"Trend identification always lags: you only know a swing after it has formed, so you never buy the exact low or sell the exact high. Markets also range much of the time, and in those periods trend signals produce strings of losses. The academic evidence for trend following is real but modest, and stronger across a diversified set of markets than on a single symbol. Following the trend guarantees nothing; it helps you lose small when wrong and stay in when right."}}],"example":{"vi":"Giả sử một cổ phiếu tạo đáy ở 50, tăng lên 60, điều chỉnh về 55, tăng lên 68, rồi về 62. Các đỉnh 60 và 68 cao dần, các đáy 50, 55, 62 cao dần: xu hướng tăng. Nối đáy 55 và 62 thành đường xu hướng. Nhịp điều chỉnh từ 68 về 62 lấy lại 6 trên nhịp tăng 13 (từ 55 lên 68), tức khoảng 46 phần trăm, nằm trong vùng điều chỉnh bình thường. Bạn mua khi giá bật lên từ 62, cắt lỗ ở 61. Sau đó giá chỉ lên được 66 (đỉnh thấp hơn 68) rồi đóng cửa ở 61 (thủng đáy 62). Cấu trúc tăng đã gãy, bạn thoát lệnh với khoản lỗ nhỏ thay vì hy vọng.","en":"Suppose a stock bottoms at 50, rises to 60, pulls back to 55, rises to 68, then pulls back to 62. The highs 60 and 68 are rising and the lows 50, 55, 62 are rising: an uptrend. Connect the lows at 55 and 62 for a trend line. The pullback from 68 to 62 gives back 6 of the 13-point advance (55 to 68), about 46 percent, a normal retracement. You buy as price turns up from 62 with a stop at 61. Price then reaches only 66 (a lower high than 68) and closes at 61 (below the 62 low). The bullish structure is broken, so you exit with a small loss rather than hope."},"story":{"title":{"vi":"Charles Dow và bài xã luận tháng 10 năm 1929","en":"Charles Dow and the editorial of October 1929"},"text":{"vi":"Charles Dow đồng sáng lập Dow Jones và Company năm 1882, ra tờ The Wall Street Journal năm 1889 và công bố chỉ số công nghiệp Dow Jones gồm 12 cổ phiếu ngày 26 tháng 5 năm 1896. Ông viết các bài xã luận về hành vi thị trường cho tới khi qua đời năm 1902, nhưng chưa bao giờ gọi chúng là một lý thuyết. Cái tên lý thuyết Dow do những người đi sau đặt, và được William Peter Hamilton rồi Robert Rhea hệ thống hóa. Ngày 25 tháng 10 năm 1929, giữa những ngày thị trường sụp đổ, Hamilton đăng bài xã luận có nhan đề 'A Turn in the Tide', cho rằng theo các nguyên lý của Dow, thị trường giá lên kéo dài nhiều năm đã chấm dứt. Nhiều người khi đó vẫn tin đây chỉ là nhịp điều chỉnh. Chỉ số Dow rơi từ khoảng 381 điểm tháng 9 năm 1929 xuống khoảng 41 điểm tháng 7 năm 1932. Bài học: khi cấu trúc đỉnh đáy của xu hướng chính đã gãy, hãy tin vào biểu đồ hơn là vào hy vọng.","en":"Charles Dow co-founded Dow Jones and Company in 1882, launched The Wall Street Journal in 1889 and published the Dow Jones Industrial Average of 12 stocks on 26 May 1896. He wrote editorials on market behaviour until his death in 1902 but never called them a theory. The name Dow theory came from those who followed, and it was organised by William Peter Hamilton and later Robert Rhea. On 25 October 1929, in the middle of the crash, Hamilton published an editorial titled 'A Turn in the Tide', arguing that by Dow's principles the multi-year bull market was over. Many people still believed it was only a correction. The Dow fell from about 381 in September 1929 to about 41 in July 1932. The lesson: once the swing structure of the primary trend has broken, trust the chart more than hope."}},"mistakes":{"vi":["Gọi mọi nhịp hồi vài nến là xu hướng mới mà không kiểm tra cấu trúc đỉnh đáy.","Giao dịch khung nhỏ ngược chiều xu hướng của khung lớn hơn.","Vẽ lại đường xu hướng liên tục để nó khớp với quan điểm sẵn có.","Coi việc thủng đường xu hướng là đảo chiều chắc chắn trong khi đỉnh đáy vẫn còn cao dần."],"en":["Calling every few-candle bounce a new trend without checking the swing structure.","Trading a low timeframe against the trend of the higher timeframe.","Redrawing trend lines again and again so they fit an existing opinion.","Treating a trend-line break as a certain reversal while highs and lows are still rising."]},"practice":{"vi":"Trên StockGym, bật chỉ báo ZigZag ở khung ngày của VN30F1M hoặc SPY để nhìn rõ các đỉnh đáy, dùng công cụ đường xu hướng và kênh song song để vẽ, rồi tiến từng nến. Chỉ vào lệnh theo hướng của cấu trúc đỉnh đáy, và ghi lại trong nhật ký thời điểm bạn kết luận xu hướng đã gãy để so với diễn biến sau đó.","en":"On StockGym, switch on the ZigZag indicator on the daily chart of VN30F1M or SPY to see swings clearly, draw with the trend line and parallel channel tools, then step forward candle by candle. Trade only in the direction of the swing structure, and note in the journal the moment you judged the trend broken so you can compare it with what happened next."}},{"id":"ta-sr","title":{"vi":"Hỗ trợ, kháng cự và vùng cung cầu","en":"Support, resistance and supply/demand zones"},"summary":{"vi":"Hỗ trợ và kháng cự là những vùng giá nơi lực mua hoặc lực bán từng đủ mạnh để chặn giá. Chúng cho bạn chỗ để lên kế hoạch: vào ở đâu, sai ở đâu và chốt lời ở đâu.","en":"Support and resistance are price areas where buying or selling was once strong enough to stop the move. They give you places to plan around: where to enter, where you are wrong and where to take profit."},"points":[{"h":{"vi":"Định nghĩa","en":"Definitions"},"p":{"vi":"Hỗ trợ là vùng giá bên dưới nơi lực mua thường xuất hiện đủ mạnh để chặn đà giảm. Kháng cự là vùng giá bên trên nơi lực bán thường đủ mạnh để chặn đà tăng. Cách tìm cơ bản nhất là nhìn về bên trái biểu đồ: các đỉnh và đáy cũ, đặc biệt là những mức giá đã đảo chiều nhiều lần. Các mức khác cũng hay được theo dõi gồm số tròn, đỉnh hoặc đáy lịch sử, khoảng trống giá, và các đường trung bình động lớn.","en":"Support is an area below price where buying tends to be strong enough to halt a decline. Resistance is an area above price where selling tends to be strong enough to halt an advance. The basic way to find them is to look left on the chart: prior highs and lows, especially prices that turned the market several times. Other widely watched levels include round numbers, all-time highs or lows, price gaps and major moving averages."}},{"h":{"vi":"Vì sao các mức giá hình thành","en":"Why levels form"},"p":{"vi":"Các mức giá có ý nghĩa vì con người nhớ giá. Người mua ở đỉnh rồi bị kẹt thường chỉ mong về bờ, nên khi giá quay lại họ bán ra và tạo kháng cự. Người lỡ một nhịp tăng thường chờ giá về lại vùng cũ để mua, tạo hỗ trợ. Các lệnh chờ, lệnh cắt lỗ và quyết định của quỹ lớn cũng tập trung quanh số tròn và đỉnh đáy rõ ràng. Một phần hiệu ứng là tự hiện thực hóa: nhiều người cùng nhìn một mức thì mức đó có lực.","en":"Levels matter because people remember prices. Buyers trapped at a high often just want to break even, so when price returns they sell and create resistance. Those who missed a rally often wait for price to revisit the old area to buy, creating support. Resting orders, stop-losses and large fund decisions also cluster around round numbers and obvious swing points. Part of the effect is self-fulfilling: when many people watch the same level, it has force."}},{"h":{"vi":"Vùng, không phải đường","en":"Zones, not lines"},"p":{"vi":"Giá hiếm khi quay đầu ở đúng một con số. Hãy vẽ hỗ trợ và kháng cự như một dải có bề rộng, chẳng hạn từ giá đóng cửa thấp nhất đến đáy bóng nến của cụm đáy cũ. Một cách ước lượng bề rộng là dùng khoảng nửa đến một lần ATR của khung đang xem. Nghĩ theo vùng giúp bạn không hoảng khi giá chọc qua mức vài bước giá, và giúp đặt cắt lỗ ở bên ngoài vùng thay vì ngay trên đường, nơi dễ bị quét nhất.","en":"Price rarely turns at an exact number. Draw support and resistance as a band with width, for example from the lowest close to the lowest wick of an old cluster of lows. One way to size the band is about half to one ATR of the timeframe you are viewing. Thinking in zones keeps you calm when price pokes through a level by a few ticks, and helps you put the stop outside the zone rather than right on the line, where it is most easily swept."}},{"h":{"vi":"Đổi vai: kháng cự thành hỗ trợ","en":"Role reversal"},"p":{"vi":"Khi giá vượt dứt khoát một kháng cự, vùng đó thường trở thành hỗ trợ ở lần quay lại sau, và ngược lại hỗ trợ bị thủng thường thành kháng cự. Lý do là vị thế của người tham gia đã đổi: người bán ở kháng cự nay đang sai và muốn mua lại khi giá về, người mua lỡ nhịp phá vỡ cũng chờ ở đó. Nhịp quay lại kiểm tra vùng vừa bị phá (retest) là điểm vào được nhiều người ưa thích vì điểm cắt lỗ gần và rõ ràng.","en":"When price breaks decisively through resistance, that area often becomes support on the next visit, and broken support often becomes resistance. The reason is that participants' positions have changed: those who sold at resistance are now wrong and want to buy back when price returns, and buyers who missed the breakout wait there too. The return to test the broken area (a retest) is a popular entry because the stop is close and clearly defined."}},{"h":{"vi":"Vùng cung cầu","en":"Supply and demand zones"},"p":{"vi":"Vùng cầu là nơi giá đi ngang ngắn rồi tăng mạnh rời đi, gợi ý rằng còn lệnh mua lớn chưa khớp hết ở đó. Vùng cung là nơi giá dừng ngắn rồi rơi mạnh. Cách vẽ thông dụng là đánh dấu cụm nến nhỏ ngay trước nhịp bứt phá. Vùng được coi là còn mới khi giá chưa quay lại lần nào; mỗi lần kiểm tra lại, lượng lệnh chờ ở đó bị tiêu bớt nên vùng yếu dần. Về bản chất đây vẫn là hỗ trợ kháng cự, chỉ khác cách xác định điểm gốc.","en":"A demand zone is where price paused briefly and then rallied away sharply, suggesting large unfilled buy orders remain there. A supply zone is where price paused and then dropped hard. The usual way to draw one is to mark the small cluster of candles just before the explosive move. A zone is called fresh if price has not returned to it; each retest consumes resting orders, so the zone weakens. In essence this is still support and resistance, only with a different way of locating the origin."}},{"h":{"vi":"Phá vỡ giả","en":"False breakouts"},"p":{"vi":"Phá vỡ giả là khi giá vượt qua một mức rồi nhanh chóng quay lại bên trong. Chúng xảy ra thường xuyên vì lệnh cắt lỗ và lệnh mua đuổi tập trung ngay sau các mức rõ ràng, tạo thanh khoản cho người chơi lớn giao dịch ngược lại. Để giảm rủi ro: chờ nến đóng cửa bên ngoài vùng thay vì phản ứng với bóng nến, ưu tiên phá vỡ có khối lượng tăng, hoặc chờ nhịp retest. Không cách nào loại bỏ hết phá vỡ giả, nên luôn cần điểm cắt lỗ.","en":"A false breakout is when price moves through a level and quickly returns inside. They are common because stop-losses and chasing orders sit just beyond obvious levels, providing liquidity for larger players to trade the other way. To reduce the risk: wait for a candle to close outside the zone instead of reacting to a wick, prefer breakouts with rising volume, or wait for the retest. Nothing removes false breakouts entirely, which is why a stop is always needed."}}],"example":{"vi":"Giả sử hợp đồng VN30F1M ba lần tăng lên vùng 1.298-1.302 rồi quay đầu. Bạn vẽ kháng cự là dải 1.298-1.302 chứ không phải một đường ở 1.300. Lần thứ tư, một nến ngày đóng cửa ở 1.312 với khối lượng cao hơn trung bình. Thay vì mua đuổi, bạn chờ. Bốn phiên sau giá lùi về 1.303, để lại bóng dưới dài và đóng ở 1.309: vùng kháng cự cũ đang giữ vai trò hỗ trợ. Bạn mua ở 1.309, đặt cắt lỗ ở 1.294 (dưới vùng), rủi ro 15 điểm. Mục tiêu là 1.340, cách 31 điểm, tỷ lệ khoảng 2:1. Nếu giá đóng cửa trở lại dưới 1.298, đó là phá vỡ giả và lệnh cắt lỗ giới hạn thiệt hại.","en":"Suppose the VN30F1M contract rallies three times into 1,298-1,302 and turns down. You draw resistance as the band 1,298-1,302, not a single line at 1,300. On the fourth attempt a daily candle closes at 1,312 on above-average volume. Instead of chasing, you wait. Four sessions later price dips to 1,303, leaves a long lower wick and closes at 1,309: old resistance is acting as support. You buy at 1,309 with a stop at 1,294 (below the zone), risking 15 points. The target is 1,340, 31 points away, roughly 2:1. If price closes back below 1,298, it was a false breakout and the stop limits the damage."},"story":{"title":{"vi":"Mốc 1.000 điểm của chỉ số Dow Jones","en":"The Dow and the 1,000 level"},"text":{"vi":"Đầu năm 1966, chỉ số công nghiệp Dow Jones lần đầu chạm mốc 1.000 điểm trong phiên nhưng không đóng cửa được trên đó, rồi quay đầu giảm. Suốt khoảng mười sáu năm sau, con số tròn ấy trở thành trần của cả thị trường Mỹ. Tháng 11 năm 1972 chỉ số lần đầu đóng cửa trên 1.000, lên được khoảng 1.050 vào tháng 1 năm 1973, rồi rơi xuống dưới 600 điểm vào cuối năm 1974. Năm 1976 và năm 1981 chỉ số lại trèo về vùng 1.000 và lại bị đẩy lùi. Mỗi lần như vậy, những người mua gần đỉnh các lần trước chỉ chờ về bờ để bán. Phải đến cuối năm 1982 Dow mới vượt hẳn vùng này và không quay lại nữa: chưa đầy năm năm sau, tháng 8 năm 1987, chỉ số đã ở trên 2.700 điểm. Bài học: một vùng giá càng làm nhiều người kẹt hàng thì càng được nhớ lâu và càng khó vượt; nhưng khi nó bị vượt thật sự, lực bán đã được hấp thụ và chuyển động sau đó thường mạnh. Dù vậy, ở từng lần chạm, không ai biết trước kết quả.","en":"Early in 1966 the Dow Jones Industrial Average touched 1,000 for the first time during a session, failed to close above it and turned down. For roughly the next sixteen years that round number acted as a ceiling for the whole US market. In November 1972 the index closed above 1,000 for the first time, reached about 1,050 in January 1973, then fell below 600 by late 1974. In 1976 and again in 1981 it climbed back to the 1,000 area and was pushed back once more. Each time, people who had bought near the earlier peaks were waiting to get out at break-even. Only in late 1982 did the Dow clear the area for good and never return: less than five years later, in August 1987, it stood above 2,700. The lesson: the more people a price area has trapped, the longer it is remembered and the harder it is to clear; but once it is truly cleared, the overhead selling has been absorbed and the move that follows is often strong. Even so, on any single test of the level nobody knew the outcome in advance."}},"mistakes":{"vi":["Vẽ quá nhiều đường đến mức mức giá nào cũng thành hỗ trợ hoặc kháng cự.","Đặt cắt lỗ ngay trên đường thay vì bên ngoài vùng, rồi bị quét trước khi giá đi đúng hướng.","Mua đuổi ngay khi bóng nến chọc qua kháng cự mà không chờ nến đóng cửa.","Tin rằng một mức đã giữ ba lần thì chắc chắn giữ lần thứ tư, trong khi mỗi lần kiểm tra làm nó yếu đi."],"en":["Drawing so many lines that every price becomes support or resistance.","Placing the stop right on the line instead of outside the zone, then being swept before price goes your way.","Chasing the moment a wick pokes through resistance without waiting for the close.","Believing a level that held three times must hold a fourth, when each test weakens it."]},"practice":{"vi":"Trên StockGym, chọn khung ngày của HPG, vàng hoặc QQQ, dùng công cụ hộp để đánh dấu ba vùng hỗ trợ kháng cự rõ nhất trước khi tiến nến. Sau đó tiến từng nến, chỉ giao dịch tại các vùng đó với cắt lỗ kéo ra ngoài vùng, và dùng công cụ đo để kiểm tra tỷ lệ lãi trên rủi ro trước mỗi lệnh.","en":"On StockGym, pick the daily chart of HPG, gold or QQQ and use the box tool to mark the three clearest support and resistance zones before stepping forward. Then advance one candle at a time, trade only at those zones with the stop dragged outside the zone, and use the measure tool to check reward-to-risk before each trade."}},{"id":"ta-ma","title":{"vi":"Đường trung bình động","en":"Moving averages"},"summary":{"vi":"Đường trung bình động làm mượt giá để bạn nhìn thấy hướng đi thay vì nhiễu. Đây là công cụ theo xu hướng phổ biến nhất, và cũng là công cụ bị kỳ vọng quá mức nhiều nhất.","en":"A moving average smooths price so you see direction instead of noise. It is the most widely used trend tool, and also the one people expect too much from."},"points":[{"h":{"vi":"SMA và EMA","en":"SMA versus EMA"},"p":{"vi":"SMA (trung bình động đơn giản) là trung bình cộng giá đóng cửa của N nến gần nhất, mỗi nến có trọng số như nhau. EMA (trung bình động lũy thừa) đặt trọng số lớn hơn cho giá gần đây: EMA hôm nay bằng giá đóng cửa nhân hệ số k cộng EMA hôm qua nhân (1 trừ k), với k bằng 2 chia cho (N cộng 1). Với N bằng 20, k xấp xỉ 0,095. EMA bám giá nhanh hơn nhưng cũng dễ bị nhiễu hơn; SMA mượt hơn nhưng chậm hơn. Không có loại nào tốt hơn tuyệt đối.","en":"An SMA (simple moving average) is the arithmetic mean of the last N closes, each weighted equally. An EMA (exponential moving average) gives more weight to recent prices: today's EMA equals the close times a factor k plus yesterday's EMA times (1 minus k), where k is 2 divided by (N plus 1). For N of 20, k is about 0.095. The EMA hugs price faster but is also more easily fooled by noise; the SMA is smoother but slower. Neither is better in absolute terms."}},{"h":{"vi":"Các chu kỳ 20, 50 và 200","en":"The 20, 50 and 200 periods"},"p":{"vi":"Trên khung ngày, đường 20 đại diện khoảng một tháng giao dịch và mô tả xu hướng ngắn hạn; đường 50 khoảng hai tháng rưỡi cho xu hướng trung hạn; đường 200 khoảng mười tháng cho xu hướng dài hạn. Cách đọc đơn giản nhất: giá nằm trên đường 200 và đường này dốc lên thì bối cảnh dài hạn là tăng. Khi 20 nằm trên 50 và 50 nằm trên 200, ba cấp xu hướng đồng thuận. Các con số này không có gì thần kỳ; chúng có tác dụng một phần vì rất nhiều người cùng theo dõi.","en":"On the daily chart the 20 covers about one trading month and describes the short-term trend; the 50 covers about two and a half months for the medium term; the 200 covers about ten months for the long term. The simplest reading: price above a rising 200 means the long-term backdrop is bullish. When the 20 is above the 50 and the 50 above the 200, all three degrees agree. There is nothing magic in these numbers; they work partly because so many people watch them."}},{"h":{"vi":"Giao cắt","en":"Crossovers"},"p":{"vi":"Tín hiệu giao cắt xuất hiện khi đường ngắn cắt qua đường dài. Đường 50 cắt lên trên đường 200 gọi là giao cắt vàng (golden cross); cắt xuống gọi là giao cắt tử thần (death cross). Các cặp nhanh hơn như 20 và 50, hoặc giá cắt đường 20, cho tín hiệu sớm hơn nhưng sai nhiều hơn. Giao cắt là cách định nghĩa xu hướng khách quan, dễ kiểm thử, nhưng luôn đến sau khi một phần đáng kể của chuyển động đã xảy ra, vì đường trung bình được tính từ giá quá khứ.","en":"A crossover signal occurs when a shorter average crosses a longer one. The 50 crossing above the 200 is called a golden cross; crossing below is a death cross. Faster pairs such as 20 and 50, or price crossing the 20, signal earlier but are wrong more often. Crossovers are an objective, testable way to define trend, but they always arrive after a meaningful part of the move has happened, because the average is computed from past prices."}},{"h":{"vi":"Hỗ trợ và kháng cự động","en":"Dynamic support and resistance"},"p":{"vi":"Trong một xu hướng tăng khỏe, giá thường lùi về quanh đường EMA20 hoặc đường 50 rồi đi tiếp, nên nhiều người dùng các đường này làm vùng mua khi điều chỉnh. Gọi là hỗ trợ động vì mức giá thay đổi theo từng nến. Xu hướng càng mạnh thì giá càng ít khi chạm đường dài; khi giá bắt đầu đóng cửa dưới đường 50 sau một thời gian dài nằm trên, đó là dấu hiệu đà đã yếu. Trong thị trường đi ngang, giá cắt qua lại đường trung bình liên tục và khái niệm hỗ trợ động mất tác dụng.","en":"In a healthy uptrend price often pulls back to around the EMA20 or the 50 and then continues, so many traders use these lines as buy-the-dip areas. It is called dynamic support because the level changes with every candle. The stronger the trend, the less often price reaches the longer average; when price starts closing below the 50 after a long stay above it, momentum has weakened. In a sideways market price crosses the average back and forth and the idea of dynamic support stops working."}},{"h":{"vi":"Độ trễ và tín hiệu nhiễu","en":"Lag and whipsaw"},"p":{"vi":"Đường trung bình có hai nhược điểm gắn liền nhau. Độ trễ: chu kỳ càng dài thì tín hiệu càng muộn, bạn mất phần đầu và phần cuối của mỗi xu hướng. Nhiễu (whipsaw): chu kỳ càng ngắn thì càng nhiều lần cắt lên rồi cắt xuống trong thị trường đi ngang, mỗi lần là một khoản lỗ nhỏ cộng phí. Giảm cái này thì tăng cái kia. Hệ thống trung bình động thường có tỷ lệ thắng thấp, chỉ khoảng 30 đến 40 phần trăm, và sống nhờ vài lệnh thắng lớn. Người dùng phải chấp nhận nhiều lần thua nhỏ liên tiếp.","en":"Moving averages have two linked weaknesses. Lag: the longer the period, the later the signal, so you give up the start and the end of every trend. Whipsaw: the shorter the period, the more times it crosses up and down in a range, each one a small loss plus costs. Reducing one increases the other. Moving-average systems typically win only about 30 to 40 percent of trades and survive on a few large winners. Whoever uses them must accept strings of small losses."}}],"example":{"vi":"Giả sử một cổ phiếu có năm giá đóng cửa gần nhất là 50, 51, 52, 53, 54. SMA5 bằng (50 cộng 51 cộng 52 cộng 53 cộng 54) chia 5, tức 52. Hôm sau giá đóng ở 57: SMA5 mới bằng (51 cộng 52 cộng 53 cộng 54 cộng 57) chia 5, tức 53,4. Với EMA5, hệ số k bằng 2 chia 6, khoảng 0,333; nếu EMA hôm qua là 52 thì EMA mới bằng 57 nhân 0,333 cộng 52 nhân 0,667, tức khoảng 53,67. EMA phản ứng nhanh hơn SMA một chút. Áp dụng vào giao dịch: giá đang trên SMA200 dốc lên, lùi về chạm EMA20 ở 53,5 rồi đóng cửa tăng trở lại. Bạn mua ở 54,5, cắt lỗ ở 52 dưới đáy nhịp điều chỉnh, rủi ro 2,5 mỗi cổ phiếu.","en":"Suppose a stock's last five closes are 50, 51, 52, 53, 54. The SMA5 is (50 plus 51 plus 52 plus 53 plus 54) divided by 5, which is 52. The next day it closes at 57: the new SMA5 is (51 plus 52 plus 53 plus 54 plus 57) divided by 5, which is 53.4. For the EMA5, k is 2 divided by 6, about 0.333; if yesterday's EMA was 52, the new EMA is 57 times 0.333 plus 52 times 0.667, about 53.67. The EMA reacts slightly faster than the SMA. In a trade: price is above a rising SMA200, pulls back to touch the EMA20 at 53.5 and closes back up. You buy at 54.5 with a stop at 52 below the pullback low, risking 2.5 per share."},"story":{"title":{"vi":"Hai lần giao cắt tử thần của S&P 500","en":"Two death crosses on the S&P 500"},"text":{"vi":"Cuối tháng 12 năm 2007, đường trung bình 50 ngày của chỉ số S&P 500 cắt xuống dưới đường 200 ngày. Người làm theo tín hiệu đó đã đứng ngoài phần lớn đợt sụp đổ của khủng hoảng tài chính, khi chỉ số mất hơn một nửa giá trị tính tới đáy tháng 3 năm 2009. Tín hiệu trông như một phép màu. Nhưng tháng 3 năm 2020 câu chuyện khác hẳn. Chỉ số rơi khoảng 34 phần trăm chỉ trong hơn một tháng và tạo đáy ngày 23 tháng 3. Giao cắt tử thần chỉ xuất hiện vào cuối tháng 3, tức sau khi đáy đã hình thành. Ai bán theo tín hiệu là bán gần đáy, và phải chờ đến khoảng tháng 7 mới có giao cắt vàng để mua lại ở mức giá cao hơn nhiều. Bài học: đường trung bình không dự báo, nó chỉ xác nhận điều đã xảy ra. Nó bảo vệ bạn tốt trong các đợt giảm chậm và kéo dài, nhưng phản ứng quá muộn với những cú sập nhanh rồi hồi hình chữ V.","en":"In late December 2007 the 50-day moving average of the S&P 500 crossed below the 200-day. Anyone who followed that signal sat out most of the financial-crisis collapse, in which the index lost more than half its value by the March 2009 low. The signal looked like magic. March 2020 told a different story. The index fell about 34 percent in just over a month and bottomed on 23 March. The death cross appeared only at the end of March, after the low was already in. Those who sold on the signal sold near the bottom and had to wait until about July for a golden cross to buy back at much higher prices. The lesson: a moving average does not forecast, it only confirms what has already happened. It protects you well in slow, prolonged declines but reacts too late to fast crashes followed by V-shaped recoveries."}},"mistakes":{"vi":["Tối ưu chu kỳ cho khớp hoàn hảo với quá khứ rồi tin rằng tương lai sẽ lặp lại y hệt.","Dùng giao cắt trong thị trường đi ngang và bị cắt lỗ liên tục.","Chồng năm sáu đường trung bình lên biểu đồ đến mức không còn nhìn thấy giá.","Bỏ hệ thống sau vài lệnh thua nhỏ, ngay trước khi lệnh thắng lớn xuất hiện."],"en":["Tuning the period to fit the past perfectly and believing the future will repeat it exactly.","Using crossovers in a ranging market and being stopped out again and again.","Stacking five or six averages on the chart until price itself is hidden.","Abandoning the system after a few small losses, just before the large winner arrives."]},"practice":{"vi":"Trên StockGym, bật EMA20, EMA50 và SMA200 ở khung ngày của SPY hoặc VCB. Luyện một quy tắc duy nhất trong cả phiên, ví dụ chỉ mua khi giá trên SMA200 và lùi về EMA20, rồi xem bảng tổng kết: so đường vốn của bạn với mua và giữ, và đếm số lệnh thua liên tiếp dài nhất.","en":"On StockGym, switch on EMA20, EMA50 and SMA200 on the daily chart of SPY or VCB. Drill one single rule for the whole session, for example only buy when price is above the SMA200 and pulls back to the EMA20, then read the session summary: compare your equity curve with buy-and-hold and count your longest losing streak."}},{"id":"ta-momentum","title":{"vi":"Chỉ báo động lượng: RSI, MACD, Stochastic","en":"Momentum oscillators: RSI, MACD, Stochastic"},"summary":{"vi":"Chỉ báo động lượng đo tốc độ và sức mạnh của chuyển động giá chứ không đo hướng. Dùng đúng, chúng cho biết xu hướng đang khỏe hay đuối; dùng sai, chúng khiến bạn bán khống một cổ phiếu đang tăng mạnh nhất thị trường.","en":"Momentum oscillators measure the speed and strength of a price move, not its direction. Used well, they tell you whether a trend is healthy or tiring; used badly, they get you short the strongest stock in the market."},"points":[{"h":{"vi":"RSI","en":"RSI"},"p":{"vi":"RSI (chỉ số sức mạnh tương đối) do J. Welles Wilder giới thiệu năm 1978. Công thức: RSI bằng 100 trừ 100 chia cho (1 cộng RS), trong đó RS là mức tăng trung bình chia cho mức giảm trung bình của 14 nến, làm mượt theo cách của Wilder. Giá trị chạy từ 0 đến 100. Mặc định, trên 70 gọi là quá mua và dưới 30 gọi là quá bán. Mức 50 là ranh giới: RSI nằm trên 50 phần lớn thời gian nghĩa là các nhịp tăng đang lớn hơn các nhịp giảm.","en":"RSI (Relative Strength Index) was introduced by J. Welles Wilder in 1978. The formula: RSI equals 100 minus 100 divided by (1 plus RS), where RS is the average gain divided by the average loss over 14 candles, smoothed Wilder's way. Values run from 0 to 100. By default above 70 is called overbought and below 30 oversold. The 50 level is the dividing line: RSI spending most of its time above 50 means up moves are larger than down moves."}},{"h":{"vi":"MACD","en":"MACD"},"p":{"vi":"MACD do Gerald Appel phát triển vào cuối thập niên 1970. Đường MACD bằng EMA12 trừ EMA26. Đường tín hiệu là EMA9 của đường MACD. Biểu đồ cột (histogram) bằng đường MACD trừ đường tín hiệu. MACD cắt lên đường tín hiệu là tín hiệu tăng ngắn hạn; MACD vượt lên trên mức 0 nghĩa là EMA12 đã nằm trên EMA26, tức xu hướng trung hạn chuyển sang tăng. Vì được xây từ các đường trung bình, MACD vừa đo động lượng vừa theo xu hướng, và cũng mang độ trễ của chúng.","en":"MACD was developed by Gerald Appel in the late 1970s. The MACD line equals EMA12 minus EMA26. The signal line is the EMA9 of the MACD line. The histogram equals the MACD line minus the signal line. MACD crossing above its signal line is a short-term bullish signal; MACD rising above zero means EMA12 is now above EMA26, so the medium-term trend has turned up. Because it is built from moving averages, MACD both measures momentum and follows trend, and it inherits their lag."}},{"h":{"vi":"Stochastic","en":"Stochastic"},"p":{"vi":"Stochastic được George Lane phổ biến từ thập niên 1950. Nó đo vị trí của giá đóng cửa trong biên độ gần đây: phần trăm K bằng 100 nhân (giá đóng trừ đáy thấp nhất 14 nến) chia cho (đỉnh cao nhất 14 nến trừ đáy thấp nhất 14 nến). Phần trăm D là trung bình 3 nến của phần trăm K. Trên 80 là quá mua, dưới 20 là quá bán. Ý tưởng gốc: trong xu hướng tăng giá thường đóng cửa gần đỉnh của biên độ. Stochastic nhạy hơn RSI nên hợp với thị trường đi ngang hơn là thị trường có xu hướng.","en":"The Stochastic was popularised by George Lane from the 1950s. It measures where the close sits within the recent range: percent K equals 100 times (close minus the lowest low of 14 candles) divided by (the highest high of 14 candles minus that lowest low). Percent D is the 3-candle average of percent K. Above 80 is overbought, below 20 oversold. The original idea: in an uptrend prices tend to close near the top of the range. The Stochastic is more sensitive than RSI, so it suits ranging markets better than trending ones."}},{"h":{"vi":"Quá mua không có nghĩa là bán","en":"Overbought does not mean sell"},"p":{"vi":"Đây là hiểu lầm phổ biến nhất. Quá mua chỉ có nghĩa là giá đã tăng nhanh trong thời gian gần đây, và trong một xu hướng mạnh điều đó có thể kéo dài nhiều tuần. Trong xu hướng tăng, RSI thường dao động trong vùng 40 đến 80 và hiếm khi xuống 30; trong xu hướng giảm, nó dao động trong vùng 20 đến 60. Vì vậy hãy xác định xu hướng trước. Trong xu hướng tăng, chỉ dùng tín hiệu quá bán hoặc RSI lùi về vùng 40-50 để tìm điểm mua; bỏ qua tín hiệu quá mua.","en":"This is the most common misunderstanding. Overbought only means price has risen quickly of late, and in a strong trend that can persist for weeks. In an uptrend RSI tends to oscillate between about 40 and 80 and rarely reaches 30; in a downtrend it oscillates between about 20 and 60. So identify the trend first. In an uptrend, use only oversold readings or RSI dips to the 40-50 area to look for buys; ignore overbought readings."}},{"h":{"vi":"Phân kỳ","en":"Divergence"},"p":{"vi":"Phân kỳ giảm xảy ra khi giá tạo đỉnh cao hơn nhưng chỉ báo tạo đỉnh thấp hơn: giá vẫn tăng nhưng tốc độ tăng đã chậm lại. Phân kỳ tăng là khi giá tạo đáy thấp hơn còn chỉ báo tạo đáy cao hơn. Phân kỳ là cảnh báo đà suy yếu, không phải tín hiệu đảo chiều. Một xu hướng mạnh có thể tạo ra ba bốn lần phân kỳ liên tiếp trước khi thật sự quay đầu. Hãy chờ giá xác nhận, ví dụ thủng đáy gần nhất hoặc gãy đường xu hướng, rồi mới hành động.","en":"A bearish divergence occurs when price makes a higher high but the indicator makes a lower high: price is still rising but more slowly. A bullish divergence is when price makes a lower low while the indicator makes a higher low. Divergence warns that momentum is fading; it is not a reversal signal. A strong trend can print three or four divergences in a row before actually turning. Wait for price to confirm, for example a break of the last swing low or of the trend line, before acting."}},{"h":{"vi":"Giới hạn chung","en":"Shared limits"},"p":{"vi":"Cả ba chỉ báo đều được tính từ giá, nên chúng không chứa thông tin nào mà giá không có; chúng chỉ trình bày lại theo cách dễ nhìn hơn. Dùng RSI, Stochastic và MACD cùng lúc không cho ba xác nhận độc lập mà gần như là một thông tin lặp ba lần. Các ngưỡng 70/30 hay 80/20 là quy ước, không phải quy luật. Kiểm thử cho thấy các tín hiệu này đứng riêng lẻ thường không đủ vượt phí giao dịch. Hãy chọn một chỉ báo, hiểu thật kỹ, và dùng nó để hỗ trợ việc đọc giá.","en":"All three are computed from price, so they contain nothing price does not; they only present it in a more readable form. Using RSI, Stochastic and MACD together does not give three independent confirmations, it is nearly one piece of information repeated three times. The 70/30 and 80/20 thresholds are conventions, not laws. Testing shows these signals on their own often fail to beat trading costs. Pick one oscillator, understand it thoroughly, and use it to support your reading of price."}}],"example":{"vi":"Giả sử trong 14 phiên, một cổ phiếu có tổng các phiên tăng là 14 điểm và tổng các phiên giảm là 7 điểm. Mức tăng trung bình là 1, mức giảm trung bình là 0,5, nên RS bằng 2 và RSI bằng 100 trừ 100 chia 3, tức khoảng 66,7. Bây giờ xét phân kỳ: giá tạo đỉnh ở 100 với RSI 78, điều chỉnh về 94, rồi lên đỉnh mới 104 nhưng RSI chỉ đạt 68. Giá cao hơn, RSI thấp hơn: phân kỳ giảm. Bạn chưa bán. Đáy gần nhất là 94. Nếu giá đóng cửa dưới 94, cấu trúc tăng gãy và phân kỳ được xác nhận; lúc đó người đang giữ có lý do để chốt lời. Nếu giá vượt 104 với RSI trở lại trên 70, cảnh báo bị hủy.","en":"Suppose that over 14 sessions a stock's up days total 14 points and its down days total 7 points. The average gain is 1 and the average loss is 0.5, so RS is 2 and RSI is 100 minus 100 divided by 3, about 66.7. Now a divergence: price peaks at 100 with RSI at 78, pulls back to 94, then makes a new high at 104 while RSI reaches only 68. Price higher, RSI lower: a bearish divergence. You do not sell yet. The last swing low is 94. If price closes below 94, the bullish structure breaks and the divergence is confirmed; holders then have a reason to take profit. If price clears 104 with RSI back above 70, the warning is cancelled."},"story":{"title":{"vi":"Tom và cổ phiếu quá mua suốt cả năm","en":"Tom and the stock that stayed overbought all year"},"text":{"vi":"Tom là một nhà giao dịch mới (ví dụ minh họa) vừa học xong về RSI. Đầu năm 2023 anh thấy RSI khung ngày của Nvidia vượt 70 và quyết định bán khống, vì sách nói đó là quá mua. Giá tiếp tục tăng. Anh cắt lỗ, chờ RSI vượt 70 lần nữa rồi lại bán khống, tin rằng lần này chắc chắn phải giảm. Cuối tháng 5 năm 2023, sau báo cáo kết quả kinh doanh, cổ phiếu nhảy vọt hơn 20 phần trăm chỉ trong một phiên. Phần bối cảnh là có thật: cổ phiếu Nvidia tăng hơn ba lần trong năm 2023, và RSI của nó nằm trong vùng quá mua nhiều lần trong suốt hành trình đó. Tom thua liên tiếp không phải vì RSI sai, mà vì anh hỏi sai câu. RSI trên 70 trả lời câu hỏi giá có đang tăng nhanh không, chứ không trả lời câu hỏi giá sắp giảm chưa. Bài học: trong một xu hướng mạnh, quá mua là dấu hiệu của sức mạnh. Xác định xu hướng trước, rồi mới đọc chỉ báo.","en":"Tom is a new trader (an illustration) who has just learned about RSI. Early in 2023 he sees Nvidia's daily RSI move above 70 and decides to short it, because the book says that is overbought. Price keeps rising. He takes the loss, waits for RSI to exceed 70 again and shorts once more, sure that this time it must fall. In late May 2023, after an earnings report, the stock jumps more than 20 percent in a single session. The backdrop is real: Nvidia shares more than tripled in 2023, and its RSI sat in overbought territory many times along the way. Tom loses repeatedly not because RSI was wrong but because he asked the wrong question. RSI above 70 answers whether price is rising fast, not whether price is about to fall. The lesson: in a strong trend, overbought is a sign of strength. Identify the trend first, then read the oscillator."}},"mistakes":{"vi":["Bán khống chỉ vì RSI trên 70 hoặc mua chỉ vì RSI dưới 30 mà không xét xu hướng.","Coi phân kỳ là lệnh vào ngay thay vì chờ giá xác nhận.","Chồng nhiều chỉ báo động lượng lên nhau và tưởng là có nhiều xác nhận độc lập.","Đổi tham số liên tục cho tới khi chỉ báo khớp với điều mình muốn thấy."],"en":["Shorting only because RSI is above 70, or buying only because it is below 30, without checking the trend.","Treating divergence as an immediate entry instead of waiting for price to confirm.","Stacking several momentum indicators and thinking they are independent confirmations.","Changing parameters over and over until the indicator shows what you want to see."]},"practice":{"vi":"Trên StockGym, mở NVDA hoặc FPT khung ngày, bật RSI 14 và SMA200, rồi tiến từng nến. Mỗi lần RSI vượt 70, ghi lại trong nhật ký giá sau đó 10 nến cao hơn hay thấp hơn; làm tương tự với mỗi phân kỳ bạn nhận ra. Sau một phiên dài, xuất CSV và đếm kết quả để thấy tận mắt quá mua trong xu hướng tăng có ý nghĩa gì.","en":"On StockGym, open NVDA or FPT on the daily chart, switch on RSI 14 and SMA200, and step candle by candle. Each time RSI exceeds 70, note in the journal whether price was higher or lower 10 candles later; do the same for every divergence you spot. After a long session, export the CSV and count the outcomes to see for yourself what overbought means in an uptrend."}},{"id":"ta-volatility","title":{"vi":"Công cụ biến động: ATR, Bollinger, Keltner","en":"Volatility tools: ATR, Bollinger Bands, Keltner channel"},"summary":{"vi":"Biến động cho biết giá thường di chuyển bao xa, không cho biết đi hướng nào. Đo được biến động, bạn đặt được cắt lỗ hợp lý, tính được khối lượng lệnh, và nhận ra lúc thị trường đang nén trước một chuyển động lớn.","en":"Volatility tells you how far price usually moves, not which way. Once you can measure it, you can place sensible stops, size positions, and recognise when the market is coiling before a large move."},"points":[{"h":{"vi":"ATR","en":"ATR"},"p":{"vi":"ATR (biên độ thực trung bình) do Welles Wilder giới thiệu năm 1978. Biên độ thực (TR) của một nến là giá trị lớn nhất trong ba số: giá cao trừ giá thấp, trị tuyệt đối của giá cao trừ giá đóng cửa hôm trước, và trị tuyệt đối của giá thấp trừ giá đóng cửa hôm trước. Nhờ vậy khoảng trống giá cũng được tính vào. ATR là trung bình của TR qua 14 nến, làm mượt theo cách của Wilder. ATR được tính bằng đơn vị giá, nên muốn so sánh giữa các mã hãy chia cho giá để ra phần trăm.","en":"ATR (Average True Range) was introduced by Welles Wilder in 1978. The true range (TR) of a candle is the largest of three numbers: high minus low, the absolute value of high minus the previous close, and the absolute value of low minus the previous close. That way gaps are included. ATR is the average of TR over 14 candles, smoothed Wilder's way. ATR is expressed in price units, so to compare across symbols divide it by price to get a percentage."}},{"h":{"vi":"Cắt lỗ và khối lượng theo ATR","en":"ATR-based stops and sizing"},"p":{"vi":"Cắt lỗ cố định theo số điểm sẽ quá chặt khi thị trường biến động mạnh và quá rộng khi thị trường yên ắng. Cách phổ biến là đặt cắt lỗ cách điểm vào từ 1,5 đến 3 lần ATR, để dao động thông thường không quét lệnh. Khối lượng lệnh tính ngược từ đó: số tiền chấp nhận mất chia cho khoảng cách cắt lỗ tính bằng tiền trên mỗi đơn vị. Cắt lỗ kéo theo (trailing stop) kiểu chandelier đặt dưới giá cao nhất kể từ khi vào lệnh một khoảng bằng 3 lần ATR.","en":"A fixed-point stop is too tight when the market is wild and too wide when it is quiet. A common approach is to place the stop 1.5 to 3 ATR from entry so ordinary fluctuation does not take you out. Position size is then worked backwards: the money you accept losing divided by the stop distance in money per unit. A chandelier-style trailing stop sits 3 ATR below the highest price reached since entry."}},{"h":{"vi":"Dải Bollinger","en":"Bollinger Bands"},"p":{"vi":"Dải Bollinger do John Bollinger phát triển đầu thập niên 1980. Đường giữa là SMA20; dải trên và dải dưới cách đường giữa 2 lần độ lệch chuẩn của giá đóng cửa trong 20 nến. Dải nở rộng khi biến động tăng và co lại khi biến động giảm. Phần lớn giá đóng cửa, thường khoảng 85 đến 90 phần trăm, nằm trong dải, nhưng giá không tuân theo phân phối chuẩn nên đừng coi con số đó là xác suất chính xác. Chạm dải trên không phải tín hiệu bán, chạm dải dưới không phải tín hiệu mua.","en":"Bollinger Bands were developed by John Bollinger in the early 1980s. The middle line is the SMA20; the upper and lower bands sit 2 standard deviations of the last 20 closes away from it. The bands widen when volatility rises and narrow when it falls. Most closes, typically about 85 to 90 percent, fall inside the bands, but prices are not normally distributed, so do not treat that figure as an exact probability. Touching the upper band is not a sell signal, and touching the lower band is not a buy signal."}},{"h":{"vi":"Kênh Keltner","en":"Keltner channel"},"p":{"vi":"Kênh Keltner hiện đại dùng EMA20 làm đường giữa, hai biên cách đường giữa 2 lần ATR (một số nền tảng dùng 1,5). Ý tưởng gốc của Chester Keltner từ năm 1960 đã được Linda Raschke chỉnh lại thành dạng này. Vì ATR mượt hơn độ lệch chuẩn, kênh Keltner có bề rộng ổn định hơn dải Bollinger và ít bị giật bởi một nến bất thường. Giá đóng cửa ngoài biên Keltner là dấu hiệu chuyển động mạnh, thường được dùng trong các hệ thống giao dịch phá vỡ theo xu hướng.","en":"The modern Keltner channel uses the EMA20 as its middle line with bands 2 ATR away (some platforms use 1.5). Chester Keltner's original 1960 idea was reworked into this form by Linda Raschke. Because ATR is smoother than standard deviation, the Keltner channel has a steadier width than Bollinger Bands and is less disturbed by one unusual candle. A close outside the Keltner band signals a strong move and is often used in trend-following breakout systems."}},{"h":{"vi":"Nén và bung","en":"The squeeze"},"p":{"vi":"Biến động có tính chu kỳ: giai đoạn yên ắng thường được nối tiếp bởi giai đoạn sôi động và ngược lại. Đây là một trong số ít đặc tính thống kê bền vững của thị trường. Nén (squeeze) là khi dải Bollinger co hẹp bất thường; một định nghĩa phổ biến là dải Bollinger nằm lọt hẳn trong kênh Keltner. Nén báo rằng một chuyển động lớn có khả năng sắp đến, nhưng không báo hướng. Hãy chờ giá đóng cửa ra khỏi vùng nén rồi mới theo, và nhớ rằng cú bung đầu tiên đôi khi là giả.","en":"Volatility is cyclical: quiet periods tend to be followed by active ones and vice versa. This is one of the few durable statistical features of markets. A squeeze is when Bollinger Bands become unusually narrow; a popular definition is Bollinger Bands sitting entirely inside the Keltner channel. A squeeze says a large move is likely coming, but not its direction. Wait for a close outside the squeeze range before following, and remember that the first burst is sometimes a fake."}},{"h":{"vi":"Đi dọc dải","en":"Walking the band"},"p":{"vi":"Trong một xu hướng mạnh, giá có thể bám sát dải trên nhiều nến liên tiếp, liên tục đóng cửa gần hoặc ngoài dải trong khi dải nở rộng. Hiện tượng này gọi là đi dọc dải (band walk) và là dấu hiệu của sức mạnh, không phải của sự quá đà. Người bán chỉ vì giá chạm dải trên sẽ bị cuốn ngược. Chiến lược bán ở dải trên, mua ở dải dưới chỉ hợp lý khi thị trường đi ngang với dải nằm ngang và hẹp; hãy kiểm tra độ dốc của đường giữa trước khi chọn cách đánh.","en":"In a strong trend price can hug the upper band for many candles, closing near or outside it again and again while the bands widen. This is called walking the band and it is a sign of strength, not of excess. Anyone selling just because price touched the upper band gets run over. Selling the upper band and buying the lower one only makes sense in a sideways market with flat, narrow bands; check the slope of the middle line before choosing your approach."}}],"example":{"vi":"Giả sử tài khoản 100 triệu đồng và bạn chấp nhận rủi ro 1 phần trăm mỗi lệnh, tức 1 triệu đồng. Cổ phiếu đang ở giá 50 nghìn đồng, ATR 14 ngày là 1,5 nghìn đồng (3 phần trăm giá). Bạn đặt cắt lỗ cách điểm vào 2 lần ATR, tức 3 nghìn đồng, ở mức 47 nghìn. Khối lượng bằng 1.000.000 chia 3.000, khoảng 333 cổ phiếu, làm tròn xuống 300 cho chẵn lô, giá trị vị thế 15 triệu đồng. Nếu một cổ phiếu khác cùng giá nhưng ATR gấp đôi, cắt lỗ sẽ rộng 6 nghìn và khối lượng chỉ còn khoảng 166 cổ phiếu, làm tròn xuống 100. Cổ phiếu biến động mạnh hơn thì mua ít hơn, để mỗi lệnh thua tốn xấp xỉ cùng một số tiền (chỉ lệch do làm tròn lô).","en":"Suppose a 100 million dong account and a risk of 1 percent per trade, which is 1 million dong. The stock trades at 50 thousand dong with a 14-day ATR of 1.5 thousand (3 percent of price). You set the stop 2 ATR from entry, 3 thousand dong away, at 47 thousand. Size is 1,000,000 divided by 3,000, about 333 shares, rounded down to 300 to fit the lot size, a position worth 15 million dong. If another stock at the same price has twice the ATR, the stop is 6 thousand wide and the size falls to about 166 shares, rounded down to 100. The more volatile the stock, the fewer shares you buy, so every losing trade costs roughly the same amount of money (the difference comes only from lot rounding)."},"story":{"title":{"vi":"Nhóm Rùa và chữ N","en":"The Turtles and the letter N"},"text":{"vi":"Năm 1983 tại Chicago, nhà giao dịch hàng hóa Richard Dennis tranh luận với cộng sự William Eckhardt: giao dịch giỏi là bẩm sinh hay dạy được? Để phân xử, họ đăng tuyển và chọn hai lớp học viên, tổng cộng khoảng hai mươi người với xuất thân rất khác nhau, huấn luyện trong khoảng hai tuần rồi giao tiền thật để giao dịch. Nhóm này được gọi là Nhóm Rùa. Bộ quy tắc của họ, sau này được cựu thành viên Curtis Faith công bố, xoay quanh một đại lượng gọi là N: trung bình 20 ngày của biên độ thực, về bản chất chính là ATR. Mỗi đơn vị vị thế được tính sao cho một bước di chuyển bằng 1N tương đương 1 phần trăm tài khoản, và cắt lỗ đặt cách điểm vào 2N. Nhờ vậy một hợp đồng ngô yên ắng và một hợp đồng bạc dữ dội mang cùng mức rủi ro. Theo các tường thuật, nhóm đã kiếm được hơn 100 triệu đô la trong vài năm. Bài học: điều làm nên khác biệt là kiểm soát rủi ro theo biến động, áp dụng nhất quán, nhiều hơn là tín hiệu vào lệnh.","en":"In Chicago in 1983 the commodity trader Richard Dennis argued with his partner William Eckhardt: is good trading innate or teachable? To settle it they advertised and selected two classes of trainees, about twenty people in all from very different backgrounds, trained them for roughly two weeks and gave them real money to trade. The group became known as the Turtles. Their rulebook, later made public by former member Curtis Faith, revolved around a quantity called N: the 20-day average of true range, in essence the ATR. Each position unit was sized so that a move of 1N equalled 1 percent of the account, and stops were placed 2N from entry. A sleepy corn contract and a violent silver contract therefore carried the same risk. By published accounts the group earned more than 100 million dollars over a few years. The lesson: what made the difference was volatility-based risk control applied consistently, more than the entry signal."}},"mistakes":{"vi":["Dùng cùng một khoảng cắt lỗ theo số điểm cho mọi mã và mọi giai đoạn bất kể biến động.","Bán vì giá chạm dải Bollinger trên trong khi giá đang đi dọc dải trong xu hướng mạnh.","Đoán trước hướng bung của vùng nén thay vì chờ giá đóng cửa ra ngoài.","Nghĩ rằng ATR tăng nghĩa là giá sắp tăng, trong khi ATR chỉ đo độ lớn chứ không đo hướng."],"en":["Using the same fixed-point stop for every symbol and every period regardless of volatility.","Selling because price touched the upper Bollinger Band while it is walking the band in a strong trend.","Guessing the direction of a squeeze breakout instead of waiting for a close outside.","Thinking a rising ATR means price will rise, when ATR measures size, not direction."]},"practice":{"vi":"Trên StockGym, bật Bollinger, Keltner và ATR 14 ở khung ngày của bạc, BTC hoặc MWG. Trước mỗi lệnh, đọc giá trị ATR và kéo cắt lỗ ra đúng 2 lần ATR từ điểm vào, rồi tính khối lượng sao cho mỗi lệnh rủi ro cùng một số tiền. Tìm các vùng dải Bollinger co hẹp, tiến từng nến để xem giá bung về hướng nào, và so mức sụt giảm trong bảng tổng kết với các phiên bạn đặt cắt lỗ tùy ý.","en":"On StockGym, switch on Bollinger, Keltner and ATR 14 on the daily chart of silver, BTC or MWG. Before each trade read the ATR value and drag the stop exactly 2 ATR from entry, then size the position so each trade risks the same amount of money. Look for places where the Bollinger Bands narrow, step forward to see which way price breaks, and compare the drawdown in the session summary with sessions where you placed stops arbitrarily."}},{"id":"ta-volume","title":{"vi":"Khối lượng giao dịch: tiếng nói đứng sau giá","en":"Volume: the voice behind price"},"summary":{"vi":"Giá cho biết thị trường đi đâu, khối lượng cho biết có bao nhiêu tiền thật sự đồng ý với bước đi đó. Đọc được khối lượng giúp bạn phân biệt cú phá vỡ có lực với cú phá vỡ giả.","en":"Price tells you where the market went; volume tells you how much money actually agreed with the move. Reading volume helps you separate breakouts with force behind them from fake ones."},"points":[{"h":{"vi":"Khối lượng là gì và so với cái gì","en":"What volume is, and compared with what"},"p":{"vi":"Khối lượng là số cổ phiếu hoặc hợp đồng được khớp trong một nến. Con số tuyệt đối không nói lên nhiều, vì mỗi mã có thanh khoản khác nhau. Thứ có ý nghĩa là khối lượng tương đối: so nến hiện tại với trung bình 20 nến gần nhất (đường MA20 của khối lượng). Một nến có khối lượng gấp 1,5 đến 2 lần trung bình thường được coi là bất thường. Cũng nên nhớ khối lượng có tính mùa vụ trong ngày: đầu phiên và cuối phiên luôn cao hơn giữa phiên, nên hãy so cùng khung giờ với nhau.","en":"Volume is the number of shares or contracts traded during one candle. The raw number means little because every symbol has different liquidity. What matters is relative volume: compare the current candle with the average of the last 20 candles (a 20-period moving average of volume). A candle with 1.5 to 2 times average volume is usually considered unusual. Remember that volume is seasonal within the day: the open and the close are always busier than midday, so compare like with like."}},{"h":{"vi":"Xác nhận phá vỡ","en":"Confirming a breakout"},"p":{"vi":"Khi giá vượt kháng cự hoặc thủng hỗ trợ, câu hỏi là có bao nhiêu người tham gia. Phá vỡ đi kèm khối lượng tăng rõ rệt cho thấy nhiều người chấp nhận mua ở giá cao hơn, nên xác suất đi tiếp thường tốt hơn. Phá vỡ với khối lượng thấp dễ là cú quét dừng lỗ rồi quay đầu. Đây là quy tắc kinh điển, nhưng không phải định luật: nhiều cú phá vỡ khối lượng lớn vẫn thất bại, và ở thị trường đi xuống giá có thể rơi mà không cần khối lượng lớn, vì chỉ cần thiếu người mua là đủ.","en":"When price clears resistance or breaks support, the question is how many participants joined. A breakout on clearly rising volume shows that many traders accepted higher prices, so the odds of follow-through are usually better. A low-volume breakout is more likely a stop run that reverses. This is the classic rule, not a law: plenty of high-volume breakouts still fail, and in declines price can fall without heavy volume, because a simple absence of buyers is enough."}},{"h":{"vi":"Khối lượng trong nhịp tăng và nhịp giảm","en":"Volume on up moves versus down moves"},"p":{"vi":"Trong một xu hướng tăng khỏe, khối lượng thường nở ra ở các nhịp tăng và co lại ở các nhịp điều chỉnh: người bán không vội, người mua chủ động. Khi điều ngược lại xuất hiện, tức là các phiên giảm có khối lượng lớn hơn các phiên tăng, đó là dấu hiệu phân phối và xu hướng đang yếu đi. Giá lập đỉnh mới trong khi khối lượng thấp hơn đỉnh trước gọi là phân kỳ khối lượng. Nó là lời cảnh báo để siết quản lý lệnh, không phải tín hiệu bán khống ngay.","en":"In a healthy uptrend, volume tends to expand on rallies and contract on pullbacks: sellers are in no hurry and buyers are aggressive. When the opposite appears, with down days heavier than up days, it hints at distribution and a weakening trend. A new price high on lower volume than the previous high is called volume divergence. Treat it as a warning to tighten trade management, not as an immediate signal to short."}},{"h":{"vi":"Khối lượng cao trào","en":"Climax volume"},"p":{"vi":"Cao trào là nến có biên độ rất rộng kèm khối lượng cực lớn, thường gấp ba lần trung bình trở lên, sau một xu hướng đã kéo dài. Cao trào bán xảy ra khi người cầm hàng hoảng loạn bán bằng mọi giá, cao trào mua xảy ra khi đám đông đổ xô mua đuổi. Vì lực của một phía bị dùng cạn trong thời gian ngắn, cao trào hay đánh dấu điểm dừng tạm thời của xu hướng. Tuy nhiên giá thường quay lại kiểm tra vùng đó một lần nữa với khối lượng thấp hơn trước khi đảo chiều thật, nên đừng vội bắt đáy ngay tại nến cao trào.","en":"A climax is a very wide-range candle on extreme volume, often three times average or more, after an extended trend. A selling climax happens when holders panic and sell at any price; a buying climax happens when the crowd rushes in to chase. Because one side burns through its fuel in a short time, a climax often marks a temporary halt of the trend. Price frequently retests that area on lower volume before any real reversal, so do not rush to catch the bottom on the climax candle itself."}},{"h":{"vi":"OBV: cộng dồn khối lượng","en":"OBV: running total of volume"},"p":{"vi":"On-Balance Volume do Joseph Granville phổ biến năm 1963. Cách tính rất đơn giản: nếu giá đóng cửa hôm nay cao hơn hôm qua thì cộng toàn bộ khối lượng hôm nay vào OBV, nếu thấp hơn thì trừ đi, bằng nhau thì giữ nguyên. Giá trị tuyệt đối của OBV không quan trọng, hướng đi mới quan trọng. Ý tưởng là dòng tiền đi trước giá: OBV lập đỉnh mới trong khi giá còn đi ngang gợi ý tích lũy, OBV đi xuống trong khi giá còn giữ đỉnh gợi ý phân phối. Bằng chứng thống kê cho ý tưởng này là yếu, hãy coi nó là công cụ phụ.","en":"On-Balance Volume was popularized by Joseph Granville in 1963. The calculation is simple: if today's close is above yesterday's, add all of today's volume to OBV; if it is below, subtract it; if unchanged, leave OBV alone. The absolute level is irrelevant, the direction matters. The idea is that money flow leads price: OBV making new highs while price is still flat suggests accumulation, OBV falling while price holds its highs suggests distribution. Statistical evidence for this is weak, so treat it as a secondary tool."}},{"h":{"vi":"Giới hạn: ngoại hối và thị trường giao ngay","en":"Limits: FX and spot markets"},"p":{"vi":"Cổ phiếu và hợp đồng tương lai giao dịch trên sàn tập trung nên có khối lượng thật. Ngoại hối giao ngay và kim loại giao ngay thì phi tập trung: không có một nơi nào ghi lại toàn bộ giao dịch. Con số khối lượng bạn thấy trên các nền tảng thường là khối lượng tick, tức số lần giá thay đổi tại một nhà môi giới, chỉ là đại diện gần đúng. Với các mã này, hãy dùng khối lượng tick một cách dè dặt hoặc dựa vào biên độ nến và ATR để đo mức độ hoạt động. Ngoài ra, khối lượng không cho biết ai mua ai bán: mỗi giao dịch luôn có cả hai phía.","en":"Stocks and futures trade on centralized exchanges and report real volume. Spot FX and spot metals are decentralized: no single venue records all trades. The volume shown on most platforms is tick volume, meaning the count of price changes at one broker, which is only a rough proxy. For these symbols use tick volume cautiously, or rely on candle range and ATR to gauge activity. Also remember that volume never tells you who bought and who sold: every trade has both sides."}}],"example":{"vi":"Một cổ phiếu giả định đi ngang 6 tuần trong vùng 48 đến 52 nghìn đồng, khối lượng trung bình 20 phiên là 1 triệu cổ phiếu mỗi phiên. Lần thứ nhất giá đóng cửa ở 52,4 với khối lượng 0,7 triệu, thấp hơn trung bình 30 phần trăm; hai phiên sau giá rơi lại về 50. Lần thứ hai giá đóng cửa ở 53,1 với khối lượng 2,3 triệu, gấp 2,3 lần trung bình, nến thân dài đóng gần đỉnh. Người giao dịch theo phá vỡ chỉ vào ở lần thứ hai, đặt cắt lỗ dưới 51,5 (rủi ro 1,6 nghìn mỗi cổ phiếu) và mục tiêu 56, tức biên trên 52 cộng bề rộng 4 của vùng đi ngang; lãi kỳ vọng 2,9, tỷ lệ lãi trên rủi ro khoảng 1,8. Khối lượng không đảm bảo thắng, nó chỉ giúp bỏ qua lần thử yếu.","en":"A hypothetical stock ranges for 6 weeks between 48 and 52, with 20-day average volume of 1 million shares. On the first attempt it closes at 52.4 on 0.7 million shares, 30 percent below average; two sessions later it is back at 50. On the second attempt it closes at 53.1 on 2.3 million shares, 2.3 times average, with a long body closing near the high. A breakout trader takes only the second attempt, places a stop below 51.5 (risk of 1.6 per share) and targets 56, the 52 boundary plus the 4-point height of the range; that is 2.9 of potential gain, a reward-to-risk of about 1.8. Volume does not guarantee a win; it simply helps you skip the weak attempt."},"story":{"title":{"vi":"Ngày cả phố Wall bán theo cha đẻ của OBV","en":"The day Wall Street sold on the word of the father of OBV"},"text":{"vi":"Joseph Granville là người đưa chỉ báo OBV đến với công chúng qua cuốn sách năm 1963, và đến cuối thập niên 1970 ông là cây bút bản tin chứng khoán nổi tiếng nhất nước Mỹ. Tối ngày 6 tháng 1 năm 1981, ông cho nhân viên gọi điện tới các khách hàng đặt mua bản tin với một thông điệp ngắn: bán hết. Hôm sau chỉ số Dow Jones giảm khoảng 24 điểm, tương đương khoảng 2,4 phần trăm, và khối lượng trên sàn New York lập kỷ lục thời đó, khoảng 93 triệu cổ phiếu. Một người đã làm rung chuyển cả thị trường. Nhưng phần sau của câu chuyện ít được kể hơn: Granville tiếp tục bi quan khi thị trường giá lên lớn bắt đầu vào tháng 8 năm 1982, và những người đi theo ông đã bỏ lỡ một trong những đợt tăng dài nhất lịch sử. Bài học: khối lượng và OBV là công cụ hữu ích để đọc thị trường, nhưng ngay cả người hiểu chúng nhất cũng sai lớn khi tin vào dự báo của mình hơn là vào giá đang diễn ra.","en":"Joseph Granville brought On-Balance Volume to the public in his 1963 book, and by the late 1970s he was the most famous market newsletter writer in America. On the evening of January 6, 1981, he had his staff phone subscribers with a short message: sell everything. The next day the Dow Jones Industrial Average fell about 24 points, roughly 2.4 percent, and New York Stock Exchange volume set a record for the time at about 93 million shares. One man had shaken the whole market. The rest of the story is told less often: Granville stayed bearish when the great bull market began in August 1982, and those who followed him missed one of the longest advances in history. The lesson: volume and OBV are useful tools for reading a market, but even the person who understood them best was badly wrong once he trusted his forecast more than the price in front of him."}},"mistakes":{"vi":["So khối lượng tuyệt đối giữa các mã hoặc giữa đầu phiên và giữa phiên thay vì so với trung bình của chính mã đó ở cùng khung giờ.","Coi phân kỳ khối lượng là tín hiệu đảo chiều chắc chắn và bán khống ngược xu hướng.","Bắt đáy ngay tại nến cao trào bán mà không chờ giá kiểm tra lại và không đặt cắt lỗ.","Tin tuyệt đối vào khối lượng tick của ngoại hối giao ngay như thể đó là khối lượng thật của toàn thị trường."],"en":["Comparing raw volume across symbols, or the open against midday, instead of against the symbol's own average for the same time of day.","Treating volume divergence as a guaranteed reversal and shorting against the trend.","Buying the selling-climax candle itself without waiting for a retest and without a stop.","Trusting tick volume on spot FX as if it were the true volume of the whole market."]},"practice":{"vi":"Mở VN30F1M hoặc một cổ phiếu như FPT, HPG, AAPL, NVDA ở khung ngày trong chế độ replay, bật Volume và vẽ hộp quanh các vùng đi ngang. Tiến từng nến, mỗi lần giá phá hộp hãy ghi vào nhật ký khối lượng nến phá vỡ gấp mấy lần trung bình, rồi sau 20 đến 30 lần xuất CSV để đếm xem nhóm khối lượng cao có thật sự tốt hơn nhóm khối lượng thấp hay không.","en":"Open VN30F1M or a stock such as FPT, HPG, AAPL or NVDA on the daily chart in replay, turn on Volume and draw a box around each trading range. Step one candle at a time; every time price leaves a box, note in the journal how many times average volume the breakout candle had, then after 20 to 30 cases export the CSV and count whether the high-volume group really did better than the low-volume group."}},{"id":"ta-patterns","title":{"vi":"Mô hình giá: vai đầu vai, hai đỉnh, tam giác, cờ","en":"Chart patterns: head and shoulders, double tops, triangles, flags"},"summary":{"vi":"Mô hình giá là những hình dạng lặp lại của cuộc giằng co giữa người mua và người bán. Chúng cho bạn một kịch bản rõ ràng: vào ở đâu, sai ở đâu, mục tiêu ở đâu, với điều kiện bạn chờ xác nhận.","en":"Chart patterns are recurring shapes of the tug of war between buyers and sellers. They give you a clear script: where to enter, where you are wrong, and where the target is, provided you wait for confirmation."},"points":[{"h":{"vi":"Hai nhóm: đảo chiều và tiếp diễn","en":"Two families: reversal and continuation"},"p":{"vi":"Mô hình đảo chiều xuất hiện sau một xu hướng rõ và báo hiệu xu hướng có thể đổi: vai đầu vai, hai đỉnh, hai đáy, ba đỉnh. Mô hình tiếp diễn là quãng nghỉ giữa xu hướng: cờ, cờ đuôi nheo, tam giác, hình chữ nhật. Điều kiện đầu tiên của mô hình đảo chiều là phải có thứ gì đó để đảo: một hình vai đầu vai giữa vùng đi ngang không có ý nghĩa. Mô hình càng lớn, hình thành càng lâu và trên khung thời gian càng cao thì mục tiêu càng xa và càng đáng tin hơn mô hình vài nến trên khung nhỏ.","en":"Reversal patterns appear after a clear trend and warn that it may change: head and shoulders, double top, double bottom, triple top. Continuation patterns are pauses within a trend: flags, pennants, triangles, rectangles. The first requirement of a reversal pattern is that there is something to reverse: a head and shoulders in the middle of a range means nothing. The larger the pattern, the longer it took to form and the higher the timeframe, the further its target and the more it deserves attention compared with a few-candle
