shape on a small timeframe."}},{"h":{"vi":"Vai đầu vai","en":"Head and shoulders"},"p":{"vi":"Mô hình gồm ba đỉnh: vai trái, đầu cao hơn, vai phải thấp hơn đầu. Đường nối hai đáy giữa các đỉnh gọi là đường cổ. Mô hình chỉ hoàn thành khi giá đóng cửa dưới đường cổ; trước đó nó mới chỉ là ba đỉnh. Khối lượng điển hình giảm dần từ vai trái sang vai phải. Mục tiêu đo: lấy khoảng cách từ đỉnh đầu xuống đường cổ, trừ xuống từ điểm phá vỡ. Cắt lỗ thường đặt trên vai phải. Giá hay quay lại kiểm tra đường cổ từ phía dưới, đó là điểm vào thứ hai. Phiên bản lật ngược ở đáy gọi là vai đầu vai ngược.","en":"The pattern has three peaks: a left shoulder, a higher head, and a right shoulder lower than the head. The line joining the two troughs between them is the neckline. The pattern is complete only when price closes below the neckline; before that it is just three peaks. Volume typically declines from the left shoulder to the right. Measured target: take the distance from the top of the head to the neckline and project it down from the breakout point. The stop usually goes above the right shoulder. Price often retests the neckline from below, offering a second entry. The mirror image at a bottom is the inverse head and shoulders."}},{"h":{"vi":"Hai đỉnh và hai đáy","en":"Double top and double bottom"},"p":{"vi":"Hai đỉnh là hai lần giá bị từ chối ở gần cùng một mức, cách nhau một nhịp giảm rõ ràng. Hai đáy là hình ngược lại. Lỗi phổ biến nhất là gọi tên mô hình quá sớm: hai đỉnh chỉ được xác nhận khi giá đóng cửa dưới đáy nằm giữa hai đỉnh. Trước lúc đó, thống kê cho thấy phần lớn trường hợp giá vượt đỉnh và đi tiếp theo xu hướng cũ. Mục tiêu đo bằng chiều cao từ đỉnh xuống đáy giữa, tính từ điểm phá vỡ. Hai đỉnh không cần bằng nhau tuyệt đối, chênh lệch vài phần trăm vẫn chấp nhận được.","en":"A double top is two rejections near the same level, separated by a clear decline. A double bottom is the inverse. The most common error is naming the pattern too early: a double top is confirmed only when price closes below the trough between the two peaks. Before that, statistics show that in most cases price goes on to exceed the peaks and continue the old trend. The measured target is the height from the peaks to the middle trough, projected from the breakout point. The two peaks need not be identical; a difference of a few percent is acceptable."}},{"h":{"vi":"Tam giác và hình chữ nhật","en":"Triangles and rectangles"},"p":{"vi":"Tam giác cân có đỉnh thấp dần và đáy cao dần, thể hiện sự co hẹp biến động, hướng phá vỡ thường theo xu hướng trước đó nhưng không chắc chắn. Tam giác tăng có cạnh trên nằm ngang và đáy cao dần, thiên về phá lên. Tam giác giảm thì ngược lại. Hình chữ nhật là vùng đi ngang giữa hỗ trợ và kháng cự song song. Mục tiêu đo của cả ba là chiều cao phần rộng nhất của mô hình, tính từ điểm phá vỡ. Phá vỡ xảy ra ở khoảng nửa đến ba phần tư chiều dài tam giác thường mạnh hơn phá vỡ sát mũi nhọn.","en":"A symmetrical triangle has lower highs and higher lows, showing contracting volatility; the breakout usually follows the prior trend but that is not certain. An ascending triangle has a flat top and rising lows and leans toward an upside break. A descending triangle is the opposite. A rectangle is a range between parallel support and resistance. The measured target for all three is the height of the widest part of the pattern, projected from the breakout point. Breakouts that happen between half and three quarters of the way along a triangle tend to be stronger than those near the apex."}},{"h":{"vi":"Cờ và cờ đuôi nheo","en":"Flags and pennants"},"p":{"vi":"Sau một nhịp chạy mạnh gần như thẳng đứng, gọi là cán cờ, giá nghỉ trong một kênh nhỏ dốc ngược xu hướng (cờ) hoặc một tam giác nhỏ (cờ đuôi nheo), thường chỉ kéo dài từ vài nến đến khoảng ba tuần trên khung ngày, với khối lượng giảm dần. Phá vỡ theo hướng cán cờ là tín hiệu tiếp diễn. Mục tiêu đo: lấy chiều dài cán cờ cộng vào điểm phá vỡ. Cắt lỗ đặt ở phía bên kia của lá cờ. Nếu lá cờ thoái lui quá nửa cán cờ hoặc kéo dài quá lâu, đó không còn là cờ nữa mà là một vùng tích lũy khác.","en":"After a sharp, nearly vertical run called the pole, price rests in a small channel sloping against the trend (a flag) or a small triangle (a pennant), usually lasting from a few candles to about three weeks on a daily chart, with volume drying up. A break in the direction of the pole signals continuation. Measured target: add the length of the pole to the breakout point. The stop goes on the other side of the flag. If the flag retraces more than half the pole or drags on too long, it is no longer a flag but a different kind of consolidation."}},{"h":{"vi":"Tỷ lệ thất bại và sự chủ quan","en":"Failure rates and subjectivity"},"p":{"vi":"Mục tiêu đo là ước lượng, không phải lời hứa. Các thống kê quy mô lớn, nổi tiếng nhất là của Thomas Bulkowski, cho thấy tùy mô hình và thị trường, một phần đáng kể các cú phá vỡ không đi tới mục tiêu, và nhiều cú thất bại ngay sau khi phá vỡ. Nghiên cứu học thuật của Lo, Mamaysky và Wang năm 2000 tìm thấy một số mô hình có mang thông tin thống kê, nhưng lợi thế nhỏ. Thêm vào đó, nhận diện mô hình rất chủ quan: nhìn lại quá khứ thì hình nào cũng rõ. Vì vậy hãy luôn chờ nến đóng cửa xác nhận, luôn có cắt lỗ, và chỉ nhận lệnh khi tỷ lệ lãi trên rủi ro từ 2 trở lên.","en":"A measured move is an estimate, not a promise. Large statistical surveys, the best known being Thomas Bulkowski's, show that depending on the pattern and the market a substantial share of breakouts never reach the target, and many fail right after the break. The academic study by Lo, Mamaysky and Wang in 2000 found that some patterns do carry statistical information, but the edge is small. On top of that, pattern recognition is highly subjective: in hindsight every shape looks obvious. So always wait for a confirming close, always use a stop, and take the trade only when reward-to-risk is 2 or better."}}],"example":{"vi":"Một cổ phiếu giả định tăng từ 60 lên 80, rồi tạo vai trái ở 80, đầu ở 86, vai phải ở 81, hai đáy giữa các đỉnh đều ở quanh 74 nên đường cổ nằm ngang ở 74. Chiều cao mô hình là 86 trừ 74 bằng 12. Giá đóng cửa ở 73,2 với khối lượng tăng: mô hình được xác nhận. Mục tiêu đo là 74 trừ 12 bằng 62. Người giao dịch bán ở 73,2, đặt cắt lỗ trên vai phải ở 81,5, rủi ro 8,3, lợi nhuận kỳ vọng 11,2, tỷ lệ chỉ 1,35. Nếu chờ giá hồi lên kiểm tra đường cổ và bán ở 74 với cắt lỗ 77 (trên đỉnh nhịp hồi), rủi ro còn 3 và tỷ lệ lên 4. Cùng một mô hình, điểm vào quyết định chất lượng lệnh.","en":"A hypothetical stock rallies from 60 to 80, then forms a left shoulder at 80, a head at 86 and a right shoulder at 81, with both troughs near 74, so the neckline is flat at 74. Pattern height is 86 minus 74, or 12. Price closes at 73.2 on rising volume: the pattern is confirmed. The measured target is 74 minus 12, or 62. A trader who sells at 73.2 with a stop above the right shoulder at 81.5 risks 8.3 to make 11.2, a ratio of only 1.35. Waiting for the retest and selling at 74 with a stop at 77 (above the retest high) cuts the risk to 3 and lifts the ratio to 4. Same pattern, but the entry decides the quality of the trade."},"story":{"title":{"vi":"Hai đỉnh thế kỷ chưa từng được xác nhận","en":"The double top of the century that never confirmed"},"text":{"vi":"Tháng 3 năm 2007, VN-Index lập đỉnh quanh 1.170 điểm rồi rơi xuống khoảng 235 điểm vào tháng 2 năm 2009. Mười một năm sau, tháng 4 năm 2018, chỉ số quay lại và nhích qua mốc 1.200 điểm trong vài phiên, rồi giảm khoảng một phần tư giá trị chỉ trong ba tháng. Khắp các diễn đàn, người ta gọi đó là hai đỉnh thế kỷ. Thật ra theo sách giáo khoa, hai đỉnh chỉ được xác nhận khi giá thủng đáy nằm giữa, tức là vùng 235 điểm, điều chưa bao giờ xảy ra. Thứ thật sự tồn tại là một vùng kháng cự mà cả thị trường cùng nhớ. Đầu năm 2021, chỉ số giằng co quanh 1.200 điểm trong nhiều tuần, và rất nhiều người bán ra vì tin đỉnh thứ ba sẽ lặp lại lịch sử. Tháng 4 năm 2021 chỉ số vượt hẳn lên, và đến đầu tháng 1 năm 2022 đã lên tới khoảng 1.528 điểm. Bài học: mô hình chưa có xác nhận chỉ là một giả thuyết, và một mức kháng cự từng giữ nhiều lần vẫn có thể bị phá; hãy giao dịch theo cái giá đã làm, không theo cái tên bạn đặt cho hình vẽ.","en":"In March 2007 the VN-Index peaked near 1,170 points and then fell to about 235 by February 2009. Eleven years later, in April 2018, the index returned and edged above 1,200 for a few sessions, then lost roughly a quarter of its value in three months. Across the forums people called it the double top of the century. By the textbook, though, a double top is confirmed only when price breaks the trough in between, here the 235 area, which never happened. What really existed was a resistance zone the whole market remembered. In early 2021 the index wrestled with 1,200 for weeks, and many investors sold, convinced a third peak would repeat history. In April 2021 the index broke clearly higher, and by early January 2022 it stood near 1,528. The lesson: a pattern without confirmation is only a hypothesis, and a resistance level that held several times can still give way; trade what price has done, not the name you gave the drawing."}},"mistakes":{"vi":["Vào lệnh khi mô hình mới hình thành một nửa, trước khi giá đóng cửa qua đường cổ hoặc biên mô hình.","Tìm mô hình đảo chiều ở nơi không có xu hướng nào để đảo.","Coi mục tiêu đo là điểm chắc chắn tới và không dời cắt lỗ hay chốt bớt trên đường đi.","Ép hình: vẽ lại đường cổ nhiều lần cho đến khi biểu đồ khớp với điều mình muốn thấy."],"en":["Entering when the pattern is half formed, before price closes through the neckline or boundary.","Looking for reversal patterns where there is no trend to reverse.","Treating the measured target as a certainty and never trailing the stop or scaling out along the way.","Forcing the shape: redrawing the neckline until the chart fits what you want to see."]},"practice":{"vi":"Trong chế độ replay với tương lai bị che, chọn khung ngày của một mã bất kỳ, dùng công cụ đường xu hướng và hộp để đánh dấu mô hình ngay khi bạn nghĩ nó đang hình thành, dùng công cụ đo để tính mục tiêu, rồi tiến từng nến. Chỉ vào lệnh sau nến đóng cửa xác nhận, kéo cắt lỗ và chốt lời về đúng vị trí theo sách, và ghi vào nhật ký tên mô hình để sau này xuất CSV tính tỷ lệ tới mục tiêu của từng loại.","en":"In replay with the future hidden, pick the daily chart of any symbol, use the trend line and box tools to mark a pattern as soon as you think it is forming, use the measure tool to compute the target, then step one candle at a time. Enter only after a confirming close, drag the stop-loss and take-profit to the textbook positions, and write the pattern name in the journal so you can later export the CSV and compute how often each type reached its target."}},{"id":"ta-fib-elliott","title":{"vi":"Fibonacci và sóng Elliott","en":"Fibonacci and Elliott wave"},"summary":{"vi":"Fibonacci cho bạn các vùng giá để chờ nhịp điều chỉnh kết thúc, sóng Elliott cho bạn một bản đồ về cấu trúc xu hướng. Cả hai hữu ích khi dùng như khung tham chiếu và nguy hiểm khi dùng như lời tiên tri.","en":"Fibonacci gives you price zones where a pullback may end; Elliott wave gives you a map of trend structure. Both are useful as a frame of reference and dangerous as a prophecy."},"points":[{"h":{"vi":"Các tỷ lệ đến từ đâu","en":"Where the ratios come from"},"p":{"vi":"Dãy Fibonacci là 1, 1, 2, 3, 5, 8, 13, 21, 34... trong đó mỗi số bằng tổng hai số đứng trước. Chia một số cho số liền sau, kết quả tiến dần về 0,618, gọi là tỷ lệ vàng. Chia cho số cách hai vị trí được 0,382, cách ba vị trí được 0,236. Mức 50 phần trăm không phải tỷ lệ Fibonacci, nó được giữ lại theo truyền thống từ lý thuyết Dow. Mức 78,6 là căn bậc hai của 0,618. Các mức mở rộng hay dùng là 127,2, 161,8 và 261,8 phần trăm. Không có lý do vật lý nào buộc giá phải tôn trọng các con số này; chúng hoạt động một phần vì nhiều người cùng nhìn.","en":"The Fibonacci sequence runs 1, 1, 2, 3, 5, 8, 13, 21, 34... where each number is the sum of the two before it. Divide a number by the next one and the result converges on 0.618, the golden ratio. Divide by the number two places ahead and you get 0.382; three places ahead gives 0.236. The 50 percent level is not a Fibonacci ratio; it is kept by tradition from Dow theory. The 78.6 level is the square root of 0.618. Common extension levels are 127.2, 161.8 and 261.8 percent. No physical law forces price to respect these numbers; they work partly because many traders watch them."}},{"h":{"vi":"Fibonacci thoái lui","en":"Fibonacci retracement"},"p":{"vi":"Chọn một nhịp sóng rõ ràng, kéo công cụ từ đáy lên đỉnh trong xu hướng tăng (từ đỉnh xuống đáy trong xu hướng giảm). Công cụ vẽ ra các mức 23,6, 38,2, 50, 61,8 và 78,6 phần trăm của nhịp đó. Điều chỉnh nông tới 38,2 thường gặp trong xu hướng mạnh; vùng 50 đến 61,8 là vùng được theo dõi nhiều nhất; điều chỉnh sâu hơn 78,6 cho thấy xu hướng đã yếu nhiều. Mức Fibonacci tự nó không phải tín hiệu vào lệnh. Nó đáng giá hơn hẳn khi trùng với một thứ khác: hỗ trợ cũ, đường trung bình, đường xu hướng, gọi là vùng hợp lưu, và khi có nến xác nhận giá bật lại.","en":"Pick one clear swing and drag the tool from low to high in an uptrend (high to low in a downtrend). It draws the 23.6, 38.2, 50, 61.8 and 78.6 percent levels of that swing. Shallow pullbacks to 38.2 are typical of strong trends; the 50 to 61.8 zone is the most watched; a pullback deeper than 78.6 says the trend has weakened a lot. A Fibonacci level is not an entry signal by itself. It becomes far more valuable when it coincides with something else, such as prior support, a moving average or a trend line, called confluence, and when a candle confirms that price is turning."}},{"h":{"vi":"Fibonacci mở rộng để đặt mục tiêu","en":"Fibonacci extension for targets"},"p":{"vi":"Mở rộng dùng ba điểm: đầu nhịp sóng, cuối nhịp sóng và cuối nhịp điều chỉnh. Từ điểm thứ ba, chiếu chiều dài nhịp đầu theo các tỷ lệ 100, 127,2, 161,8 phần trăm để có các mục tiêu tiềm năng. Ví dụ nhịp tăng từ 100 lên 120 dài 20 điểm, điều chỉnh về 110: mục tiêu 100 phần trăm là 130, mục tiêu 161,8 là 110 cộng 32,36 bằng 142,36. Cách dùng thực tế là chốt từng phần tại các mức này và dời cắt lỗ lên, vì không ai biết trước giá sẽ dừng ở mức nào.","en":"Extensions use three points: the start of the swing, its end, and the end of the pullback. From the third point, project the length of the first swing by 100, 127.2 and 161.8 percent to get potential targets. Example: a rally from 100 to 120 is 20 points long, and the pullback ends at 110: the 100 percent target is 130, the 161.8 target is 110 plus 32.36, or 142.36. In practice traders scale out at these levels and trail the stop, because nobody knows in advance where price will stop."}},{"h":{"vi":"Cấu trúc 5 sóng đẩy và 3 sóng điều chỉnh","en":"The 5-3 structure"},"p":{"vi":"Theo Ralph Nelson Elliott, xu hướng đi thành năm sóng: sóng 1, 3, 5 cùng chiều xu hướng, sóng 2 và 4 đi ngược. Sau đó là điều chỉnh ba sóng A, B, C. Cấu trúc này lồng vào nhau ở mọi cấp độ: mỗi sóng đẩy lớn lại gồm năm sóng nhỏ hơn. Sóng 3 thường dài và mạnh nhất, hay bằng khoảng 161,8 phần trăm sóng 1. Sóng 2 thường điều chỉnh sâu, 50 đến 61,8 phần trăm sóng 1; sóng 4 thường nông hơn, quanh 38,2 phần trăm sóng 3. Đây là các khuynh hướng hay gặp, không phải quy tắc.","en":"According to Ralph Nelson Elliott, a trend unfolds in five waves: waves 1, 3 and 5 move with the trend, waves 2 and 4 against it. A three-wave correction labeled A, B, C follows. The structure nests at every degree: each large impulse wave consists of five smaller ones. Wave 3 is usually the longest and strongest, often about 161.8 percent of wave 1. Wave 2 tends to retrace deeply, 50 to 61.8 percent of wave 1; wave 4 is usually shallower, around 38.2 percent of wave 3. These are common tendencies, not rules."}},{"h":{"vi":"Ba luật cứng của sóng đẩy","en":"The three hard rules of an impulse"},"p":{"vi":"Một cách đếm sóng đẩy bị coi là sai nếu vi phạm bất kỳ luật nào sau đây. Một: sóng 2 không bao giờ thoái lui quá 100 phần trăm sóng 1, tức không vượt qua điểm bắt đầu của sóng 1. Hai: sóng 3 không bao giờ là sóng ngắn nhất trong ba sóng 1, 3 và 5. Ba: sóng 4 không đi vào vùng giá của sóng 1 (ngoại lệ là mô hình chéo, một dạng đặc biệt). Giá trị thực tế của ba luật này là chúng cho bạn điểm vô hiệu rõ ràng: nếu bạn mua ở sóng 2, cắt lỗ đặt dưới điểm bắt đầu sóng 1.","en":"An impulse count is considered wrong if it breaks any of these rules. One: wave 2 never retraces more than 100 percent of wave 1, meaning it never goes beyond the start of wave 1. Two: wave 3 is never the shortest of waves 1, 3 and 5. Three: wave 4 does not enter the price territory of wave 1 (the exception is a diagonal, a special form). The practical value of the rules is that they give you a clear invalidation point: if you buy in wave 2, the stop belongs below the start of wave 1."}},{"h":{"vi":"Tính chủ quan và giới hạn","en":"Subjectivity and limits"},"p":{"vi":"Vấn đề lớn nhất của sóng Elliott là hai người giỏi có thể đếm cùng một biểu đồ theo hai cách khác nhau, và khi cách đếm sai, người ta đổi nhãn rồi nói lý thuyết vẫn đúng. Một lý thuyết luôn giải thích được quá khứ nhưng không bị bác bỏ được thì khó kiểm định. Với Fibonacci, vì có tới năm sáu mức trên mỗi nhịp sóng, giá gần như lúc nào cũng nằm gần một mức nào đó. Các nghiên cứu thống kê nhìn chung không tìm thấy bằng chứng mạnh rằng giá đảo chiều tại mức Fibonacci nhiều hơn tại các mức ngẫu nhiên. Hãy dùng chúng để lập kế hoạch và đặt điểm vô hiệu, không để dự đoán.","en":"The biggest problem with Elliott wave is that two skilled analysts can count the same chart in two different ways, and when a count fails, the labels are changed and the theory is declared intact. A theory that always explains the past but cannot be refuted is hard to test. With Fibonacci, because there are five or six levels on every swing, price is almost always near one of them. Statistical studies have generally not found strong evidence that price reverses at Fibonacci levels more often than at random ones. Use both for planning and for defining invalidation, not for prediction."}}],"example":{"vi":"Hợp đồng VN30F1M trong một ví dụ giả định tăng từ 1.200 lên 1.260, nhịp dài 60 điểm. Các mức thoái lui: 38,2 phần trăm là 1.260 trừ 22,9 bằng 1.237,1; 50 phần trăm là 1.230; 61,8 phần trăm là 1.260 trừ 37,1 bằng 1.222,9. Giá lùi về 1.224, gần mức 61,8 và trùng với đường EMA50, rồi xuất hiện nến tăng thân dài. Người giao dịch mua ở 1.228, đặt cắt lỗ ở 1.198, dưới điểm bắt đầu nhịp sóng theo luật thứ nhất của Elliott, rủi ro 30 điểm. Mục tiêu mở rộng 100 phần trăm là 1.224 cộng 60 bằng 1.284, lãi 56 điểm; mức 161,8 là 1.224 cộng 97,1 bằng 1.321,1. Tỷ lệ lãi trên rủi ro tới mục tiêu đầu khoảng 1,9.","en":"In a hypothetical example the VN30F1M contract rallies from 1,200 to 1,260, a 60-point swing. Retracement levels: 38.2 percent is 1,260 minus 22.9, or 1,237.1; 50 percent is 1,230; 61.8 percent is 1,260 minus 37.1, or 1,222.9. Price pulls back to 1,224, near the 61.8 level and right on the EMA50, then prints a long bullish candle. The trader buys at 1,228 with a stop at 1,198, below the start of the swing as Elliott's first rule requires, risking 30 points. The 100 percent extension target is 1,224 plus 60, or 1,284, a gain of 56 points; the 161.8 level is 1,224 plus 97.1, or 1,321.1. Reward-to-risk to the first target is about 1.9."},"story":{"title":{"vi":"Người kế toán nằm trên giường bệnh","en":"The accountant on his sickbed"},"text":{"vi":"Ralph Nelson Elliott sinh năm 1871, làm kế toán cho các công ty đường sắt ở Trung Mỹ suốt nhiều năm. Một căn bệnh mắc phải ở đó buộc ông nghỉ việc khi đã ngoài năm mươi tuổi. Không còn đi làm được, ông dành nhiều năm ngồi nhà nghiên cứu hàng chục năm dữ liệu chỉ số chứng khoán, từ biểu đồ năm xuống tới biểu đồ nửa giờ, và nhận ra các nhịp lên xuống có vẻ lặp lại theo một cấu trúc. Tháng 3 năm 1935, khi thị trường đang rơi và nhiều người sợ một đợt sụp đổ mới, ông gửi điện tín cho nhà tư vấn đầu tư Charles Collins khẳng định đợt giảm sắp kết thúc. Thị trường quay đầu gần như ngay sau đó và tăng mạnh. Collins giúp ông xuất bản cuốn The Wave Principle năm 1938. Câu chuyện thường được kể như bằng chứng rằng lý thuyết đúng. Nhưng một dự báo trúng không chứng minh được một phương pháp, và chính những người theo Elliott sau này đã có nhiều dự báo sai nổi tiếng. Bài học: hãy khâm phục sự quan sát kiên nhẫn của ông, và kiểm chứng mọi cách đếm sóng bằng một điểm vô hiệu cụ thể.","en":"Ralph Nelson Elliott was born in 1871 and spent years as an accountant for railroad companies in Central America. An illness he contracted there forced him to stop working in his fifties. Unable to hold a job, he spent years at home studying decades of stock index data, from yearly charts down to half-hourly ones, and came to believe that the swings repeated in a recognizable structure. In March 1935, with the market falling and many fearing a new collapse, he sent a telegram to the investment adviser Charles Collins insisting the decline was about to end. The market turned almost immediately and rallied strongly. Collins helped him publish The Wave Principle in 1938. The story is often told as proof that the theory works. But one correct call does not validate a method, and Elliott's later followers produced many famous misses. The lesson: admire his patient observation, and test every wave count against a specific invalidation point."}},"mistakes":{"vi":["Kéo Fibonacci trên những nhịp sóng nhỏ và mờ nhạt cho đến khi có một mức khớp với điểm mình muốn vào.","Đặt lệnh chờ mua ngay tại mức 61,8 mà không cần hợp lưu hay nến xác nhận.","Giữ cách đếm sóng dù giá đã vi phạm một trong ba luật cứng, rồi đổi nhãn để khỏi phải nhận sai.","Dùng sóng Elliott để dự báo đỉnh đáy xa thay vì để xác định điểm cắt lỗ cho lệnh hiện tại."],"en":["Dragging Fibonacci over small, unclear swings until some level matches the entry you already wanted.","Placing a resting buy order exactly at 61.8 without confluence or a confirming candle.","Keeping a wave count after price has broken one of the three hard rules, then relabeling to avoid admitting the error.","Using Elliott wave to forecast distant tops and bottoms instead of to define the stop for the current trade."]},"practice":{"vi":"Trong replay, bật chỉ báo ZigZag để thấy các nhịp sóng khách quan, kéo công cụ Fibonacci trên nhịp gần nhất rồi tiến từng nến để xem giá phản ứng ở mức nào; ghi kết quả từng lần vào nhật ký. Sau đó tự đếm sóng bằng tay trước, rồi mới bật chỉ báo đếm Elliott tự động để so sánh và kiểm tra xem cách đếm của bạn có vi phạm ba luật cứng hay không.","en":"In replay, turn on the ZigZag indicator to see swings objectively, drag the Fibonacci tool over the latest swing and step one candle at a time to see where price reacts; log each outcome in the journal. Then count the waves by hand first, and only afterwards switch on the auto Elliott count to compare and check whether your count breaks any of the three hard rules."}},{"id":"ta-mtf-plan","title":{"vi":"Đa khung thời gian và xây dựng kế hoạch giao dịch","en":"Multiple timeframes and building a trade plan"},"summary":{"vi":"Khung lớn cho biết nên đánh theo hướng nào, khung nhỏ cho biết vào lúc nào. Một kế hoạch viết sẵn điểm vào, điểm sai, mục tiêu và khối lượng biến ý tưởng thành một quyết định có thể đo lường.","en":"The higher timeframe tells you which direction to trade; the lower one tells you when. A plan that states entry, invalidation, target and size in advance turns an idea into a decision you can measure."},"points":[{"h":{"vi":"Phân tích từ trên xuống","en":"Top-down analysis"},"p":{"vi":"Dùng ba khung thời gian cách nhau khoảng 4 đến 6 lần. Người giao dịch theo nhịp vài ngày thường dùng tuần, ngày, 4 giờ hoặc 1 giờ; người giao dịch trong ngày dùng ngày, 1 giờ, 5 hoặc 15 phút. Khung lớn nhất để xác định xu hướng và các vùng hỗ trợ kháng cự quan trọng. Khung giữa là khung giao dịch chính, nơi bạn tìm cấu trúc: nhịp điều chỉnh, vùng tích lũy, mô hình. Khung nhỏ nhất chỉ để tinh chỉnh điểm vào và điểm cắt lỗ. Luôn bắt đầu từ khung lớn; nếu bắt đầu từ khung nhỏ, bạn sẽ tìm lý do ở khung lớn để biện minh cho lệnh đã muốn vào.","en":"Use three timeframes spaced roughly 4 to 6 times apart. A swing trader typically uses weekly, daily and 4-hour or 1-hour; a day trader uses daily, 1-hour and 5 or 15 minutes. The highest timeframe defines the trend and the key support and resistance zones. The middle one is your trading timeframe, where you look for structure: pullbacks, consolidations, patterns. The lowest is only for refining the entry and the stop. Always start from the top; if you start from the small chart, you will go looking on the big one for reasons to justify a trade you already want."}},{"h":{"vi":"Khi các khung mâu thuẫn","en":"When timeframes disagree"},"p":{"vi":"Mâu thuẫn là chuyện bình thường: xu hướng tăng trên khung ngày luôn chứa các xu hướng giảm trên khung 15 phút, đó chính là nhịp điều chỉnh. Nguyên tắc chung là khung lớn có trọng lượng hơn. Cách dùng tốt nhất: chờ nhịp ngược xu hướng trên khung nhỏ đưa giá về vùng giá trị trên khung lớn (hỗ trợ, đường trung bình), rồi vào khi khung nhỏ quay lại thuận chiều khung lớn. Nếu khung lớn đi ngang không rõ hướng, hoặc giá đang nằm sát kháng cự khung lớn, cách xử lý đúng thường là đứng ngoài hoặc giảm khối lượng.","en":"Disagreement is normal: a daily uptrend always contains 15-minute downtrends, which are simply the pullbacks. The general principle is that the higher timeframe carries more weight. The best use: wait for a counter-trend move on the small chart to bring price back to a value area on the big chart (support, a moving average), then enter when the small chart turns back in the direction of the big one. If the higher timeframe is flat and unclear, or price is pressed against higher-timeframe resistance, the correct response is usually to stand aside or cut size."}},{"h":{"vi":"Tín hiệu kích hoạt vào lệnh","en":"The entry trigger"},"p":{"vi":"Bối cảnh (xu hướng, vùng giá) không phải là lý do bấm nút; bạn cần một sự kiện cụ thể, quan sát được, gọi là tín hiệu kích hoạt. Ví dụ: nến đóng cửa vượt đỉnh nến trước tại vùng hỗ trợ, giá phá đường xu hướng của nhịp điều chỉnh, giá đóng cửa trên EMA20 sau khi chạm EMA50. Tín hiệu phải được viết đủ rõ để một người khác nhìn biểu đồ cũng trả lời được có hay không. Nếu tín hiệu không xuất hiện thì không có lệnh, dù phân tích của bạn hay đến đâu. Phần lớn lệnh tệ sinh ra từ việc vào trước khi có tín hiệu vì sợ lỡ.","en":"Context (trend, location) is not a reason to click; you need a specific, observable event called the trigger. Examples: a candle closing above the prior candle's high at support, price breaking the trend line of the pullback, a close back above EMA20 after touching EMA50. The trigger must be written clearly enough that another person looking at the chart could answer yes or no. If the trigger does not appear, there is no trade, however good your analysis is. Most bad trades come from entering before the trigger out of fear of missing out."}},{"h":{"vi":"Đặt cắt lỗ ở nơi ý tưởng sai","en":"Put the stop where the idea is wrong"},"p":{"vi":"Cắt lỗ không phải là số tiền bạn chịu mất, mà là mức giá chứng minh lý do vào lệnh không còn đúng: dưới đáy nhịp điều chỉnh, dưới vùng hỗ trợ, bên kia mô hình. Thêm một khoảng đệm cho nhiễu, phổ biến là 0,5 đến 1 lần ATR 14, để không bị quét bởi dao động bình thường. Tránh đặt đúng số tròn hoặc sát ngay dưới đáy rõ ràng nơi ai cũng đặt. Trình tự đúng là: xác định điểm cắt lỗ theo biểu đồ trước, rồi mới tính khối lượng sao cho khoản lỗ vừa bằng mức rủi ro cho phép. Không làm ngược lại.","en":"A stop is not the amount of money you are willing to lose; it is the price that proves your reason for entering is no longer valid: below the pullback low, below the support zone, on the other side of the pattern. Add a buffer for noise, commonly 0.5 to 1 times ATR 14, so that normal fluctuation does not take you out. Avoid exact round numbers or the spot just under an obvious low where everyone else's stops sit. The correct order is: find the stop from the chart first, then compute the size so the loss equals your allowed risk. Never the other way round."}},{"h":{"vi":"Mục tiêu và tỷ lệ lãi trên rủi ro","en":"Target and reward-to-risk"},"p":{"vi":"Mục tiêu đặt ở nơi giá có khả năng gặp cản: kháng cự khung lớn, đỉnh cũ, mục tiêu đo của mô hình, mức Fibonacci mở rộng. Tỷ lệ lãi trên rủi ro bằng khoảng cách tới mục tiêu chia cho khoảng cách tới cắt lỗ. Tỷ lệ thắng hòa vốn bằng 1 chia cho (1 cộng tỷ lệ đó): với tỷ lệ 2, bạn chỉ cần thắng trên 33,3 phần trăm số lệnh, chưa tính phí. Nếu mục tiêu hợp lý gần nhất không cho tỷ lệ tối thiểu bạn đặt ra, thường là 1,5 đến 2, hãy bỏ lệnh. Đừng kéo mục tiêu ra xa cho đẹp con số; mục tiêu phải do biểu đồ quyết định.","en":"The target goes where price is likely to meet opposition: higher-timeframe resistance, a prior high, a pattern's measured move, a Fibonacci extension. Reward-to-risk is the distance to target divided by the distance to the stop. The break-even win rate is 1 divided by (1 plus that ratio): at a ratio of 2 you need to win just over 33.3 percent of trades, before costs. If the nearest sensible target does not give your minimum ratio, usually 1.5 to 2, skip the trade. Do not stretch the target to make the number look good; the chart decides the target."}},{"h":{"vi":"Viết kế hoạch thành văn bản","en":"Write the plan down"},"p":{"vi":"Một kế hoạch đầy đủ trả lời bảy câu hỏi trước khi vào lệnh: giao dịch mã nào và khung nào; bối cảnh khung lớn là gì; tín hiệu kích hoạt là gì; cắt lỗ ở đâu; mục tiêu ở đâu; khối lượng bao nhiêu; và quản lý lệnh ra sao (khi nào dời cắt lỗ, khi nào chốt bớt, khi nào thoát theo thời gian). Viết ra trước khi vào, vì sau khi có vị thế bộ não sẽ tìm cách bào chữa cho nó. Sau khi lệnh đóng, ghi lại kết quả và việc bạn có làm đúng kế hoạch không. Một lệnh lỗ đúng kế hoạch là lệnh tốt; một lệnh thắng phá kế hoạch là thói quen xấu được thưởng.","en":"A complete plan answers seven questions before entry: which symbol and timeframe; what the higher-timeframe context is; what the trigger is; where the stop is; where the target is; what the size is; and how the trade is managed (when to move the stop, when to scale out, when to exit on time). Write it before entering, because once you hold a position your mind starts defending it. After the trade closes, record the result and whether you followed the plan. A losing trade that followed the plan is a good trade; a winner that broke the plan is a bad habit being rewarded."}}],"example":{"vi":"Ví dụ giả định với một cổ phiếu. Khung tuần: giá trên SMA200, đỉnh và đáy cao dần, kháng cự gần nhất ở 120. Khung ngày: giá điều chỉnh từ 112 về 100, đúng vùng đỉnh cũ nay là hỗ trợ và trùng EMA50. Khung 1 giờ: nhịp điều chỉnh tạo đáy 99,5 rồi có nến đóng cửa trên đường xu hướng giảm ở 101,5, đó là tín hiệu kích hoạt. Kế hoạch: mua 101,5; ATR 14 khung ngày là 2,4 nên cắt lỗ đặt ở 99,5 trừ nửa ATR bằng 98,3, rủi ro 3,2 mỗi cổ phiếu; mục tiêu 112 (đỉnh cũ), lãi 10,5; tỷ lệ 3,3. Tài khoản 300 triệu đồng, rủi ro 1 phần trăm là 3 triệu, giá tính theo nghìn đồng nên khối lượng là 3.000.000 chia 3.200, làm tròn xuống lô 100 thành 900 cổ phiếu.","en":"A hypothetical stock example. Weekly: price above SMA200, higher highs and higher lows, nearest resistance at 120. Daily: price pulls back from 112 to 100, exactly at a former high that is now support and on the EMA50. 1-hour: the pullback bottoms at 99.5, then a candle closes above the down trend line at 101.5, which is the trigger. Plan: buy 101.5; daily ATR 14 is 2.4, so the stop goes at 99.5 minus half an ATR, or 98.3, a risk of 3.2 per share; target 112 (the prior high), a gain of 10.5; ratio 3.3. With a 300 million dong account, 1 percent risk is 3 million dong; prices are quoted in thousand dong, so the size is 3,000,000 divided by 3,200, rounded down to a 100-share lot: 900 shares."},"story":{"title":{"vi":"Hùng và tín hiệu mua trên khung 5 phút","en":"Hung and the 5-minute buy signal"},"text":{"vi":"Hùng là một người giao dịch phái sinh mới vào nghề (ví dụ minh họa). Anh chỉ mở một biểu đồ: VN30F1M khung 5 phút. Một buổi sáng anh thấy mô hình hai đáy rất đẹp, đường MACD cắt lên, và vào lệnh mua hai hợp đồng. Giá nhích lên 3 điểm rồi rơi thẳng 15 điểm. Anh mua thêm vì tin hai đáy sẽ giữ, và cuối phiên cắt lỗ cả bốn hợp đồng. Tối đó một người bạn bảo anh mở khung ngày: chỉ số đã thủng hỗ trợ từ ba hôm trước và đang nằm dưới cả EMA20 lẫn EMA50; khung 1 giờ là một chuỗi đỉnh thấp dần. Hai đáy đẹp của anh chỉ là một nhịp nghỉ nhỏ trong xu hướng giảm lớn, ngay dưới vùng kháng cự khung 1 giờ. Từ đó Hùng dán một tờ giấy lên màn hình với ba dòng: khung ngày nói gì, khung giờ đang ở đâu, tín hiệu 5 phút có thuận chiều không. Số lệnh của anh giảm một nửa, và lần đầu tiên sau nhiều tháng tài khoản ngừng đi xuống. Bài học: tín hiệu trên khung nhỏ chỉ có giá trị khi nó đi cùng hướng với bức tranh lớn.","en":"Hung is a new derivatives trader (an illustration). He kept only one chart open: VN30F1M on the 5-minute timeframe. One morning he saw a beautiful double bottom with MACD crossing up and bought two contracts. Price rose 3 points, then dropped 15 straight. He bought more, sure the double bottom would hold, and closed all four contracts at a loss by the end of the session. That evening a friend told him to open the daily chart: the index had broken support three days earlier and sat below both EMA20 and EMA50; the 1-hour chart was a staircase of lower highs. His pretty double bottom was a small pause inside a large downtrend, right under 1-hour resistance. From then on Hung taped a note to his monitor with three lines: what does the daily say, where is the hourly, does the 5-minute signal agree. His trade count halved, and for the first time in months the account stopped shrinking. The lesson: a signal on a small timeframe is worth something only when it points the same way as the big picture."}},"mistakes":{"vi":["Bắt đầu phân tích từ khung nhỏ rồi lên khung lớn tìm lý do ủng hộ lệnh đã muốn vào.","Chuyển sang khung lớn hơn khi lệnh đang lỗ để tìm cớ giữ thay vì cắt theo kế hoạch.","Tính khối lượng trước rồi mới đặt cắt lỗ cho vừa số tiền chịu mất, khiến điểm dừng nằm giữa vùng nhiễu.","Vào lệnh khi tỷ lệ lãi trên rủi ro dưới 1 vì tin rằng lần này chắc thắng."],"en":["Starting from the small timeframe and then searching the big one for reasons to support a trade you already want.","Switching to a higher timeframe while losing in order to justify holding instead of exiting as planned.","Choosing the size first and then squeezing the stop to fit the money, which leaves the stop in the middle of the noise.","Taking a trade with reward-to-risk below 1 because this one feels certain."]},"practice":{"vi":"Trong replay chế độ Phái sinh, bắt đầu mỗi lần ở khung ngày hoặc tuần, kẻ đường ngang cho các vùng hỗ trợ kháng cự, rồi xuống khung 1 giờ và 5 phút để chờ tín hiệu; vì tương lai bị che ở mọi khung nên bạn không thể nhìn trộm. Trước mỗi lệnh hãy kéo cắt lỗ và chốt lời vào đúng vị trí và dùng công cụ đo để kiểm tra tỷ lệ lãi trên rủi ro tối thiểu 1,5; ghi kế hoạch vào nhật ký trước khi tiến nến tiếp theo.","en":"In replay in Derivatives mode, start each session on the daily or weekly chart, draw horizontal lines at the key support and resistance zones, then drop to 1-hour and 5-minute to wait for the trigger; the future is hidden on every timeframe, so you cannot peek. Before each trade drag the stop-loss and take-profit into place and use the measure tool to check a minimum reward-to-risk of 1.5; write the plan in the journal before stepping to the next candle."}},{"id":"ta-risk","title":{"vi":"Quản lý rủi ro và tính khối lượng vào lệnh","en":"Risk management and position sizing"},"summary":{"vi":"Bạn không kiểm soát được lệnh tiếp theo thắng hay thua, nhưng kiểm soát hoàn toàn được việc thua thì mất bao nhiêu. Đây là kỹ năng quyết định một người giao dịch còn tồn tại sau một năm hay không.","en":"You cannot control whether the next trade wins or loses, but you fully control how much a loss costs. This is the skill that decides whether a trader is still around a year from now."},"points":[{"h":{"vi":"Quy tắc 1 đến 2 phần trăm","en":"The 1 to 2 percent rule"},"p":{"vi":"Mỗi lệnh chỉ được phép làm mất tối đa 1 đến 2 phần trăm vốn tài khoản nếu chạm cắt lỗ. Đây là mức rủi ro, không phải giá trị vị thế: bạn có thể mua lượng cổ phiếu trị giá 30 phần trăm tài khoản mà chỉ rủi ro 1 phần trăm nếu điểm cắt lỗ đủ gần. Lý do là chuỗi thua chắc chắn sẽ đến. Với tỷ lệ thắng 50 phần trăm, chuỗi 6 đến 7 lệnh thua liên tiếp rất dễ xuất hiện trong vài trăm lệnh. Rủi ro 1 phần trăm thì 10 lệnh thua liên tiếp mất khoảng 9,6 phần trăm; rủi ro 10 phần trăm thì mất khoảng 65 phần trăm.","en":"No single trade may lose more than 1 to 2 percent of account equity if the stop is hit. This is risk, not position value: you can hold stock worth 30 percent of the account while risking only 1 percent if the stop is close enough. The reason is that losing streaks are certain to come. With a 50 percent win rate, a run of 6 or 7 consecutive losses is very likely somewhere in a few hundred trades. At 1 percent risk, 10 straight losses cost about 9.6 percent; at 10 percent risk they cost about 65 percent."}},{"h":{"vi":"Công thức tính khối lượng","en":"The position size formula"},"p":{"vi":"Khối lượng bằng (vốn nhân phần trăm rủi ro) chia cho (khoảng cách cắt lỗ nhân giá trị mỗi điểm). Với cổ phiếu, giá trị mỗi điểm là 1 nên khối lượng bằng số tiền rủi ro chia cho chênh lệch giữa giá vào và giá cắt lỗ. Với hợp đồng tương lai, nhân thêm hệ số hợp đồng, ví dụ VN30F1M là 100.000 đồng mỗi điểm, hợp đồng E-mini S&P 500 tiêu chuẩn là 50 đô la mỗi điểm. Luôn làm tròn xuống. Hệ quả quan trọng: cắt lỗ càng xa thì khối lượng càng nhỏ, nên thị trường biến động mạnh tự động khiến bạn đánh nhỏ lại. Nếu kết quả nhỏ hơn một hợp đồng hoặc một lô, câu trả lời đúng là không vào lệnh.","en":"Size equals (equity times risk percent) divided by (stop distance times value per point). For stocks the value per point is 1, so size equals the money at risk divided by the difference between entry and stop. For futures, multiply by the contract multiplier, for example 100,000 dong per point on VN30F1M or 50 dollars per point on a standard S&P 500 E-mini contract. Always round down. An important consequence: the wider the stop, the smaller the size, so volatile markets automatically make you trade smaller. If the result is less than one contract or one lot, the correct answer is no trade."}},{"h":{"vi":"Kỳ vọng của hệ thống","en":"Expectancy"},"p":{"vi":"Kỳ vọng mỗi lệnh bằng tỷ lệ thắng nhân lãi trung bình, trừ đi tỷ lệ thua nhân lỗ trung bình. Ví dụ thắng 40 phần trăm số lệnh, lãi trung bình 2R, lỗ trung bình 1R (R là rủi ro ban đầu của một lệnh): kỳ vọng bằng 0,4 nhân 2 trừ 0,6 nhân 1 bằng dương 0,2R mỗi lệnh. Một hệ thống thắng 70 phần trăm nhưng lãi trung bình 0,5R và lỗ trung bình 1,5R có kỳ vọng âm 0,1R. Tỷ lệ thắng cao không có nghĩa là có lãi. Phí và trượt giá phải được trừ vào trước khi tính, và kỳ vọng chỉ đáng tin khi đo trên vài chục đến vài trăm lệnh.","en":"Expectancy per trade equals win rate times average win, minus loss rate times average loss. Example: you win 40 percent of trades, the average win is 2R and the average loss is 1R (R is the initial risk on one trade): expectancy is 0.4 times 2 minus 0.6 times 1, or plus 0.2R per trade. A system that wins 70 percent of the time but averages 0.5R on wins and 1.5R on losses has an expectancy of minus 0.1R. A high win rate does not mean profit. Commissions and slippage must be deducted first, and expectancy is trustworthy only when measured over dozens to hundreds of trades."}},{"h":{"vi":"Toán học của sụt giảm vốn","en":"Drawdown mathematics"},"p":{"vi":"Lỗ và lãi không đối xứng. Mức lãi cần để hồi vốn bằng mức lỗ chia cho (1 trừ mức lỗ). Lỗ 10 phần trăm cần lãi 11,1 phần trăm; lỗ 20 cần 25; lỗ 33,3 cần 50; lỗ 50 phần trăm cần lãi 100 phần trăm; lỗ 90 phần trăm cần lãi 900 phần trăm. Càng xuống sâu, đường về càng dốc, và áp lực tâm lý càng khiến người ta đánh liều hơn. Vì vậy mục tiêu số một không phải là kiếm thật nhiều mà là giữ cho các đợt sụt giảm nông. Nhiều người đặt sẵn ngưỡng dừng: ví dụ mất 6 phần trăm trong tháng thì nghỉ giao dịch và xem lại.","en":"Losses and gains are not symmetric. The gain needed to recover equals the loss divided by (1 minus the loss). A 10 percent loss needs 11.1 percent; 20 needs 25; 33.3 needs 50; a 50 percent loss needs a 100 percent gain; a 90 percent loss needs 900 percent. The deeper you go, the steeper the road back, and the more the pressure pushes people into reckless bets. So the first objective is not to make as much as possible but to keep drawdowns shallow. Many traders set a circuit breaker in advance: for example, after losing 6 percent in a month they stop trading and review."}},{"h":{"vi":"Rủi ro cộng dồn, đòn bẩy và khoảng trống giá","en":"Combined risk, leverage and gaps"},"p":{"vi":"Năm lệnh mua năm cổ phiếu ngân hàng không phải năm rủi ro 1 phần trăm độc lập, mà gần như một lệnh rủi ro 5 phần trăm, vì chúng thường rơi cùng nhau. Hãy giới hạn tổng rủi ro đang mở, ví dụ 5 đến 6 phần trăm, và gộp các mã tương quan cao làm một. Đòn bẩy không thay đổi công thức tính khối lượng, nó chỉ cho phép bạn vi phạm công thức dễ hơn. Cuối cùng, cắt lỗ không phải bảo hiểm: khi giá mở cửa nhảy qua điểm dừng, bạn bị khớp ở giá tệ hơn. Giữ lệnh qua đêm, qua cuối tuần hoặc qua tin lớn thì nên giảm khối lượng.","en":"Five long positions in five bank stocks are not five independent 1 percent risks; they are close to one 5 percent bet, because they tend to fall together. Cap total open risk, for example at 5 to 6 percent, and count highly correlated symbols as one. Leverage does not change the sizing formula; it only makes it easier to break it. Finally, a stop is not insurance: when price gaps through it, you are filled at a worse level. If you hold overnight, over a weekend or through major news, reduce size."}}],"example":{"vi":"Tài khoản 200 triệu đồng, rủi ro 1 phần trăm mỗi lệnh là 2 triệu. Với VN30F1M, mỗi điểm trị giá 100.000 đồng: mua ở 1.250, cắt lỗ ở 1.242, khoảng cách 8 điểm, rủi ro mỗi hợp đồng 800.000 đồng, khối lượng bằng 2.000.000 chia 800.000 bằng 2,5, làm tròn xuống còn 2 hợp đồng. Nếu cắt lỗ phải đặt xa 25 điểm, rủi ro mỗi hợp đồng là 2,5 triệu, lớn hơn mức cho phép, nên không vào lệnh. Với cổ phiếu giá 50 nghìn, cắt lỗ ở 47 nghìn: rủi ro 3 nghìn mỗi cổ phiếu, khối lượng bằng 2.000.000 chia 3.000 khoảng 666, làm tròn xuống lô 100 thành 600 cổ phiếu, giá trị vị thế 30 triệu, bằng 15 phần trăm tài khoản nhưng rủi ro chỉ 0,9 phần trăm.","en":"A 200 million dong account risking 1 percent per trade can lose 2 million dong. On VN30F1M each point is worth 100,000 dong: buy at 1,250, stop at 1,242, a distance of 8 points, risk per contract 800,000 dong, so size is 2,000,000 divided by 800,000, or 2.5, rounded down to 2 contracts. If the stop had to be 25 points away, the risk per contract would be 2.5 million dong, above the limit, so there is no trade. For a stock at 50 thousand dong with the stop at 47 thousand: risk is 3 thousand per share, size is 2,000,000 divided by 3,000, about 666, rounded down to a 100-share lot: 600 shares, a position worth 30 million dong, 15 percent of the account, yet the risk is only 0.9 percent."},"story":{"title":{"vi":"Quỹ của những người đoạt giải Nobel","en":"The fund run by Nobel laureates"},"text":{"vi":"Long-Term Capital Management được John Meriwether lập năm 1994, trong số các thành viên chủ chốt có Robert Merton và Myron Scholes, hai người cùng nhận giải Nobel kinh tế năm 1997. Quỹ khai thác những chênh lệch giá rất nhỏ giữa các trái phiếu tương tự nhau và dùng đòn bẩy rất lớn để khuếch đại: đầu năm 1998 quỹ có khoảng 4,7 tỷ đô la vốn nhưng nắm hơn 100 tỷ đô la tài sản, tức đòn bẩy khoảng 25 lần, chưa kể các hợp đồng phái sinh. Hai năm 1995 và 1996 quỹ lãi khoảng 40 phần trăm mỗi năm sau phí. Mô hình của họ nói rằng một khoản lỗ lớn gần như không thể xảy ra. Ngày 17 tháng 8 năm 1998 nước Nga vỡ nợ, nhà đầu tư toàn cầu tháo chạy sang tài sản an toàn, và mọi vị thế tưởng như độc lập của quỹ cùng đi ngược một lúc. Trong chưa đầy bốn tháng quỹ mất khoảng 4,6 tỷ đô la. Ngày 23 tháng 9 năm 1998, 14 tổ chức tài chính phải góp khoảng 3,6 tỷ đô la để cứu quỹ, dưới sự điều phối của Cục Dự trữ Liên bang New York. Bài học: trí tuệ và mô hình không thay thế được giới hạn khối lượng; đòn bẩy cao biến một sai lầm hiếm gặp thành dấu chấm hết.","en":"Long-Term Capital Management was founded in 1994 by John Meriwether, with Robert Merton and Myron Scholes, who shared the 1997 Nobel prize in economics, among its partners. The fund exploited tiny price gaps between similar bonds and used enormous leverage to magnify them: at the start of 1998 it had about 4.7 billion dollars of capital but held more than 100 billion in assets, leverage of roughly 25 to 1, before counting derivatives. In 1995 and 1996 it earned about 40 percent a year after fees. Its models said a large loss was close to impossible. On August 17, 1998 Russia defaulted, investors worldwide fled to safe assets, and all the fund's supposedly independent positions moved against it at once. In under four months it lost about 4.6 billion dollars. On September 23, 1998, 14 financial institutions put up about 3.6 billion dollars to rescue it, coordinated by the Federal Reserve Bank of New York. The lesson: intelligence and models do not replace limits on size; high leverage turns a rare mistake into the final one."}},"mistakes":{"vi":["Tính rủi ro theo cảm giác hoặc theo số hợp đồng quen tay thay vì theo khoảng cách cắt lỗ của từng lệnh.","Tăng gấp đôi khối lượng sau một lệnh thua để gỡ nhanh.","Dời cắt lỗ ra xa khi giá tiến gần, biến khoản lỗ 1 phần trăm thành 5 phần trăm.","Mở nhiều lệnh cùng chiều trên các mã tương quan cao và coi đó là đa dạng hóa."],"en":["Sizing by feel or by a habitual number of contracts instead of by each trade's stop distance.","Doubling size after a loss to win it back quickly.","Moving the stop further away as price approaches it, turning a 1 percent loss into 5 percent.","Opening several same-direction trades in highly correlated symbols and calling it diversification."]},"practice":{"vi":"Trước mỗi lệnh trong replay, kéo cắt lỗ về đúng vị trí trên biểu đồ trước, rồi mới tính khối lượng theo công thức với rủi ro 1 phần trăm vốn phiên; ở chế độ Cổ phiếu hãy theo dõi tổng rủi ro của cả rổ. Sau 30 lệnh, mở bảng tổng kết phiên để xem mức sụt giảm lớn nhất và tỷ lệ thắng thua, rồi xuất nhật ký CSV để tự tính kỳ vọng theo R.","en":"Before every trade in replay, drag the stop-loss to its proper place on the chart first, then compute the size from the formula using 1 percent of session equity; in Stocks mode keep an eye on the total risk across the basket. After 30 trades, open the session summary to check maximum drawdown and win/loss, then export the journal CSV and compute your expectancy in R."}},{"id":"ta-backtest","title":{"vi":"Kiểm định phương pháp một cách trung thực","en":"Testing a method honestly"},"summary":{"vi":"Phương pháp nào cũng có vài ví dụ đẹp. Kiểm định trung thực là cách duy nhất để biết nó có lợi thế thật hay bạn chỉ đang nhớ những lần nó đúng.","en":"Every method has a few beautiful examples. Honest testing is the only way to know whether it has a real edge or whether you are just remembering the times it worked."},"points":[{"h":{"vi":"Viết quy tắc rõ ràng trước khi kiểm","en":"Write clear rules before you test"},"p":{"vi":"Một phương pháp chỉ kiểm định được khi quy tắc đủ cụ thể để hai người cùng áp dụng ra cùng một lệnh: điều kiện vào, điểm cắt lỗ, điểm thoát, khối lượng, khung thời gian, mã giao dịch. Viết ra trước khi nhìn dữ liệu. Sau đó ghi nhận mọi tín hiệu thỏa điều kiện, kể cả những cái xấu xí bạn không muốn vào. Nếu bạn cho phép mình bỏ qua tín hiệu theo cảm giác trong lúc kiểm, kết quả đo được là trí nhớ của bạn về quá khứ chứ không phải phương pháp.","en":"A method can be tested only when its rules are specific enough that two people applying them would take the same trades: entry condition, stop, exit, size, timeframe, symbol. Write them down before looking at the data. Then record every signal that meets the conditions, including the ugly ones you would rather skip. If you allow yourself to skip signals by feel during the test, what you measure is your memory of the past, not the method."}},{"h":{"vi":"Cỡ mẫu","en":"Sample size"},"p":{"vi":"Mười lệnh thắng bảy không nói lên điều gì: tung đồng xu mười lần được từ bảy mặt ngửa trở lên xảy ra khoảng 17 phần trăm số lần. Mốc tối thiểu thường được nhắc tới là 30 lệnh để có cái nhìn đầu tiên và 100 lệnh trở lên để tin vào tỷ lệ thắng. Với 100 lệnh và tỷ lệ thắng đo được 50 phần trăm, sai số ngẫu nhiên vẫn vào khoảng cộng trừ 10 điểm phần trăm. Mẫu cũng cần trải qua nhiều kiểu thị trường: tăng, giảm, đi ngang, biến động cao và thấp. Một trăm lệnh mua trong một năm thị trường tăng mạnh chỉ cho bạn biết rằng thị trường đã tăng.","en":"Seven wins out of ten says nothing: tossing a coin ten times gives seven or more heads about 17 percent of the time. The usual minimums are 30 trades for a first look and 100 or more before trusting a win rate. Even with 100 trades and a measured 50 percent win rate, random error is still about plus or minus 10 percentage points. The sample must also span different market types: rising, falling, sideways, high and low volatility. A hundred long trades during one strong bull year only tell you that the market went up."}},{"h":{"vi":"Trong mẫu và ngoài mẫu","en":"In-sample and out-of-sample"},"p":{"vi":"Chia dữ liệu làm hai phần. Phần trong mẫu, thường là 60 đến 70 phần trăm đầu, dùng để xây dựng và chỉnh quy tắc. Phần ngoài mẫu được khóa lại, chỉ mở ra một lần duy nhất sau khi quy tắc đã chốt. Nếu kết quả ngoài mẫu kém hẳn trong mẫu, phương pháp có lẽ chỉ khớp với nhiễu. Điều quan trọng: mỗi lần bạn xem kết quả ngoài mẫu rồi quay lại sửa quy tắc, phần đó không còn là ngoài mẫu nữa. Phương pháp chuyên nghiệp hơn là kiểm định cuốn chiếu: tối ưu trên một đoạn, áp dụng cho đoạn kế tiếp, rồi trượt cửa sổ đi.","en":"Split the data in two. The in-sample part, usually the first 60 to 70 percent, is for building and tuning the rules. The out-of-sample part is locked away and opened only once, after the rules are final. If out-of-sample results are far worse than in-sample, the method was probably fitted to noise. Crucially, every time you look at the out-of-sample result and go back to change a rule, that data stops being out-of-sample. The more professional approach is walk-forward testing: optimize on one segment, apply to the next, then slide the window."}},{"h":{"vi":"Khớp quá mức","en":"Overfitting"},"p":{"vi":"Khớp quá mức là khi quy tắc mô tả hoàn hảo quá khứ nhưng không nắm bắt được điều gì lặp lại. Dấu hiệu nhận biết: quá nhiều tham số và bộ lọc so với số lệnh; kết quả sụp đổ khi đổi tham số một chút (RSI 14 có lãi nhưng 13 và 15 lỗ); lợi nhuận đến từ vài lệnh cá biệt; bạn đã thử hàng trăm biến thể rồi chọn cái tốt nhất. Thử càng nhiều biến thể, khả năng cái tốt nhất chỉ là may mắn càng cao. Cách phòng: giữ quy tắc đơn giản, đòi hỏi vùng tham số rộng đều cho kết quả tương tự, và có lý do kinh tế hợp lý cho việc vì sao lợi thế tồn tại.","en":"Overfitting is when rules describe the past perfectly but capture nothing that repeats. Warning signs: too many parameters and filters for the number of trades; results that collapse when a parameter shifts slightly (RSI 14 profitable but 13 and 15 losing); profit coming from a handful of outlier trades; having tried hundreds of variations and picked the best. The more variations you try, the more likely the best one is simply luck. Defenses: keep rules simple, demand that a broad range of parameters gives similar results, and have a sensible economic reason why the edge should exist."}},{"h":{"vi":"Chi phí và trượt giá","en":"Costs and slippage"},"p":{"vi":"Rất nhiều lợi thế tồn tại trên giấy và biến mất sau phí. Mỗi lệnh phải trừ hoa hồng, thuế nếu có, chênh lệch mua bán và trượt giá, tính cho cả hai chiều vào và ra. Hãy so lãi trung bình mỗi lệnh với chi phí khứ hồi: nếu lãi gộp trung bình chỉ gấp một đến hai lần chi phí, phương pháp quá mong manh. Chiến lược càng ngắn hạn và càng nhiều lệnh thì chi phí càng quyết định. Cũng nên giả định khớp lệnh thận trọng: tín hiệu tính trên giá đóng cửa thì khớp ở giá mở cửa nến sau, và lệnh cắt lỗ khi có khoảng trống giá thì khớp ở giá mở cửa chứ không phải ở giá dừng.","en":"Many edges exist on paper and vanish after costs. Every trade must be charged commission, taxes where they apply, the bid-ask spread and slippage, on both the entry and the exit. Compare the average profit per trade with the round-trip cost: if average gross profit is only one or two times the cost, the method is too fragile. The shorter-term and more frequent the strategy, the more costs decide the outcome. Assume conservative fills too: a signal computed on the close is filled at the next candle's open, and a stop hit on a gap is filled at the open, not at the stop price."}},{"h":{"vi":"Nhìn trước tương lai và kiểm định tiến","en":"Look-ahead bias and forward testing"},"p":{"vi":"Lỗi nhìn trước tương lai là dùng thông tin mà tại thời điểm ra quyết định bạn chưa thể có: dùng giá đóng cửa của nến chưa đóng, dùng đỉnh đáy chỉ xác định được sau này, hoặc đơn giản là lướt biểu đồ đã thấy hết phần bên phải. Mắt người khi nhìn lại quá khứ tự động chọn những tín hiệu đẹp, nên kiểm định bằng cách cuộn biểu đồ luôn lạc quan quá mức. Cách khắc phục cho người giao dịch tay là kiểm định tiến bằng replay: che tương lai, tiến từng nến, ra quyết định như thật. Sau đó giao dịch thật với khối lượng nhỏ nhất vài chục lệnh trước khi tăng dần.","en":"Look-ahead bias means using information you could not have had at the moment of decision: the close of a candle that has not closed, a swing high or low identifiable only later, or simply scanning a chart with the right-hand side already visible. The human eye looking backward automatically picks the pretty signals, so testing by scrolling a chart is always too optimistic. The remedy for a discretionary trader is forward testing by replay: hide the future, advance one candle at a time, and decide as if it were live. After that, trade real money at minimum size for a few dozen trades before scaling up."}}],"example":{"vi":"Một người kiểm định quy tắc mua khi giá đóng cửa vượt đỉnh 20 phiên trên một hợp đồng tương lai. Trên biểu đồ nhìn lại, 100 lệnh cho tỷ lệ thắng 45 phần trăm, lãi trung bình 2R, lỗ trung bình 1R: kỳ vọng bằng 0,45 nhân 2 trừ 0,55 nhân 1 bằng dương 0,35R mỗi lệnh. Sau đó sửa ba điểm. Khớp ở giá mở cửa nến sau thay vì giá đóng cửa nến tín hiệu: lãi trung bình còn 1,8R. Trừ phí và trượt giá khứ hồi bằng 0,15R mỗi lệnh. Kiểm lại bằng replay có che tương lai, tỷ lệ thắng thực tế còn 40 phần trăm vì trước đó đã vô thức bỏ qua tín hiệu xấu. Kỳ vọng mới: 0,40 nhân 1,8 trừ 0,60 nhân 1 trừ 0,15 bằng âm 0,03R. Một hệ thống trông rất tốt hóa ra hòa vốn.","en":"A trader tests the rule of buying when price closes above the 20-day high on a futures contract. Scrolling back through the chart, 100 trades show a 45 percent win rate, an average win of 2R and an average loss of 1R: expectancy is 0.45 times 2 minus 0.55 times 1, or plus 0.35R per trade. Then three corrections are made. Fills are moved to the next candle's open instead of the signal candle's close: the average win drops to 1.8R. Round-trip commission and slippage of 0.15R per trade are deducted. Retested in replay with the future hidden, the real win rate is 40 percent, because bad signals had been skipped unconsciously. New expectancy: 0.40 times 1.8 minus 0.60 times 1 minus 0.15, or minus 0.03R. A system that looked excellent turns out to be break-even."},"story":{"title":{"vi":"Bơ ở Bangladesh và chỉ số S&P 500","en":"Butter in Bangladesh and the S&P 500"},"text":{"vi":"Vào thập niên 1990, nhà nghiên cứu định lượng David Leinweber muốn cho đồng nghiệp thấy việc đào bới dữ liệu có thể lừa người ta dễ đến mức nào. Ông lục một kho số liệu của Liên Hợp Quốc để tìm chuỗi nào khớp nhất với chỉ số S&P 500 trong khoảng một thập kỷ. Kẻ thắng cuộc là sản lượng bơ hằng năm của Bangladesh: riêng nó giải thích được khoảng 75 phần trăm biến động của chỉ số. Thêm sản lượng bơ và pho mát của Mỹ, con số lên khoảng 95 phần trăm. Thêm tổng đàn cừu của Bangladesh và Mỹ, mô hình đạt khoảng 99 phần trăm. Một mô hình gần như hoàn hảo, và hoàn toàn vô nghĩa: không có lý do nào để bơ ở Dhaka điều khiển phố Wall, và ngoài giai đoạn đã chọn mối quan hệ đó biến mất. Leinweber kể rằng nhiều năm sau vẫn có người gọi điện hỏi ông số liệu bơ mới nhất. Bài học: nếu bạn thử đủ nhiều thứ, thế nào cũng có thứ khớp với quá khứ. Một kết quả kiểm định chỉ đáng tin khi có lý do hợp lý đứng sau và khi nó còn đứng vững trên dữ liệu mà bạn chưa từng nhìn tới.","en":"In the 1990s the quantitative researcher David Leinweber wanted to show colleagues how easily data mining can fool people. He searched a United Nations database for the series that best matched the S&P 500 over roughly a decade. The winner was annual butter production in Bangladesh: by itself it explained about 75 percent of the index's variation. Adding US butter and cheese production raised the figure to about 95 percent. Adding the total sheep population of Bangladesh and the United States brought the model to about 99 percent. A nearly perfect model, and completely meaningless: there is no reason for butter in Dhaka to drive Wall Street, and outside the chosen period the relationship vanished. Leinweber has said that years later people still phoned him asking for the latest butter numbers. The lesson: try enough things and something will always fit the past. A test result deserves trust only when a sensible reason stands behind it and when it still holds on data you have never looked at."}},"mistakes":{"vi":["Kết luận từ 10 đến 20 lệnh, hoặc từ một giai đoạn thị trường chỉ đi một chiều.","Thêm bộ lọc sau mỗi lệnh thua trong dữ liệu cũ cho đến khi đường vốn đẹp hoàn hảo.","Bỏ qua phí, chênh lệch mua bán và trượt giá, hoặc giả định luôn khớp đúng giá mình muốn.","Xem kết quả ngoài mẫu nhiều lần rồi chỉnh quy tắc, biến dữ liệu kiểm tra thành dữ liệu huấn luyện."],"en":["Drawing conclusions from 10 to 20 trades, or from a period when the market moved only one way.","Adding a filter after every losing trade in the old data until the equity curve looks perfect.","Ignoring commission, spread and slippage, or assuming you always get the price you wanted.","Checking out-of-sample results repeatedly and adjusting the rules, turning test data into training data."]},"practice":{"vi":"Viết quy tắc ra giấy, rồi dùng replay với tương lai bị che để kiểm định tiến: bắt đầu ở một ngày ngẫu nhiên, tiến từng nến, vào mọi tín hiệu thỏa quy tắc và không bỏ qua cái nào. Làm ít nhất 50 đến 100 lệnh trên nhiều mã và nhiều giai đoạn, xem bảng tổng kết phiên (đường vốn so với mua và giữ, sụt giảm lớn nhất), rồi xuất nhật ký CSV để tính kỳ vọng sau phí.","en":"Write your rules on paper, then forward test in replay with the future hidden: start on a random date, step one candle at a time, take every signal that meets the rules and skip none. Do at least 50 to 100 trades across several symbols and periods, review the session summary (equity curve versus buy-and-hold, maximum drawdown), then export the journal CSV and compute expectancy after costs."}}]},{"key":"fa","lessons":[{"id":"fa-statements","title":{"vi":"Đọc ba báo cáo tài chính","en":"Reading the three financial statements"},"summary":{"vi":"Báo cáo kết quả kinh doanh, bảng cân đối kế toán và báo cáo lưu chuyển tiền tệ là ba góc nhìn về cùng một doanh nghiệp. Đọc được cách chúng nối với nhau là nền của mọi phân tích cơ bản.","en":"The income statement, balance sheet and cash flow statement are three views of the same business. Knowing how they link together is the foundation of all fundamental analysis."},"points":[{"h":{"vi":"Báo cáo kết quả kinh doanh: lãi lỗ trong một kỳ","en":"Income statement: profit over a period"},"p":{"vi":"Báo cáo này đi từ trên xuống: doanh thu thuần trừ giá vốn hàng bán ra lợi nhuận gộp; trừ tiếp chi phí bán hàng và quản lý ra lợi nhuận hoạt động; cộng trừ thu nhập và chi phí tài chính, trừ thuế ra lợi nhuận sau thuế. Chia lợi nhuận sau thuế của cổ đông cho số cổ phiếu bình quân ra EPS. Điểm cần nhớ: báo cáo lập theo nguyên tắc dồn tích, tức ghi nhận doanh thu khi bán hàng chứ không phải khi thu tiền, nên lãi trên giấy chưa chắc là tiền trong két.","en":"This statement runs top to bottom: net revenue minus cost of goods sold gives gross profit; subtract selling and administrative expenses to get operating profit; add or subtract financial income and expenses, deduct tax, and you reach net income. Net income attributable to shareholders divided by the weighted average share count gives EPS. Remember that it is prepared on an accrual basis: revenue is booked when the sale happens, not when cash arrives, so paper profit is not necessarily money in the bank."}},{"h":{"vi":"Bảng cân đối kế toán: ảnh chụp tại một thời điểm","en":"Balance sheet: a snapshot at one date"},"p":{"vi":"Phương trình gốc là Tài sản bằng Nợ phải trả cộng Vốn chủ sở hữu. Tài sản chia thành ngắn hạn (tiền, phải thu, hàng tồn kho) và dài hạn (nhà xưởng, máy móc, đầu tư dài hạn, lợi thế thương mại). Nguồn vốn cho biết ai tài trợ số tài sản đó: chủ nợ hay cổ đông. Vì là ảnh chụp cuối kỳ nên bảng này có thể được làm đẹp đúng ngày chốt sổ; hãy so nhiều kỳ liên tiếp và đọc thuyết minh để xem từng khoản mục thật sự gồm những gì.","en":"The core equation is Assets equal Liabilities plus Shareholders' Equity. Assets are split into current (cash, receivables, inventory) and non-current (plant, equipment, long-term investments, goodwill). The other side shows who financed those assets: creditors or owners. Because it is a snapshot taken on the closing date, it can be dressed up for that one day; compare several consecutive periods and read the notes to see what each line really contains."}},{"h":{"vi":"Báo cáo lưu chuyển tiền tệ: tiền thật đi đâu","en":"Cash flow statement: where the money actually went"},"p":{"vi":"Báo cáo chia dòng tiền thành ba phần. Dòng tiền từ hoạt động kinh doanh (CFO) là tiền thu chi từ việc bán hàng hằng ngày. Dòng tiền đầu tư (CFI) chủ yếu là chi mua tài sản cố định (capex) và các khoản đầu tư. Dòng tiền tài chính (CFF) là vay và trả nợ, phát hành cổ phiếu, trả cổ tức. Tổng ba phần bằng thay đổi tiền mặt trong kỳ. Dòng tiền tự do thường tính đơn giản là CFO trừ capex: phần tiền còn lại sau khi duy trì và mở rộng kinh doanh.","en":"The statement sorts cash into three buckets. Cash flow from operations (CFO) is cash collected and paid in day-to-day business. Cash flow from investing (CFI) is mostly capital expenditure (capex) and investments. Cash flow from financing (CFF) covers borrowing and repaying debt, issuing shares and paying dividends. The three add up to the change in cash for the period. Free cash flow is commonly simplified as CFO minus capex: the cash left after maintaining and expanding the business."}},{"h":{"vi":"Ba báo cáo nối với nhau thế nào","en":"How the three statements connect"},"p":{"vi":"Lợi nhuận sau thuế ở báo cáo kết quả kinh doanh là dòng đầu tiên của dòng tiền hoạt động theo phương pháp gián tiếp; sau đó cộng lại khấu hao (chi phí không chi tiền) và điều chỉnh thay đổi vốn lưu động: phải thu và tồn kho tăng thì trừ tiền, phải trả tăng thì cộng tiền. Lợi nhuận sau khi trừ cổ tức chảy vào lợi nhuận giữ lại trong vốn chủ sở hữu. Capex làm tăng tài sản cố định, khấu hao làm giảm. Số tiền cuối kỳ của báo cáo lưu chuyển tiền tệ phải khớp với khoản tiền trên bảng cân đối.","en":"Net income from the income statement is the first line of operating cash flow under the indirect method; depreciation (a non-cash expense) is added back and changes in working capital are adjusted: rising receivables and inventory consume cash, rising payables release it. Net income minus dividends flows into retained earnings within equity. Capex increases fixed assets and depreciation reduces them. The ending cash figure on the cash flow statement must match the cash line on the balance sheet."}},{"h":{"vi":"Trình tự đọc thực tế","en":"A practical reading order"},"p":{"vi":"Bắt đầu bằng ý kiến kiểm toán: chấp nhận toàn phần, ngoại trừ, trái ngược hay từ chối đưa ra ý kiến. Sau đó so doanh thu và lợi nhuận với cùng kỳ năm trước chứ không chỉ quý liền trước, vì nhiều ngành có mùa vụ. Tiếp theo đặt lợi nhuận cạnh dòng tiền hoạt động trong ba đến năm năm. Cuối cùng đọc thuyết minh về phải thu, tồn kho, vay nợ, giao dịch với bên liên quan và các khoản lợi nhuận bất thường như bán tài sản hay đánh giá lại khoản đầu tư. Báo cáo hợp nhất mới phản ánh cả tập đoàn.","en":"Start with the auditor's opinion: unqualified, qualified, adverse or disclaimer. Then compare revenue and profit with the same period a year ago, not just the previous quarter, because many industries are seasonal. Next put net income beside operating cash flow over three to five years. Finally read the notes on receivables, inventory, borrowings, related-party transactions and one-off gains such as asset sales or revaluations. Only the consolidated statements describe the whole group."}}],"example":{"vi":"Một công ty có doanh thu 1.000 tỷ đồng, giá vốn 600, chi phí bán hàng và quản lý 250: lợi nhuận hoạt động 150. Trừ lãi vay 20 còn 130 trước thuế, thuế 20% là 26, lợi nhuận sau thuế 104. Sang dòng tiền: 104 cộng khấu hao 40, trừ vốn lưu động tăng 60, CFO còn 84. Công ty chi capex 70, nên dòng tiền tự do chỉ 14. Trả cổ tức 30, vay thêm 20, vậy tiền cuối năm chỉ tăng 84 trừ 70 trừ 30 cộng 20 bằng 4 tỷ. Trên bảng cân đối, vốn chủ tăng 104 trừ 30 bằng 74 tỷ. Lãi 104 nhưng tiền chỉ thêm 4: cả ba báo cáo cùng kể câu chuyện đó.","en":"A company has revenue of 1,000, cost of goods sold of 600 and selling and admin expenses of 250: operating profit is 150. After interest of 20, pre-tax profit is 130; tax at 20% is 26, so net income is 104. On the cash flow statement: 104 plus depreciation of 40, minus a 60 increase in working capital, gives CFO of 84. Capex is 70, so free cash flow is only 14. It pays dividends of 30 and borrows 20, so cash rises by 84 minus 70 minus 30 plus 20, which is 4. On the balance sheet, equity grows by 104 minus 30, or 74. Profit of 104 but only 4 more cash: all three statements tell that same story."},"story":{"title":{"vi":"WorldCom: chi phí biến thành tài sản","en":"WorldCom: expenses that became assets"},"text":{"vi":"Năm 2002, WorldCom là một trong những hãng viễn thông lớn nhất nước Mỹ. Bộ phận kiểm toán nội bộ do bà Cynthia Cooper dẫn dắt nhận thấy những bút toán lạ: chi phí thuê đường truyền, vốn là chi phí hoạt động thường xuyên, bị ghi thành tài sản cố định. Cách ghi này khiến chi phí biến khỏi báo cáo kết quả kinh doanh, lợi nhuận đẹp lên, còn khoản chi thì nằm trên bảng cân đối như một khoản đầu tư. Ngày 25 tháng 6 năm 2002, công ty công bố đã vốn hóa sai khoảng 3,8 tỷ đô la; con số gian lận kế toán sau đó được xác định vào khoảng 11 tỷ đô la. Tháng 7 năm 2002 WorldCom nộp đơn phá sản, lớn nhất nước Mỹ tính đến lúc đó. Nhìn lại, dấu vết vẫn nằm trong báo cáo: chi phí bị vốn hóa làm capex phình to, nên dòng tiền tự do yếu hơn nhiều so với lợi nhuận công bố. Bài học là không báo cáo nào đọc riêng lẻ được; khi lợi nhuận đẹp, hãy hỏi cái giá của nó đang nằm ở dòng nào của hai báo cáo còn lại.","en":"In 2002 WorldCom was one of the largest telecom companies in the United States. Its internal audit team, led by Cynthia Cooper, noticed odd entries: line costs, which are ordinary operating expenses, were being recorded as fixed assets. That treatment removed the expense from the income statement, flattered profit, and parked the spending on the balance sheet as if it were an investment. On 25 June 2002 the company disclosed that about 3.8 billion dollars had been improperly capitalized; the accounting fraud was later put at roughly 11 billion dollars. In July 2002 WorldCom filed for bankruptcy, the largest in US history up to that time. In hindsight the traces were in the statements: capitalized costs swelled capex, so free cash flow was far weaker than reported profit. The lesson is that no statement can be read alone; when profit looks good, ask on which line of the other two statements its cost is sitting."}},"mistakes":{"vi":["Chỉ nhìn lợi nhuận sau thuế và EPS mà bỏ qua dòng tiền hoạt động.","So sánh quý này với quý trước ở ngành có tính mùa vụ thay vì so với cùng kỳ năm trước.","Không đọc thuyết minh và ý kiến kiểm toán, nơi thường chứa thông tin quan trọng nhất.","Coi lợi nhuận bất thường từ bán tài sản hay đánh giá lại là lợi nhuận lặp lại hằng năm."],"en":["Looking only at net income and EPS while ignoring operating cash flow.","Comparing this quarter with the previous one in a seasonal business instead of with the same quarter last year.","Skipping the notes and the auditor's opinion, where the most important information often sits.","Treating one-off gains from asset sales or revaluations as profit that will repeat every year."]},"practice":{"vi":"Vào chế độ Cổ phiếu, chọn một mã như FPT hay HPG trên khung ngày hoặc tuần, tua từng nến qua một năm và ghi vào nhật ký giao dịch mỗi lần bạn mua bán kèm lý do. Sau phiên, tra báo cáo tài chính của các quý tương ứng và đối chiếu: giá đã phản ứng thế nào quanh thời điểm công bố kết quả.","en":"In Stocks mode pick a symbol such as FPT or HPG on the daily or weekly timeframe, step candle by candle through a year and log each trade with its reason in the trade journal. After the session, look up the financial statements for those quarters and compare how price behaved around each results date."}},{"id":"fa-profit","title":{"vi":"Khả năng sinh lời và hiệu quả sử dụng vốn","en":"Profitability and efficiency"},"summary":{"vi":"Biên lợi nhuận cho biết doanh nghiệp giữ lại được bao nhiêu từ mỗi đồng doanh thu; ROE, ROA, ROIC cho biết mỗi đồng vốn tạo ra bao nhiêu lợi nhuận. Phân tích DuPont chỉ ra con số đó đến từ đâu.","en":"Margins show how much of each unit of revenue a company keeps; ROE, ROA and ROIC show how much profit each unit of capital produces. DuPont analysis reveals where that return comes from."},"points":[{"h":{"vi":"Ba tầng biên lợi nhuận","en":"Three layers of margin"},"p":{"vi":"Biên lợi nhuận gộp bằng lợi nhuận gộp chia doanh thu, phản ánh sức mạnh định giá và chi phí sản xuất. Biên lợi nhuận hoạt động bằng lợi nhuận hoạt động chia doanh thu, cho thấy hiệu quả sau khi tính cả chi phí bán hàng và quản lý. Biên lợi nhuận ròng bằng lợi nhuận sau thuế chia doanh thu, chịu thêm ảnh hưởng của lãi vay, thuế và các khoản bất thường. Biên chỉ có nghĩa khi so trong cùng ngành: siêu thị sống tốt với biên ròng vài phần trăm, phần mềm có thể trên hai mươi phần trăm.","en":"Gross margin is gross profit divided by revenue and reflects pricing power and production cost. Operating margin is operating profit divided by revenue and shows efficiency after selling and administrative costs. Net margin is net income divided by revenue and is also affected by interest, tax and one-off items. Margins only mean something within the same industry: a supermarket can thrive on a net margin of a few percent, while software can exceed twenty percent."}},{"h":{"vi":"ROE và ROA","en":"ROE and ROA"},"p":{"vi":"ROE bằng lợi nhuận sau thuế chia vốn chủ sở hữu bình quân: mỗi đồng vốn của cổ đông sinh ra bao nhiêu lợi nhuận trong năm. ROA bằng lợi nhuận sau thuế chia tổng tài sản bình quân: hiệu quả của toàn bộ tài sản, không phân biệt nguồn tài trợ. ROE cao hơn ROA nhiều lần nghĩa là doanh nghiệp dùng đòn bẩy lớn. Nhiều nhà đầu tư coi ROE duy trì trên khoảng 15% qua nhiều năm là tốt, nhưng đó chỉ là mốc tham khảo; ngân hàng có ROA khoảng 1 đến 2% vẫn là bình thường.","en":"ROE is net income divided by average shareholders' equity: how much profit each unit of owners' capital earned in the year. ROA is net income divided by average total assets: the efficiency of all assets regardless of how they were financed. An ROE many times higher than ROA means heavy leverage. Many investors regard an ROE sustained above about 15% for years as good, but that is only a rule of thumb; a bank with an ROA of around 1 to 2% is perfectly normal."}},{"h":{"vi":"ROIC: thước đo ít bị đòn bẩy bóp méo","en":"ROIC: a measure leverage distorts less"},"p":{"vi":"ROIC bằng lợi nhuận hoạt động sau thuế (NOPAT, tức EBIT nhân với một trừ thuế suất) chia cho vốn đầu tư, thường tính bằng vốn chủ cộng nợ vay trừ tiền mặt dư thừa. Vì tử số chưa trừ lãi vay và mẫu số gồm cả nợ lẫn vốn chủ, ROIC không tăng lên chỉ vì vay nhiều hơn. So ROIC với chi phí vốn bình quân (WACC): ROIC cao hơn chi phí vốn thì tăng trưởng tạo ra giá trị, thấp hơn thì càng lớn càng phá hủy giá trị.","en":"ROIC is net operating profit after tax (NOPAT, that is EBIT times one minus the tax rate) divided by invested capital, usually equity plus interest-bearing debt minus excess cash. Because the numerator is before interest and the denominator includes both debt and equity, ROIC does not rise simply because a company borrows more. Compare ROIC with the weighted average cost of capital (WACC): above it, growth creates value; below it, growing bigger destroys value."}},{"h":{"vi":"Phân tích DuPont","en":"DuPont decomposition"},"p":{"vi":"Công thức ba nhân tố: ROE bằng biên lợi nhuận ròng nhân vòng quay tài sản nhân đòn bẩy tài chính, trong đó vòng quay tài sản là doanh thu chia tổng tài sản và đòn bẩy là tổng tài sản chia vốn chủ sở hữu. Ba công ty cùng ROE 20% có thể rất khác nhau: một bên nhờ biên cao, một bên nhờ quay vòng nhanh, bên thứ ba nhờ vay nợ. ROE đến từ biên và vòng quay thường bền hơn ROE đến từ đòn bẩy, vì đòn bẩy khuếch đại cả lỗ khi kinh doanh xấu đi.","en":"The three-factor formula: ROE equals net margin times asset turnover times financial leverage, where asset turnover is revenue divided by total assets and leverage is total assets divided by equity. Three companies with the same 20% ROE can be very different: one earns it through high margins, another through fast turnover, a third through debt. ROE built on margin and turnover is usually more durable than ROE built on leverage, because leverage magnifies losses too when business turns down."}},{"h":{"vi":"Hiệu quả hoạt động và xu hướng","en":"Operating efficiency and trend"},"p":{"vi":"Các chỉ số vòng quay bổ sung cho bức tranh: vòng quay hàng tồn kho bằng giá vốn chia tồn kho bình quân, số ngày thu tiền bằng phải thu bình quân chia doanh thu nhân 365. Chu kỳ tiền mặt bằng số ngày tồn kho cộng số ngày phải thu trừ số ngày phải trả; càng ngắn thì càng ít vốn bị chôn. Quan trọng hơn một con số đơn lẻ là xu hướng năm đến mười năm và so với đối thủ cùng ngành. Biên và ROE cao bất thường ở đỉnh chu kỳ hàng hóa thường quay về mức trung bình.","en":"Turnover ratios complete the picture: inventory turnover is cost of goods sold divided by average inventory; days sales outstanding is average receivables divided by revenue times 365. The cash conversion cycle is inventory days plus receivable days minus payable days; the shorter it is, the less capital is tied up. More important than any single number is the five-to-ten-year trend and the comparison with industry peers. Unusually high margins and ROE at the top of a commodity cycle tend to revert to the mean."}}],"example":{"vi":"Công ty X có doanh thu 2.000 tỷ đồng, lợi nhuận sau thuế 160, tổng tài sản 1.600, vốn chủ 800, nợ vay 500, tiền dư thừa 100, EBIT 240, thuế suất 20%. Biên ròng là 160 chia 2.000 bằng 8%. Vòng quay tài sản là 2.000 chia 1.600 bằng 1,25 lần. Đòn bẩy là 1.600 chia 800 bằng 2 lần. DuPont: 8% nhân 1,25 nhân 2 bằng ROE 20%, khớp với 160 chia 800. ROA là 160 chia 1.600 bằng 10%. NOPAT là 240 nhân 0,8 bằng 192; vốn đầu tư là 800 cộng 500 trừ 100 bằng 1.200; ROIC bằng 16%. Nếu chi phí vốn khoảng 11%, công ty đang tạo giá trị trên mỗi đồng tái đầu tư.","en":"Company X has revenue of 2,000, net income of 160, total assets of 1,600, equity of 800, debt of 500, excess cash of 100, EBIT of 240 and a 20% tax rate. Net margin is 160 divided by 2,000, or 8%. Asset turnover is 2,000 divided by 1,600, or 1.25 times. Leverage is 1,600 divided by 800, or 2 times. DuPont: 8% times 1.25 times 2 gives an ROE of 20%, matching 160 divided by 800. ROA is 160 divided by 1,600, or 10%. NOPAT is 240 times 0.8, or 192; invested capital is 800 plus 500 minus 100, or 1,200; ROIC is 16%. If the cost of capital is about 11%, the company creates value on every unit it reinvests."},"story":{"title":{"vi":"Hai công ty cùng ROE 24%","en":"Two companies, both with 24% ROE"},"text":{"vi":"Lan, một nhà đầu tư mới (ví dụ minh họa), lọc cổ phiếu theo ROE và tìm được hai công ty cùng đạt 24%. Cô định chia đều tiền cho cả hai thì một người bạn bảo cô tách ROE theo DuPont. Công ty thứ nhất bán hàng tiêu dùng: biên ròng 12%, vòng quay tài sản 1,25 lần, đòn bẩy 1,6 lần. Công ty thứ hai là nhà phát triển bất động sản: biên ròng 15%, vòng quay chỉ 0,2 lần, đòn bẩy 8 lần. Cùng một con số nhưng công ty thứ hai cần tám đồng tài sản cho mỗi đồng vốn chủ, phần lớn là vay và tiền khách trả trước. Hai năm sau lãi suất tăng, thị trường nhà đóng băng; công ty bất động sản lỗ vì lãi vay, ROE âm, cổ phiếu mất hơn nửa giá. Công ty hàng tiêu dùng vẫn giữ ROE quanh 22%. Lan rút ra: ROE là câu trả lời, DuPont mới là câu hỏi. Con số giống nhau có thể che hai mức rủi ro hoàn toàn khác nhau.","en":"Lan, a new investor (an illustration), screened stocks by ROE and found two companies that both earned 24%. She was about to split her money evenly when a friend told her to break ROE down the DuPont way. The first sold consumer goods: net margin 12%, asset turnover 1.25 times, leverage 1.6 times. The second was a property developer: net margin 15%, turnover only 0.2 times, leverage 8 times. The headline was identical, but the second needed eight units of assets for each unit of equity, mostly borrowings and customer prepayments. Two years later interest rates rose and the housing market froze; the developer lost money on interest costs, its ROE turned negative and the stock lost more than half its value. The consumer company still earned about 22%. Lan's conclusion: ROE is the answer, DuPont is the question. The same number can hide two completely different levels of risk."}},"mistakes":{"vi":["Chọn cổ phiếu chỉ vì ROE cao mà không kiểm tra ROE đó đến từ đòn bẩy hay từ kinh doanh.","So biên lợi nhuận giữa các ngành khác nhau như bán lẻ với phần mềm.","Lấy ROE của một năm đỉnh chu kỳ rồi coi đó là mức bình thường.","Quên rằng mua lại cổ phiếu hay lỗ lũy kế làm vốn chủ nhỏ đi và đẩy ROE lên một cách cơ học."],"en":["Picking a stock for its high ROE without checking whether it comes from leverage or from the business.","Comparing margins across different industries, such as retail against software.","Taking ROE from one peak-cycle year and treating it as normal.","Forgetting that buybacks or accumulated losses shrink equity and mechanically push ROE up."]},"practice":{"vi":"Lập một rổ trong chế độ Cổ phiếu gồm hai mã cùng ngành mà bạn đã tính DuPont trước, ví dụ một doanh nghiệp biên cao và một doanh nghiệp đòn bẩy cao. Tua khung tuần qua một giai đoạn lãi suất tăng rồi xem phần tổng kết theo từng mã và mức sụt giảm của từng cổ phiếu.","en":"Build a Stocks-mode basket with two names from the same industry that you have already run through DuPont, for example a high-margin business and a highly leveraged one. Replay the weekly timeframe through a period of rising rates, then check the per-symbol breakdown and drawdown
