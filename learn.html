 in the session summary."}},{"id":"fa-valuation","title":{"vi":"Định giá tương đối: P/E, P/B, EV/EBITDA và bẫy giá trị","en":"Relative valuation: P/E, P/B, EV/EBITDA and value traps"},"summary":{"vi":"Định giá tương đối so giá cổ phiếu với lợi nhuận, giá trị sổ sách hay dòng tiền, rồi so tiếp với lịch sử và với doanh nghiệp cùng ngành. Nhanh và phổ biến, nhưng rẻ chưa chắc là hời.","en":"Relative valuation compares a share price with earnings, book value or cash flow, and then with history and peers. It is quick and widely used, but cheap is not the same as a bargain."},"points":[{"h":{"vi":"P/E và P/E dự phóng","en":"P/E and forward P/E"},"p":{"vi":"P/E bằng giá cổ phiếu chia EPS. P/E trượt (trailing) dùng EPS bốn quý gần nhất; P/E dự phóng (forward) dùng EPS ước tính của mười hai tháng tới. P/E 12 nghĩa là nhà đầu tư trả 12 đồng cho mỗi đồng lợi nhuận hằng năm; nghịch đảo của nó, khoảng 8,3%, gọi là tỷ suất lợi nhuận trên giá. P/E vô nghĩa khi công ty lỗ và dễ gây hiểu lầm khi lợi nhuận có khoản bất thường. P/E dự phóng phụ thuộc vào dự báo, mà dự báo của giới phân tích thường lạc quan.","en":"P/E is share price divided by EPS. Trailing P/E uses the last four quarters of EPS; forward P/E uses estimated EPS for the next twelve months. A P/E of 12 means investors pay 12 for each unit of annual earnings; its inverse, about 8.3%, is called the earnings yield. P/E is meaningless when a company loses money and misleading when earnings contain one-off items. Forward P/E depends on forecasts, and analyst forecasts tend to be optimistic."}},{"h":{"vi":"P/B và khi nào dùng","en":"P/B and when it fits"},"p":{"vi":"P/B bằng giá chia giá trị sổ sách mỗi cổ phiếu, tức vốn chủ sở hữu chia số cổ phiếu. Chỉ số này hợp với ngành mà tài sản trên sổ gần với giá trị thật: ngân hàng, bảo hiểm, chứng khoán, và doanh nghiệp nặng tài sản. P/B luôn phải đọc cùng ROE: ngân hàng có ROE 20% xứng đáng P/B cao hơn ngân hàng ROE 8%. Với công ty công nghệ hay thương hiệu, tài sản quý nhất không nằm trên bảng cân đối nên P/B cao không nói lên điều gì.","en":"P/B is price divided by book value per share, that is equity divided by shares outstanding. It suits industries where book assets are close to real value: banks, insurers, brokers and asset-heavy companies. P/B must always be read together with ROE: a bank earning 20% on equity deserves a higher P/B than one earning 8%. For technology or brand companies the most valuable assets are not on the balance sheet, so a high P/B says little."}},{"h":{"vi":"EV/EBITDA","en":"EV/EBITDA"},"p":{"vi":"Giá trị doanh nghiệp (EV) bằng vốn hóa cộng nợ vay trừ tiền mặt và tương đương tiền, có thể cộng thêm lợi ích cổ đông thiểu số. EBITDA là lợi nhuận trước lãi vay, thuế và khấu hao. EV/EBITDA so được các công ty có cơ cấu nợ khác nhau, vì cả tử và mẫu đều tính cho toàn bộ người cấp vốn. Hạn chế: EBITDA bỏ qua capex, nên ngành cần đầu tư nặng như thép, hàng không, viễn thông trông rẻ hơn thực tế. Chỉ số này không dùng cho ngân hàng.","en":"Enterprise value (EV) is market capitalization plus debt minus cash and equivalents, sometimes plus minority interests. EBITDA is earnings before interest, tax, depreciation and amortization. EV/EBITDA allows comparison of companies with different debt levels because numerator and denominator both relate to all capital providers. Its weakness: EBITDA ignores capex, so capital-hungry industries such as steel, airlines and telecoms look cheaper than they are. It is not used for banks."}},{"h":{"vi":"PEG và tỷ suất cổ tức","en":"PEG and dividend yield"},"p":{"vi":"PEG bằng P/E chia tốc độ tăng trưởng EPS kỳ vọng hằng năm tính theo phần trăm; P/E 15 với tăng trưởng 15% cho PEG bằng 1. Peter Lynch phổ biến quy tắc kinh nghiệm rằng PEG dưới 1 là hấp dẫn, nhưng nó phụ thuộc hoàn toàn vào dự báo tăng trưởng và bỏ qua rủi ro. Tỷ suất cổ tức bằng cổ tức tiền mặt mỗi cổ phiếu chia giá. Tỷ suất rất cao có thể do giá vừa sụp vì thị trường nghi cổ tức sắp bị cắt; hãy kiểm tra tỷ lệ chi trả so với lợi nhuận và dòng tiền tự do.","en":"PEG is P/E divided by the expected annual EPS growth rate in percent; a P/E of 15 with 15% growth gives a PEG of 1. Peter Lynch popularized the rule of thumb that a PEG below 1 is attractive, but it depends entirely on the growth forecast and ignores risk. Dividend yield is cash dividend per share divided by price. A very high yield may exist because the price has just collapsed on fears the dividend will be cut; check the payout ratio against earnings and free cash flow."}},{"h":{"vi":"So sánh với cái gì, và bẫy giá trị","en":"Compared with what, and value traps"},"p":{"vi":"Một bội số chỉ có nghĩa khi đặt cạnh mốc so sánh: trung bình năm đến mười năm của chính cổ phiếu, trung vị của ngành, và mặt bằng lãi suất. Bẫy giá trị là cổ phiếu trông rẻ theo mọi bội số nhưng rẻ có lý do: ngành suy thoái dài hạn, lợi nhuận đang ở đỉnh chu kỳ, nợ quá lớn hoặc ban lãnh đạo phân bổ vốn kém. Với cổ phiếu chu kỳ, P/E thấp nhất thường xuất hiện ngay trước khi lợi nhuận lao dốc. Hãy hỏi: lợi nhuận này có lặp lại trong năm năm tới không.","en":"A multiple only has meaning against a benchmark: the stock's own five-to-ten-year average, the industry median and the level of interest rates. A value trap is a stock that looks cheap on every multiple but is cheap for a reason: long-term industry decline, earnings at a cyclical peak, too much debt or poor capital allocation by management. With cyclical stocks, the lowest P/E often appears just before earnings collapse. Ask: will these earnings still be here in five years."}}],"example":{"vi":"Cổ phiếu Y giá 60.000 đồng, có 100 triệu cổ phiếu nên vốn hóa 6.000 tỷ đồng. EPS bốn quý gần nhất là 5.000 đồng: P/E trượt bằng 12. EPS dự phóng 6.000 đồng: P/E dự phóng bằng 10. Tăng trưởng EPS kỳ vọng 20% một năm: PEG bằng 12 chia 20, tức 0,6. Giá trị sổ sách 30.000 đồng mỗi cổ phiếu: P/B bằng 2; với ROE khoảng 17% thì mức này hợp lý. Cổ tức 3.000 đồng: tỷ suất 5%. Công ty nợ vay 2.000 tỷ, tiền mặt 500 tỷ, nên EV là 7.500 tỷ; EBITDA 1.250 tỷ cho EV/EBITDA bằng 6. Nếu trung vị ngành là P/E 14 và EV/EBITDA 8, cổ phiếu đang rẻ hơn ngành; việc tiếp theo là tìm lý do.","en":"Stock Y trades at 60 with 100 million shares, so market cap is 6,000 million. Trailing EPS is 5: trailing P/E is 12. Forward EPS is 6: forward P/E is 10. Expected EPS growth is 20% a year: PEG is 12 divided by 20, or 0.6. Book value is 30 per share: P/B is 2, which is reasonable for an ROE of about 17%. The dividend is 3: yield is 5%. The company has debt of 2,000 million and cash of 500 million, so EV is 7,500 million; EBITDA of 1,250 million gives EV/EBITDA of 6. If the industry median is a P/E of 14 and EV/EBITDA of 8, the stock is cheaper than its peers; the next job is to find out why."},"story":{"title":{"vi":"Kodak: rẻ suốt đường đi xuống","en":"Kodak: cheap all the way down"},"text":{"vi":"Eastman Kodak từng là biểu tượng của ngành phim ảnh, với biên lợi nhuận rất cao từ phim cuộn và hóa chất tráng rửa. Năm 1975, kỹ sư Steve Sasson của chính Kodak chế tạo chiếc máy ảnh kỹ thuật số đầu tiên, nhưng công ty vẫn dựa vào phim vì đó là nguồn lợi nhuận chính. Sang những năm 2000, khi máy ảnh số rồi điện thoại thay thế phim, cổ phiếu Kodak nhiều lần trông hấp dẫn: P/E thấp, cổ tức cao, thương hiệu nổi tiếng toàn cầu. Những người mua vì thấy rẻ đã mua một dòng lợi nhuận đang teo dần mỗi năm. Doanh thu phim sụt nhanh hơn mọi nỗ lực chuyển đổi, cổ tức bị cắt, và tháng 1 năm 2012 Kodak nộp đơn xin bảo hộ phá sản. Bội số trượt được tính trên lợi nhuận của quá khứ, còn giá cổ phiếu phụ thuộc vào lợi nhuận của tương lai. Bài học: trước khi vui vì P/E thấp, hãy kiểm tra xem mẫu số có còn tồn tại sau vài năm nữa hay không.","en":"Eastman Kodak was once the icon of photography, earning very high margins on film and processing chemicals. In 1975 Kodak's own engineer Steve Sasson built the first digital camera, yet the company kept leaning on film because that was where the profit came from. In the 2000s, as digital cameras and then phones replaced film, Kodak shares looked attractive again and again: a low P/E, a high dividend, a world-famous brand. Those who bought because it looked cheap were buying an earnings stream that shrank every year. Film revenue fell faster than any transition effort could offset, the dividend was cut, and in January 2012 Kodak filed for bankruptcy protection. Trailing multiples are calculated on past earnings, while the share price depends on future earnings. The lesson: before celebrating a low P/E, check whether the denominator will still exist a few years from now."}},"mistakes":{"vi":["Kết luận rẻ hay đắt chỉ từ một bội số mà không so với ngành, lịch sử và tăng trưởng.","Dùng P/E cho cổ phiếu chu kỳ ở đỉnh lợi nhuận, lúc P/E thấp nhất nhưng rủi ro cao nhất.","Dùng EV/EBITDA cho ngân hàng hoặc P/B cho công ty phần mềm.","Mua vì tỷ suất cổ tức cao mà không kiểm tra cổ tức có được dòng tiền tự do chống lưng hay không."],"en":["Calling a stock cheap or expensive from one multiple without comparing with peers, history and growth.","Using P/E on a cyclical stock at peak earnings, when the P/E is lowest and the risk highest.","Applying EV/EBITDA to banks or P/B to software companies.","Buying for a high dividend yield without checking that free cash flow covers the dividend."]},"practice":{"vi":"Trong chế độ Cổ phiếu, lập rổ gồm một mã bạn cho là rẻ và một mã bạn cho là đắt theo P/E tại ngày bắt đầu phiên, ghi lý do vào nhật ký. Tua khung tuần một đến hai năm rồi so đường vốn với mua-và-giữ và kết quả theo từng mã để xem nhận định định giá của bạn đúng đến đâu.","en":"In Stocks mode build a basket with one name you judge cheap and one you judge expensive on P/E at the session start date, and write the reasons in the journal. Replay one to two years on the weekly timeframe, then compare the equity curve with buy-and-hold and the per-symbol results to see how well your valuation call held up."}},{"id":"fa-dcf","title":{"vi":"Giá trị nội tại, DCF và biên an toàn","en":"Intrinsic value, DCF and margin of safety"},"summary":{"vi":"Giá trị nội tại của một doanh nghiệp là tổng dòng tiền nó tạo ra trong tương lai, quy về hôm nay. Mô hình DCF tính con số đó; biên an toàn bảo vệ bạn khi con số đó sai.","en":"A business's intrinsic value is the sum of the cash it will generate in the future, brought back to today. A DCF model calculates that figure; a margin of safety protects you when the figure is wrong."},"points":[{"h":{"vi":"Giá trị thời gian của tiền","en":"The time value of money"},"p":{"vi":"Một đồng hôm nay có giá trị hơn một đồng năm sau vì có thể đem đầu tư và vì tương lai không chắc chắn. Giá trị hiện tại của một khoản tiền nhận sau n năm bằng khoản tiền đó chia cho một cộng r mũ n, với r là tỷ suất chiết khấu. Ví dụ 110 đồng nhận sau một năm, chiết khấu 10%, đáng giá 100 đồng hôm nay. DCF (chiết khấu dòng tiền) chỉ là phép tính này lặp lại cho từng năm rồi cộng lại.","en":"A unit of money today is worth more than the same unit a year from now, because it can be invested and because the future is uncertain. The present value of an amount received in n years is that amount divided by one plus r to the power n, where r is the discount rate. For example, 110 received in one year, discounted at 10%, is worth 100 today. DCF (discounted cash flow) is simply this calculation repeated for each year and added up."}},{"h":{"vi":"Dòng tiền tự do","en":"Free cash flow"},"p":{"vi":"Thứ được chiết khấu là dòng tiền tự do, không phải lợi nhuận kế toán. Dòng tiền tự do của doanh nghiệp (FCFF) bằng EBIT nhân một trừ thuế suất, cộng khấu hao, trừ capex, trừ phần tăng vốn lưu động. Cách tính nhanh thường dùng là dòng tiền hoạt động trừ capex. Thông thường người ta dự phóng chi tiết năm đến mười năm, dựa trên giả định về tăng trưởng doanh thu, biên lợi nhuận và nhu cầu tái đầu tư. Doanh nghiệp tăng trưởng nhanh nhưng phải đổ hết tiền vào tài sản mới có thể có rất ít dòng tiền tự do.","en":"What gets discounted is free cash flow, not accounting profit. Free cash flow to the firm (FCFF) is EBIT times one minus the tax rate, plus depreciation, minus capex, minus the increase in working capital. A common shortcut is operating cash flow minus capex. Analysts usually forecast five to ten years in detail, based on assumptions about revenue growth, margins and reinvestment needs. A fast-growing company that must pour all its cash into new assets may have very little free cash flow."}},{"h":{"vi":"Tỷ suất chiết khấu","en":"The discount rate"},"p":{"vi":"Tỷ suất chiết khấu là mức sinh lời tối thiểu nhà đầu tư đòi hỏi cho rủi ro đã nhận. Với dòng tiền của cả doanh nghiệp, người ta dùng chi phí vốn bình quân gia quyền (WACC): chi phí vốn chủ và chi phí nợ sau thuế, tính theo tỷ trọng mỗi loại. Chi phí vốn chủ thường ước lượng bằng mô hình CAPM: lãi suất phi rủi ro cộng beta nhân phần bù rủi ro thị trường. Ở thị trường mới nổi như Việt Nam, tỷ suất chiết khấu thường cao hơn thị trường phát triển vì lãi suất và phần bù rủi ro cao hơn.","en":"The discount rate is the minimum return investors demand for the risk they take. For cash flows to the whole firm, the weighted average cost of capital (WACC) is used: the cost of equity and the after-tax cost of debt, weighted by their shares. The cost of equity is usually estimated with CAPM: the risk-free rate plus beta times the market risk premium. In emerging markets such as Vietnam, discount rates are generally higher than in developed markets because interest rates and risk premiums are higher."}},{"h":{"vi":"Giá trị cuối kỳ","en":"Terminal value"},"p":{"vi":"Doanh nghiệp không dừng lại sau năm dự phóng cuối, nên cần giá trị cuối kỳ. Công thức tăng trưởng đều (Gordon): dòng tiền năm kế tiếp chia cho hiệu của tỷ suất chiết khấu và tốc độ tăng trưởng dài hạn g. Mức g nên thận trọng, không vượt tăng trưởng danh nghĩa dài hạn của nền kinh tế. Giá trị cuối kỳ thường chiếm 60 đến 80% tổng giá trị, nghĩa là phần lớn kết quả nằm ở giả định xa nhất và khó kiểm chứng nhất. Cách thay thế là nhân EBITDA năm cuối với một bội số hợp lý.","en":"A business does not stop after the last forecast year, so a terminal value is needed. The constant-growth (Gordon) formula: next year's cash flow divided by the difference between the discount rate and the long-term growth rate g. Keep g conservative, no higher than the economy's long-run nominal growth. Terminal value typically makes up 60 to 80% of the total, which means most of the result rests on the most distant and least verifiable assumption. The alternative is to apply a sensible multiple to final-year EBITDA."}},{"h":{"vi":"Độ nhạy và biên an toàn","en":"Sensitivity and margin of safety"},"p":{"vi":"Thay đổi tỷ suất chiết khấu hay tăng trưởng dài hạn một hai điểm phần trăm có thể làm kết quả lệch 15 đến 40%. Vì vậy hãy lập bảng độ nhạy và ba kịch bản xấu, cơ sở, tốt, rồi coi kết quả là một khoảng giá trị chứ không phải một con số chính xác. Biên an toàn, khái niệm do Benjamin Graham đưa ra, là khoảng chênh giữa giá trị ước tính và giá mua: chỉ mua khi giá thấp hơn giá trị một khoảng đủ lớn, ví dụ 25 đến 40%, để sai số trong giả định không biến thành thua lỗ.","en":"Moving the discount rate or long-term growth by a point or two can shift the result by 15 to 40%. So build a sensitivity table and bear, base and bull scenarios, and treat the output as a range of values rather than a precise number. The margin of safety, a concept introduced by Benjamin Graham, is the gap between estimated value and purchase price: buy only when the price is far enough below value, for example 25 to 40%, that errors in your assumptions do not turn into losses."}}],"example":{"vi":"Một công ty dự kiến có dòng tiền tự do 100 tỷ đồng năm tới, tăng 8% mỗi năm trong năm năm: 100; 108; 116,6; 126,0; 136,0. Chiết khấu 12%, giá trị hiện tại lần lượt khoảng 89,3; 86,1; 83,0; 80,1; 77,2, tổng cộng 415,7. Giá trị cuối kỳ với g bằng 3% là 136,0 nhân 1,03 chia 0,09, khoảng 1.557; quy về hiện tại còn khoảng 883,5. Giá trị doanh nghiệp khoảng 1.299 tỷ, trong đó giá trị cuối kỳ chiếm 68%. Trừ nợ ròng 199 tỷ còn 1.100 tỷ; chia 100 triệu cổ phiếu ra 11.000 đồng mỗi cổ phiếu. Với biên an toàn 30%, giá mua tối đa là 7.700 đồng. Nếu chiết khấu 14% thay vì 12%, giá trị doanh nghiệp chỉ còn khoảng 1.056 tỷ, giảm gần 19%.","en":"A company is expected to produce free cash flow of 100 next year, growing 8% a year for five years: 100; 108; 116.6; 126.0; 136.0. Discounted at 12%, the present values are about 89.3; 86.1; 83.0; 80.1; 77.2, totalling 415.7. Terminal value with g of 3% is 136.0 times 1.03 divided by 0.09, about 1,557; discounted back it is about 883.5. Enterprise value is roughly 1,299, of which terminal value is 68%. Subtract net debt of 199 to get equity of 1,100; with 100 shares that is 11 per share. With a 30% margin of safety, the maximum purchase price is 7.7. If the discount rate were 14% instead of 12%, enterprise value would be only about 1,056, nearly 19% lower."},"story":{"title":{"vi":"Buffett và tờ Washington Post năm 1973","en":"Buffett and the Washington Post in 1973"},"text":{"vi":"Năm 1973, thị trường chứng khoán Mỹ lao dốc và cổ phiếu Washington Post Company bị bán mạnh. Warren Buffett, thông qua Berkshire Hathaway, đã chi khoảng 10,6 triệu đô la để mua cổ phần của công ty này. Theo lời ông kể lại trong thư gửi cổ đông sau này, khi đó cả công ty được thị trường định giá khoảng 80 triệu đô la, trong khi tờ báo, tạp chí Newsweek và các đài truyền hình của nó có thể bán được cho người mua tư nhân với giá khoảng 400 triệu đô la hoặc hơn. Ông không cần một mô hình chính xác đến từng xu; khoảng cách giữa giá và giá trị đủ rộng để những sai số lớn vẫn không gây hại. Điều đáng nhớ là cổ phiếu còn tiếp tục giảm sau khi ông mua và nằm dưới giá vốn một thời gian dài trước khi tăng gấp nhiều lần trong các thập kỷ sau. Bài học: biên an toàn bảo vệ kết quả dài hạn, không bảo vệ bạn khỏi việc thị trường còn rẻ hơn nữa trong ngắn hạn.","en":"In 1973 the US stock market was falling hard and shares of the Washington Post Company were sold off. Warren Buffett, through Berkshire Hathaway, spent about 10.6 million dollars buying a stake. As he later recounted in his shareholder letters, the whole company was then valued by the market at around 80 million dollars, while the newspaper, Newsweek magazine and its television stations could have been sold to a private buyer for about 400 million dollars or more. He did not need a model accurate to the cent; the gap between price and value was wide enough that large errors would still do no harm. Worth remembering: the stock kept falling after he bought and stayed below his cost for a long time before multiplying many times over in the following decades. The lesson: a margin of safety protects the long-term outcome; it does not protect you from the market getting cheaper still in the short run."}},"mistakes":{"vi":["Tin vào một con số định giá chính xác thay vì một khoảng giá trị với các kịch bản.","Đặt tăng trưởng dài hạn cao hơn tăng trưởng của nền kinh tế, khiến giá trị cuối kỳ phình to vô lý.","Chỉnh giả định cho đến khi mô hình ra đúng mức giá mình muốn thấy.","Dùng DCF cho doanh nghiệp có dòng tiền không dự báo nổi như công ty mới thành lập hay cổ phiếu chu kỳ sâu."],"en":["Trusting one precise valuation figure instead of a range with scenarios.","Setting long-term growth above the growth of the economy, which inflates terminal value absurdly.","Tweaking assumptions until the model produces the price you wanted to see.","Applying DCF to businesses whose cash flows cannot be forecast, such as start-ups or deeply cyclical stocks."]},"practice":{"vi":"Trước khi mở phiên ở chế độ Cổ phiếu, viết ra giá trị ước tính và giá mua tối đa có biên an toàn cho một mã, rồi vẽ hai đường ngang ở hai mức đó. Tua khung tuần và chỉ mua khi giá xuống dưới đường thứ hai; cuối phiên xem mức sụt giảm bạn phải chịu sau khi mua trong phần tổng kết.","en":"Before starting a Stocks-mode session, write down your estimated value and your maximum buy price with a margin of safety for one symbol, and draw two horizontal lines at those levels. Replay the weekly timeframe and buy only when price drops below the second line; at the end, check in the session summary how much drawdown you had to sit through after buying."}},{"id":"fa-health","title":{"vi":"Sức khỏe tài chính và chất lượng lợi nhuận","en":"Financial health and earnings quality"},"summary":{"vi":"Doanh nghiệp hiếm khi chết vì lợi nhuận thấp; chúng chết vì hết tiền trả nợ. Bài này chỉ cách đo sức chịu đựng nợ và cách nhận ra lợi nhuận chỉ đẹp trên giấy.","en":"Companies rarely die of low profit; they die when they run out of cash to pay their debts. This lesson shows how to measure debt capacity and how to spot profit that only looks good on paper."},"points":[{"h":{"vi":"Đòn bẩy: nợ trên vốn chủ","en":"Leverage: debt to equity"},"p":{"vi":"Hệ số nợ trên vốn chủ (D/E) bằng nợ vay chịu lãi chia vốn chủ sở hữu; một số nơi dùng tổng nợ phải trả, nên cần biết mình đang đọc định nghĩa nào. Nợ ròng bằng nợ vay trừ tiền mặt; nợ ròng chia EBITDA cho biết cần bao nhiêu năm lợi nhuận hoạt động để trả hết, và mức trên khoảng 3 đến 4 lần thường bị coi là căng với doanh nghiệp sản xuất. Ngưỡng an toàn tùy ngành: điện nước có dòng tiền ổn định chịu được nợ cao hơn doanh nghiệp chu kỳ. Ngân hàng phải phân tích bằng bộ chỉ số riêng.","en":"Debt to equity (D/E) is interest-bearing debt divided by shareholders' equity; some sources use total liabilities, so know which definition you are reading. Net debt is debt minus cash; net debt divided by EBITDA shows how many years of operating profit it would take to repay, and above roughly 3 to 4 times is usually considered stretched for an industrial company. Safe levels depend on the industry: utilities with stable cash flow can carry more debt than cyclical businesses. Banks need their own set of ratios."}},{"h":{"vi":"Khả năng trả lãi","en":"Interest coverage"},"p":{"vi":"Hệ số khả năng trả lãi bằng EBIT chia chi phí lãi vay. Hệ số 5 nghĩa là lợi nhuận hoạt động gấp năm lần tiền lãi phải trả. Dưới khoảng 2 lần là vùng nguy hiểm: chỉ cần doanh thu giảm nhẹ hoặc lãi suất tăng là công ty làm ra không đủ trả lãi. Dưới 1 lần nghĩa là đang phải vay mới hoặc bán tài sản để trả lãi cũ. Hãy xem thêm lịch đáo hạn nợ trong thuyết minh: nợ ngắn hạn lớn tài trợ cho tài sản dài hạn là cấu trúc dễ vỡ khi tín dụng thắt lại.","en":"Interest coverage is EBIT divided by interest expense. A ratio of 5 means operating profit is five times the interest bill. Below about 2 is the danger zone: a small drop in revenue or a rise in rates and the company no longer earns its interest. Below 1 means it is borrowing more or selling assets to pay existing interest. Also check the debt maturity schedule in the notes: large short-term debt funding long-term assets is a fragile structure when credit tightens."}},{"h":{"vi":"Thanh khoản ngắn hạn","en":"Short-term liquidity"},"p":{"vi":"Hệ số thanh toán hiện hành bằng tài sản ngắn hạn chia nợ ngắn hạn; trên 1 nghĩa là tài sản ngắn hạn đủ che nợ đến hạn trong mười hai tháng, và nhiều giáo trình coi 1,5 đến 2 là thoải mái. Hệ số thanh toán nhanh loại hàng tồn kho khỏi tử số, vì tồn kho không phải lúc nào cũng bán kịp. Đừng máy móc: chuỗi bán lẻ thu tiền ngay và trả nhà cung cấp sau có thể hoạt động khỏe với hệ số dưới 1, còn một hệ số cao lại có thể do tồn kho ế và phải thu khó đòi.","en":"The current ratio is current assets divided by current liabilities; above 1 means current assets cover obligations due within twelve months, and many textbooks regard 1.5 to 2 as comfortable. The quick ratio removes inventory from the numerator, because inventory cannot always be sold in time. Do not apply this mechanically: a retailer that collects cash at once and pays suppliers later can run well with a ratio below 1, while a high ratio may be made of unsold stock and doubtful receivables."}},{"h":{"vi":"Dòng tiền hoạt động so với lợi nhuận","en":"Operating cash flow versus net income"},"p":{"vi":"Phép thử chất lượng lợi nhuận đơn giản nhất: cộng dồn dòng tiền hoạt động và lợi nhuận sau thuế trong ba đến năm năm rồi so. Ở doanh nghiệp lành mạnh, dòng tiền hoạt động thường bằng hoặc cao hơn lợi nhuận vì đã cộng lại khấu hao. Lợi nhuận tăng đều trong khi dòng tiền hoạt động âm nhiều năm liền nghĩa là lợi nhuận đang nằm trong các khoản dồn tích: bán chịu, tồn kho, chi phí được vốn hóa. Một quý lệch nhau thì bình thường; lệch kéo dài là tín hiệu cần đào sâu.","en":"The simplest earnings-quality test: add up operating cash flow and net income over three to five years and compare. In a healthy business, operating cash flow is usually equal to or higher than net income because depreciation is added back. Steadily rising profit alongside negative operating cash flow year after year means the profit sits in accruals: credit sales, inventory, capitalized costs. One quarter of divergence is normal; a persistent gap is a signal to dig deeper."}},{"h":{"vi":"Phải thu và tồn kho tăng nhanh hơn doanh thu","en":"Receivables and inventory growing faster than revenue"},"p":{"vi":"Khi phải thu tăng nhanh hơn doanh thu nhiều, công ty có thể đang nới điều kiện bán chịu để đạt chỉ tiêu, hoặc ghi nhận doanh thu sớm; số ngày thu tiền kéo dài là dấu hiệu đi kèm. Khi tồn kho tăng nhanh hơn giá vốn, hàng có thể đang ế và sẽ phải trích lập giảm giá. Các cảnh báo khác: giao dịch lớn với bên liên quan, khoản trả trước và tạm ứng tăng bất thường, đổi công ty kiểm toán liên tục, lợi nhuận phụ thuộc vào thu nhập bất thường, ý kiến kiểm toán có ngoại trừ. Một dấu hiệu chưa phải là kết luận, nhưng nhiều dấu hiệu cùng lúc thì nên tránh.","en":"When receivables grow much faster than revenue, the company may be loosening credit terms to hit targets or booking revenue early; lengthening days sales outstanding is the companion sign. When inventory grows faster than cost of sales, goods may be unsold and write-downs may follow. Other warnings: large related-party transactions, unusual growth in prepayments and advances, frequent changes of auditor, profit that depends on one-off income, and a qualified audit opinion. One sign is not a verdict, but several at once are a reason to stay away."}}],"example":{"vi":"Công ty Z báo lợi nhuận sau thuế 50 tỷ đồng, tăng 25%. Nhìn kỹ hơn: nợ vay 600 tỷ trên vốn chủ 400 tỷ, D/E bằng 1,5. EBIT 90 tỷ, lãi vay 60 tỷ: khả năng trả lãi chỉ 1,5 lần. Tài sản ngắn hạn 500 tỷ, nợ ngắn hạn 450 tỷ: hệ số hiện hành 1,11; nhưng trong đó tồn kho 300 tỷ, nên hệ số thanh toán nhanh chỉ là 200 chia 450, khoảng 0,44. Dòng tiền hoạt động âm 40 tỷ dù lãi 50 tỷ. Doanh thu tăng 10% trong khi phải thu tăng 45% và tồn kho tăng 40%. Từng con số riêng lẻ còn giải thích được; gộp lại, đây là công ty đang vay tiền để nuôi lợi nhuận trên giấy.","en":"Company Z reports net income of 50, up 25%. Look closer: debt of 600 against equity of 400 gives D/E of 1.5. EBIT is 90 and interest 60: coverage is only 1.5 times. Current assets are 500 and current liabilities 450: the current ratio is 1.11; but inventory is 300 of that, so the quick ratio is only 200 divided by 450, about 0.44. Operating cash flow is minus 40 despite a profit of 50. Revenue grew 10% while receivables grew 45% and inventory 40%. Each number alone could be explained; together they describe a company borrowing money to feed a paper profit."},"story":{"title":{"vi":"Gỗ Trường Thành và gần một nghìn tỷ hàng tồn kho","en":"Truong Thanh Furniture and the missing inventory"},"text":{"vi":"Công ty Cổ phần Tập đoàn Kỹ nghệ Gỗ Trường Thành (mã TTF) từng là một trong những nhà chế biến gỗ lớn niêm yết trên sàn TP.HCM. Trong nhiều năm, hàng tồn kho của công ty chiếm phần rất lớn tổng tài sản và tăng nhanh hơn doanh thu, trong khi dòng tiền hoạt động yếu và nợ vay cao. Năm 2016, báo cáo tài chính bán niên được soát xét cho thấy khi kiểm kê, hàng tồn kho thiếu hụt khoảng 980 tỷ đồng so với sổ sách. Công ty chuyển từ có lãi sang lỗ nặng, và cổ phiếu giảm sàn rất nhiều phiên liên tiếp, nhà đầu tư muốn bán cũng không khớp được lệnh. Người đọc báo cáo trước đó không thể biết con số thiếu hụt, nhưng các dấu hiệu thì có sẵn: tồn kho phình to năm này qua năm khác, tiền không về, nợ ngày càng nặng. Bài học: tài sản trên bảng cân đối là con số do doanh nghiệp ghi; dòng tiền là thứ khó tô vẽ hơn. Khi hai thứ kể hai câu chuyện khác nhau, hãy tin dòng tiền.","en":"Truong Thanh Furniture Corporation (ticker TTF) was one of the larger wood processors listed on the Ho Chi Minh City exchange. For years inventory made up a very large share of its total assets and grew faster than revenue, while operating cash flow was weak and debt was high. In 2016 the reviewed half-year financial statements showed that a stock count had found inventory about 980 billion dong short of the amount in the books. The company swung from profit to a heavy loss, and the shares fell by the daily limit for a great many sessions in a row, with sellers unable to get their orders filled. Readers of the earlier statements could not have known the size of the shortfall, but the signs were visible: inventory swelling year after year, cash not coming in, debt growing heavier. The lesson: assets on a balance sheet are figures the company records; cash flow is harder to dress up. When the two tell different stories, believe the cash."}},"mistakes":{"vi":["Vui vì lợi nhuận tăng mà không kiểm tra dòng tiền hoạt động có tăng theo không.","Coi hệ số thanh toán hiện hành cao là an toàn mà không xem nó gồm tiền hay tồn kho và phải thu.","Áp ngưỡng nợ của doanh nghiệp sản xuất cho ngân hàng hoặc ngược lại.","Bỏ qua lịch đáo hạn nợ và rủi ro lãi suất khi nợ ngắn hạn chiếm tỷ trọng lớn."],"en":["Cheering rising profit without checking whether operating cash flow rose with it.","Treating a high current ratio as safe without seeing whether it is cash or inventory and receivables.","Applying an industrial company's debt thresholds to a bank, or the other way round.","Ignoring the debt maturity schedule and interest-rate risk when short-term debt is large."]},"practice":{"vi":"Lập rổ ở chế độ Cổ phiếu gồm một doanh nghiệp ít nợ và một doanh nghiệp nợ cao cùng thị trường, rồi tua khung ngày qua một giai đoạn thị trường giảm mạnh. So mức sụt giảm tối đa của từng mã trong phần tổng kết, và thử đặt cắt lỗ kéo thả cho mã nợ cao để thấy khoảng trống giá ảnh hưởng thế nào.","en":"Build a Stocks-mode basket with one low-debt and one high-debt company from the same market, then replay the daily timeframe through a sharp market decline. Compare each symbol's maximum drawdown in the session summary, and try a draggable stop-loss on the high-debt name to see how price gaps affect it."}},{"id":"fa-moat","title":{"vi":"Mô hình kinh doanh và lợi thế cạnh tranh","en":"Business model and competitive advantage"},"summary":{"vi":"Con số tài chính là kết quả; mô hình kinh doanh và lợi thế cạnh tranh là nguyên nhân. Hiểu được 'con hào' bảo vệ lợi nhuận giúp bạn đoán được những con số đẹp hôm nay có tồn tại được mười năm nữa không.","en":"Financial numbers are the result; the business model and competitive advantage are the cause. Understanding the 'moat' that protects profit helps you judge whether today's good numbers can last another ten years."},"points":[{"h":{"vi":"Mô hình kinh doanh: công ty kiếm tiền thế nào","en":"Business model: how the company makes money"},"p":{"vi":"Trước khi mở bảng tính, hãy trả lời được bằng vài câu: công ty bán gì, cho ai, khách trả tiền một lần hay định kỳ, chi phí lớn nhất là gì, và cần bao nhiêu vốn để tăng thêm một đồng doanh thu. Doanh thu lặp lại như thuê bao hay hàng tiêu dùng thiết yếu dễ dự báo hơn doanh thu theo dự án. Mô hình nhẹ vốn có thể tăng trưởng mà không cần vay hay phát hành thêm. Nếu bạn không giải thích nổi cho một người ngoài ngành, bạn chưa hiểu đủ để định giá nó.","en":"Before opening a spreadsheet, be able to answer in a few sentences: what does the company sell, to whom, do customers pay once or repeatedly, what is the biggest cost, and how much capital is needed to add one more unit of revenue. Recurring revenue such as subscriptions or daily necessities is easier to forecast than project revenue. A capital-light model can grow without borrowing or issuing shares. If you cannot explain it to someone outside the industry, you do not understand it well enough to value it."}},{"h":{"vi":"Con hào kinh tế là gì","en":"What an economic moat is"},"p":{"vi":"Trong một thị trường cạnh tranh, lợi nhuận cao sẽ hút đối thủ vào cho đến khi tỷ suất sinh lời rơi về mức chi phí vốn. Con hào kinh tế, hình ảnh do Warren Buffett phổ biến, là đặc điểm cấu trúc giúp doanh nghiệp chống lại quá trình đó trong nhiều năm. Dấu vết định lượng của nó là ROIC cao hơn chi phí vốn một cách bền bỉ, thường trên mười năm, cùng biên lợi nhuận gộp ổn định. Sản phẩm tốt, thị phần lớn hay một ban lãnh đạo giỏi tự thân chưa phải là con hào nếu đối thủ sao chép được.","en":"In a competitive market, high profit attracts rivals until returns fall back to the cost of capital. An economic moat, an image popularized by Warren Buffett, is a structural feature that lets a business resist that process for many years. Its quantitative footprint is ROIC persistently above the cost of capital, usually for more than ten years, along with stable gross margins. A good product, a large market share or a talented management team is not in itself a moat if competitors can copy it."}},{"h":{"vi":"Thương hiệu và chi phí chuyển đổi","en":"Brand and switching costs"},"p":{"vi":"Thương hiệu chỉ là con hào khi nó cho phép bán giá cao hơn hoặc giữ khách mà không cần giảm giá; phép thử là công ty tăng giá được mà sản lượng gần như không giảm. Bằng sáng chế, giấy phép và quyền khai thác cũng thuộc nhóm tài sản vô hình này. Chi phí chuyển đổi là tiền bạc, thời gian và rủi ro mà khách phải chịu khi đổi nhà cung cấp: phần mềm kế toán đã gắn với cả quy trình, tài khoản ngân hàng gắn với lương và hóa đơn. Chi phí chuyển đổi cao thể hiện ở tỷ lệ khách hàng ở lại rất cao qua nhiều năm.","en":"A brand is a moat only when it allows a higher price or keeps customers without discounting; the test is whether the company can raise prices with almost no loss of volume. Patents, licences and concessions belong to the same family of intangible assets. Switching costs are the money, time and risk a customer bears when changing supplier: accounting software woven into every process, a bank account tied to salary and bills. High switching costs show up as very high customer retention over many years."}},{"h":{"vi":"Hiệu ứng mạng lưới, lợi thế chi phí và quy mô","en":"Network effects, cost advantage and scale"},"p":{"vi":"Hiệu ứng mạng lưới xuất hiện khi mỗi người dùng mới làm sản phẩm giá trị hơn cho mọi người dùng khác, như sàn giao dịch, mạng thanh toán hay ứng dụng nhắn tin; thị trường kiểu này thường dồn về một hai người thắng. Lợi thế chi phí đến từ quy trình tốt hơn, vị trí, hoặc quyền tiếp cận nguyên liệu rẻ, cho phép bán thấp hơn đối thủ mà vẫn có lãi. Lợi thế quy mô là chi phí cố định chia trên sản lượng lớn hơn: mạng phân phối phủ khắp cả nước rất tốn kém để một người mới dựng lại từ đầu.","en":"Network effects arise when each new user makes the product more valuable for every other user, as with exchanges, payment networks or messaging apps; such markets tend to tip toward one or two winners. Cost advantage comes from better processes, location or access to cheaper inputs, allowing a company to undercut rivals and still profit. Scale advantage is fixed cost spread over larger volume: a nationwide distribution network is very expensive for a newcomer to rebuild from scratch."}},{"h":{"vi":"Ban lãnh đạo và phân bổ vốn","en":"Management and capital allocation"},"p":{"vi":"Mỗi đồng lợi nhuận, ban lãnh đạo có năm lựa chọn: tái đầu tư vào kinh doanh, mua lại doanh nghiệp khác, trả nợ, trả cổ tức hoặc mua lại cổ phiếu. Phân bổ tốt là tái đầu tư khi ROIC cao hơn chi phí vốn và trả lại tiền cho cổ đông khi không còn cơ hội như vậy. Hãy đánh giá bằng hồ sơ thực tế: lời hứa trong các báo cáo thường niên cũ có thành hiện thực không, các thương vụ mua bán có sinh lời không, phát hành cổ phiếu có làm loãng cổ đông không, lãnh đạo có sở hữu đáng kể cổ phần và giao dịch với bên liên quan có minh bạch không.","en":"For every unit of profit, management has five choices: reinvest in the business, acquire other companies, repay debt, pay dividends or buy back shares. Good allocation means reinvesting when ROIC exceeds the cost of capital and returning cash to shareholders when such opportunities run out. Judge by the record: did promises in old annual reports come true, did acquisitions earn their cost, did share issues dilute owners, do the managers hold meaningful stakes, and are related-party dealings transparent."}},{"h":{"vi":"Con hào có thể bị lấp","en":"Moats can be filled in"},"p":{"vi":"Không lợi thế nào là vĩnh viễn. Công nghệ mới, thay đổi quy định, thói quen người tiêu dùng dịch chuyển hoặc chính sự tự mãn của doanh nghiệp đều có thể lấp con hào. Dấu hiệu suy yếu: biên lợi nhuận gộp giảm dần, phải tăng chi phí khuyến mãi để giữ doanh thu, ROIC trượt về gần chi phí vốn, thị phần mất vào tay đối thủ mới. Và một con hào rộng không biện minh cho mọi mức giá: doanh nghiệp tuyệt vời mua ở giá quá cao vẫn có thể là khoản đầu tư tồi trong nhiều năm.","en":"No advantage is permanent. New technology, regulatory change, shifting consumer habits or the company's own complacency can all fill in a moat. Signs of erosion: gross margin drifting down, promotion spending rising just to hold revenue, ROIC sliding toward the cost of capital, market share lost to new entrants. And a wide moat does not justify any price: a wonderful business bought at too high a price can still be a poor investment for years."}}],"example":{"vi":"So hai công ty đồ uống trong mười năm. Công ty A giữ biên lợi nhuận gộp trong khoảng 42 đến 45%, ROIC trung bình 22% so với chi phí vốn khoảng 11%, và ba lần tăng giá 5% mà sản lượng chỉ giảm khoảng 1%. Mỗi lần như vậy, doanh thu từ 1.000 tăng lên 1.000 nhân 1,05 nhân 0,99, tức khoảng 1.040, gần như toàn bộ phần tăng đi thẳng vào lợi nhuận. Công ty B có ROIC giảm từ 18% xuống 7% khi đối thủ mới vào, biên gộp từ 35% còn 26%, chi phí khuyến mãi tăng gấp đôi. Nếu cả hai giữ lại 100 tỷ lợi nhuận để tái đầu tư, A tạo thêm khoảng 22 tỷ lợi nhuận mỗi năm, B chỉ khoảng 7 tỷ, thấp hơn chi phí của chính số vốn đó.","en":"Compare two beverage companies over ten years. Company A keeps gross margin between 42 and 45%, averages an ROIC of 22% against a cost of capital of about 11%, and has raised prices by 5% three times while losing only about 1% of volume. Each time, revenue of 1,000 becomes 1,000 times 1.05 times 0.99, about 1,040, and almost all of the increase falls straight to profit. Company B sees ROIC drop from 18% to 7% as new rivals arrive, gross margin fall from 35% to 26% and promotion costs double. If both retain 100 of profit to reinvest, A adds about 22 of profit a year, B only about 7, less than the cost of that very capital."},"story":{"title":{"vi":"See's Candies: bài học về sức mạnh định giá","en":"See's Candies: a lesson in pricing power"},"text":{"vi":"Năm 1972, Warren Buffett và Charlie Munger mua See's Candies, một hãng sô cô la đóng hộp ở California, với giá khoảng 25 triệu đô la. Với Buffett lúc đó, mức giá này là đắt: nó gấp khoảng ba lần giá trị tài sản hữu hình ròng của công ty, trái với thói quen săn cổ phiếu rẻ theo sổ sách của ông. Thứ họ thật sự mua là vị trí của thương hiệu trong tâm trí người mua quà ở bờ Tây nước Mỹ. Người ta không mặc cả giá một hộp kẹo tặng dịp lễ, nên See's có thể tăng giá gần như mỗi năm mà vẫn giữ được khách. Doanh nghiệp cần rất ít vốn bổ sung để tăng trưởng, nên phần lớn lợi nhuận được chuyển về Berkshire Hathaway để đầu tư vào nơi khác. Theo các thư gửi cổ đông của Buffett, trong những thập kỷ sau đó See's đã mang lại tổng lợi nhuận trước thuế gấp rất nhiều lần giá mua. Ông nói thương vụ này đã thay đổi cách ông nghĩ về đầu tư. Bài học: một doanh nghiệp tốt ở mức giá hợp lý có thể đáng giá hơn một doanh nghiệp tầm thường ở mức giá rẻ.","en":"In 1972 Warren Buffett and Charlie Munger bought See's Candies, a California maker of boxed chocolates, for about 25 million dollars. For Buffett at the time the price felt expensive: it was roughly three times the company's net tangible assets, against his habit of hunting for stocks cheap on book value. What they were really buying was the brand's place in the minds of gift buyers on the American West Coast. People do not haggle over a box of chocolates given at a holiday, so See's could raise prices almost every year and keep its customers. The business needed very little extra capital to grow, so most of its profit was sent to Berkshire Hathaway to invest elsewhere. According to Buffett's shareholder letters, over the following decades See's delivered total pre-tax earnings many times the purchase price. He has said the deal changed how he thought about investing. The lesson: a good business at a fair price can be worth more than a mediocre business at a cheap price."}},"mistakes":{"vi":["Nhầm thị phần lớn hoặc sản phẩm đang được ưa chuộng với lợi thế cạnh tranh bền vững.","Trả bất kỳ giá nào cho một doanh nghiệp có con hào vì tin rằng chất lượng sẽ bù lại mọi thứ.","Không kiểm tra con hào bằng số liệu như ROIC và biên gộp qua mười năm mà chỉ tin vào câu chuyện.","Bỏ qua lịch sử phân bổ vốn của ban lãnh đạo, nhất là các thương vụ thâu tóm đắt và phát hành pha loãng."],"en":["Mistaking a large market share or a currently popular product for a durable competitive advantage.","Paying any price for a business with a moat in the belief that quality will make up for everything.","Trusting the story without testing the moat against numbers such as ROIC and gross margin over ten years.","Ignoring management's capital allocation record, especially expensive acquisitions and dilutive share issues."]},"practice":{"vi":"Ở chế độ Cổ phiếu, lập rổ gồm một doanh nghiệp bạn cho là có lợi thế bền vững và một đối thủ cùng ngành, ví dụ trong nhóm FPT, MWG, VNM, VCB, HPG hoặc AAPL, NVDA, TSLA. Tua khung tuần qua vài năm, ghi luận điểm vào nhật ký giao dịch, rồi so kết quả theo từng mã và đường vốn với mua-và-giữ trong phần tổng kết.","en":"In Stocks mode build a basket with a business you believe has a durable advantage and a peer from the same industry, for example among AAPL, NVDA, TSLA or FPT, MWG, VNM, VCB, HPG. Replay several years on the weekly timeframe, write your thesis in the trade journal, then compare per-symbol results and the equity curve against buy-and-hold in the session summary."}},{"id":"fa-macro","title":{"vi":"Vĩ mô cho người giao dịch: lãi suất, lạm phát, tỷ giá và chu kỳ","en":"Macro for traders: rates, inflation, FX and the cycle"},"summary":{"vi":"Vĩ mô là con nước nâng hoặc hạ cả thị trường: lãi suất, lạm phát, tỷ giá và tín dụng quyết định dòng tiền rẻ hay đắt. Hiểu chúng giúp bạn biết khi nào nên mạnh tay và khi nào nên thu mình, dù không ai dự báo chính xác được.","en":"Macro is the tide that lifts or sinks the whole market: rates, inflation, the exchange rate and credit decide whether money is cheap or expensive. Understanding them tells you when to press and when to shrink, even though nobody forecasts them precisely."},"points":[{"h":{"vi":"Lãi suất: giá của tiền","en":"Interest rates: the price of money"},"p":{"vi":"Ngân hàng trung ương đặt lãi suất điều hành (ở Mỹ là lãi suất quỹ liên bang của Fed, ở Việt Nam là lãi suất tái cấp vốn, tái chiết khấu và trần lãi suất huy động của Ngân hàng Nhà nước). Lãi suất tăng làm vay vốn đắt hơn, doanh nghiệp bớt đầu tư, người dân chuyển tiền về tiết kiệm, cổ phiếu kém hấp dẫn so với tiền gửi và trái phiếu. Lãi suất giảm thì ngược lại. Thị trường phản ứng với kỳ vọng chứ không chờ quyết định: giá thường chạy trước khi lãi suất thật sự đổi chiều, nên mức bất ngờ so với kỳ vọng quan trọng hơn bản thân con số công bố.","en":"The central bank sets policy rates (the Fed funds rate in the US; the refinancing rate, discount rate and deposit-rate caps of the State Bank in Vietnam). Higher rates make borrowing dearer, companies invest less, households move cash into deposits, and shares look less attractive against deposits and bonds. Lower rates do the opposite. Markets trade expectations rather than decisions: prices usually move before the rate actually turns, so the surprise versus what was priced in matters more than the headline."}},{"h":{"vi":"Lạm phát","en":"Inflation"},"p":{"vi":"Lạm phát là mức tăng giá chung, đo bằng chỉ số giá tiêu dùng CPI so với cùng kỳ; lạm phát cơ bản loại bỏ lương thực và năng lượng để thấy xu hướng nền. Lãi suất thực xấp xỉ bằng lãi suất danh nghĩa trừ lạm phát. Lạm phát cao buộc ngân hàng trung ương thắt chặt, đồng thời bào mòn biên lợi nhuận của doanh nghiệp không chuyển được chi phí sang khách hàng. Lạm phát thấp và ổn định là môi trường dễ chịu nhất cho cổ phiếu; giảm phát kéo dài cũng xấu vì doanh thu và khả năng trả nợ suy yếu.","en":"Inflation is the general rise in prices, measured by the consumer price index year on year; core inflation strips out food and energy to show the underlying trend. The real interest rate is roughly the nominal rate minus inflation. High inflation forces central banks to tighten and squeezes the margins of firms that cannot pass costs on to customers. Low, stable inflation is the friendliest setting for equities; prolonged deflation is also harmful because revenues and the ability to service debt both weaken."}},{"h":{"vi":"Tỷ giá","en":"The exchange rate"},"p":{"vi":"Tỷ giá USD/VND tăng nghĩa là đồng nội tệ mất giá. Doanh nghiệp xuất khẩu thu ngoại tệ (thủy sản, dệt may, phần mềm) được lợi; doanh nghiệp nhập nguyên liệu hoặc vay nợ bằng đô la (hàng không, điện, thép) chịu lỗ tỷ giá. Khi chênh lệch lãi suất giữa đô la và nội tệ nới rộng, vốn có xu hướng rút ra, khối ngoại bán ròng và ngân hàng trung ương có thể phải nâng lãi suất hoặc bán dự trữ ngoại hối để giữ tỷ giá. Vì vậy chỉ số đô la mạnh thường là gió ngược với thị trường mới nổi.","en":"A rising USD/VND rate means the local currency is weakening. Exporters earning foreign currency (seafood, garments, software) benefit; firms that import inputs or carry dollar debt (airlines, power, steel) book FX losses. When the gap between dollar and local rates widens, capital tends to leave, foreign investors become net sellers, and the central bank may have to raise rates or sell reserves to defend the currency. That is why a strong dollar index is usually a headwind for emerging markets."}},{"h":{"vi":"Cung tiền và tín dụng","en":"Money supply and credit"},"p":{"vi":"Cung tiền M2 gồm tiền mặt và tiền gửi trong hệ thống; tăng trưởng tín dụng là tốc độ ngân hàng cho vay thêm. Ở Việt Nam, nơi doanh nghiệp phụ thuộc nhiều vào vốn ngân hàng, hạn mức tăng trưởng tín dụng hằng năm là biến số được theo dõi sát. Tín dụng nới lỏng thường đi cùng thanh khoản chứng khoán và bất động sản sôi động; tín dụng siết lại, nhất là với trái phiếu doanh nghiệp và cho vay bất động sản, thường báo trước giai đoạn khó khăn. Quan hệ này có độ trễ và không ổn định, nên chỉ dùng làm bối cảnh, không dùng làm tín hiệu chọn thời điểm.","en":"M2 money supply covers cash plus deposits in the system; credit growth is how fast banks extend new loans. In Vietnam, where companies lean heavily on bank funding, the annual credit growth quota is a closely watched variable. Looser credit tends to coincide with lively turnover in stocks and property; tighter credit, especially for corporate bonds and real-estate lending, often precedes a rough patch. The relationship works with lags and is not stable, so use it as background rather than as a timing signal."}},{"h":{"vi":"Chu kỳ kinh tế","en":"The business cycle"},"p":{"vi":"Nền kinh tế đi qua bốn pha: phục hồi, mở rộng, đỉnh và suy thoái. Các thước đo thường dùng là tăng trưởng GDP, chỉ số nhà quản trị mua hàng PMI (trên 50 là mở rộng), bán lẻ, thất nghiệp và đường cong lợi suất. Cổ phiếu thường tạo đáy trước nền kinh tế vài tháng vì thị trường định giá tương lai. Theo kinh nghiệm, tài chính và hàng tiêu dùng không thiết yếu mạnh ở đầu chu kỳ, nguyên vật liệu và năng lượng mạnh cuối chu kỳ, hàng thiết yếu và tiện ích trụ tốt khi suy thoái. Đây là xu hướng trung bình, không phải quy luật.","en":"The economy moves through four phases: recovery, expansion, peak and contraction. Common gauges are GDP growth, the purchasing managers index PMI (above 50 means expansion), retail sales, unemployment and the yield curve. Shares typically bottom months before the economy because markets price the future. As a rule of thumb, financials and consumer discretionary lead early in the cycle, materials and energy late, and staples and utilities hold up in recessions. These are average tendencies, not laws."}},{"h":{"vi":"Lãi suất kéo định giá như thế nào","en":"How rates move valuations"},"p":{"vi":"Giá trị cổ phiếu là dòng tiền tương lai chiết khấu về hiện tại. Mô hình Gordon viết: giá = cổ tức năm tới chia cho (suất chiết khấu trừ tốc độ tăng trưởng). Suất chiết khấu bằng lãi suất phi rủi ro cộng phần bù rủi ro. Khi lãi suất tăng, mẫu số lớn lên và giá hợp lý giảm, dù lợi nhuận không đổi. Cổ phiếu tăng trưởng, nơi phần lớn dòng tiền nằm ở tương lai xa, nhạy cảm nhất. Một cách kiểm tra nhanh: so tỷ suất lợi nhuận E/P của thị trường với lãi suất tiền gửi 12 tháng hoặc lợi suất trái phiếu chính phủ 10 năm.","en":"A share is worth its future cash flows discounted to today. The Gordon model says: price = next year's dividend divided by (discount rate minus growth rate). The discount rate equals the risk-free rate plus a risk premium. When rates rise the denominator grows and fair value falls even if profits are unchanged. Growth stocks, whose cash flows sit far in the future, are the most sensitive. A quick sanity check is to compare the market's earnings yield E/P with the 12-month deposit rate or the 10-year government bond yield."}}],"example":{"vi":"Một cổ phiếu dự kiến trả cổ tức 2.000 đồng năm tới, tăng trưởng dài hạn 5%/năm. Với suất chiết khấu 10% (lãi suất phi rủi ro 5% cộng phần bù rủi ro 5%), giá hợp lý = 2.000 / (0,10 - 0,05) = 40.000 đồng. Nếu lãi suất phi rủi ro tăng thêm 2 điểm phần trăm, suất chiết khấu thành 12% và giá hợp lý = 2.000 / (0,12 - 0,05) = khoảng 28.600 đồng, giảm gần 29% dù doanh nghiệp không làm gì sai. Ngược lại, lãi suất giảm 2 điểm đưa giá hợp lý lên 2.000 / 0,03 = khoảng 66.700 đồng. Một thay đổi nhỏ của lãi suất tạo ra thay đổi rất lớn của định giá.","en":"A stock is expected to pay a 2,000 dong dividend next year and grow 5% a year in the long run. With a 10% discount rate (5% risk-free plus a 5% risk premium), fair value = 2,000 / (0.10 - 0.05) = 40,000 dong. If the risk-free rate rises by 2 percentage points, the discount rate becomes 12% and fair value = 2,000 / (0.12 - 0.05) = about 28,600 dong, almost 29% lower although the company did nothing wrong. Conversely, a 2-point cut lifts fair value to 2,000 / 0.03 = about 66,700 dong. A small change in rates produces a very large change in valuation."},"story":{"title":{"vi":"Năm 2022: khi tiền rẻ biến mất","en":"2022: when cheap money vanished"},"text":{"vi":"Đầu tháng 1 năm 2022, VN-Index vượt 1.500 điểm sau hai năm tiền rẻ và khoảng hai triệu tài khoản chứng khoán mở mới. Rồi bối cảnh đảo chiều. Lạm phát Mỹ lên mức cao nhất khoảng bốn thập kỷ, Fed nâng lãi suất từ gần 0% hồi tháng 3 lên vùng 4,25-4,5% vào tháng 12. Đô la mạnh lên gây sức ép lên tỷ giá, và Ngân hàng Nhà nước tăng các lãi suất điều hành hai lần, mỗi lần 1 điểm phần trăm, vào cuối tháng 9 và cuối tháng 10. Lãi suất tiết kiệm leo lên vùng 9-10%/năm ở nhiều ngân hàng, thị trường trái phiếu doanh nghiệp đóng băng, tín dụng bất động sản bị siết. Đến giữa tháng 11, chỉ số rơi xuống dưới 900 điểm, mất hơn 40% từ đỉnh, nhiều cổ phiếu bất động sản và chứng khoán giảm 70-80%. Phần lớn doanh nghiệp tốt cũng giảm sâu. Bài học: trong một năm lãi suất tăng nhanh, chọn đúng cổ phiếu không cứu được danh mục; trước khi hỏi mua gì, hãy hỏi tiền đang rẻ lên hay đắt lên.","en":"In early January 2022 the VN-Index traded above 1,500 after two years of cheap money and around two million new brokerage accounts. Then the backdrop flipped. US inflation hit its highest level in about four decades and the Fed raised rates from near zero in March to 4.25-4.5% by December. The stronger dollar pressured the exchange rate, and the State Bank of Vietnam lifted its policy rates twice, by 1 percentage point each time, in late September and late October. Deposit rates climbed to around 9-10% a year at many banks, the corporate bond market froze and property lending was squeezed. By mid-November the index had dropped below 900, more than 40% off its peak, with many property and brokerage stocks down 70-80%. Most good companies fell hard too. The lesson: in a year of rapidly rising rates, stock picking does not save a portfolio; before asking what to buy, ask whether money is getting cheaper or dearer."}},"mistakes":{"vi":["Giao dịch theo con số vừa công bố mà quên rằng thị trường đã định giá kỳ vọng từ trước; điều quan trọng là chênh lệch so với dự báo.","Tin rằng mình dự đoán được thời điểm ngân hàng trung ương đổi chiều rồi đặt cược toàn bộ tài khoản vào đó.","Áp máy móc quy tắc 'lãi suất giảm thì cổ phiếu tăng' mà bỏ qua lý do giảm, ví dụ giảm vì kinh tế đang suy thoái.","Bỏ qua rủi ro tỷ giá khi mua doanh nghiệp vay nợ ngoại tệ lớn."],"en":["Trading the headline number while forgetting that expectations were already priced in; what matters is the surprise versus the forecast.","Believing you can time the central bank's pivot and betting the whole account on it.","Applying 'rate cuts mean stocks go up' mechanically while ignoring why rates are being cut, for example because a recession is under way.","Ignoring currency risk when buying companies with large foreign-currency debt."]},"practice":{"vi":"Trên StockGym, chọn ngày bắt đầu là tháng 1 năm 2022 với VN30F1M hoặc rổ cổ phiếu HSX trên khung ngày, bật SMA200 và tiến từng nến. Ghi vào nhật ký mỗi lần bạn mua bắt đáy, rồi xem bảng tổng kết: so đường vốn với mua-và-giữ và mức sụt giảm lớn nhất. Lặp lại với SPY hoặc QQQ cùng giai đoạn để thấy tác động của chu kỳ lãi suất.","en":"On StockGym, set the start date to January 2022 with VN30F1M or a basket of Vietnamese stocks on the daily timeframe, switch on SMA200 and step one candle at a time. Log every dip you try to buy, then read the session summary: compare your equity curve with buy-and-hold and check the maximum drawdown. Repeat with SPY or QQQ over the same period to feel what a rate-hiking cycle does."}},{"id":"fa-industry","title":{"vi":"Phân tích ngành và chu kỳ ngành","en":"Industry analysis and industry cycles"},"summary":{"vi":"Một doanh nghiệp trung bình trong ngành tốt thường thắng một doanh nghiệp giỏi trong ngành tồi. Bài này cho bạn khung đánh giá cấu trúc ngành và các chỉ số riêng của thép, ngân hàng, bán lẻ, bất động sản.","en":"An average company in a good industry often beats a great one in a bad industry. This lesson gives you a framework for industry structure and the specific metrics for steel, banks, retail and real estate."},"points":[{"h":{"vi":"Năm áp lực cạnh tranh của Porter","en":"Porter's five forces"},"p":{"vi":"Michael Porter (1979) cho rằng lợi nhuận dài hạn của một ngành do năm lực quyết định: mức độ cạnh tranh giữa các doanh nghiệp hiện có, nguy cơ đối thủ mới gia nhập, sức ép từ sản phẩm thay thế, quyền mặc cả của nhà cung cấp và quyền mặc cả của khách hàng. Ngành có rào cản gia nhập cao, ít đối thủ, khách hàng phân tán thì giữ được biên lợi nhuận. Ngành sản phẩm giống nhau, dễ vào, khách hàng chỉ nhìn giá thì lợi nhuận bị bào mòn về mức chi phí vốn. Hãy tự chấm từng lực là yếu, vừa hay mạnh trước khi đọc báo cáo tài chính.","en":"Michael Porter (1979) argued that an industry's long-run profitability is set by five forces: rivalry among existing firms, the threat of new entrants, pressure from substitutes, supplier bargaining power and buyer bargaining power. Industries with high entry barriers, few rivals and fragmented customers keep their margins. Industries with identical products, easy entry and price-only buyers see returns competed down to the cost of capital. Score each force as weak, medium or strong before you open a single financial statement."}},{"h":{"vi":"Chu kỳ và phòng thủ","en":"Cyclical versus defensive"},"p":{"vi":"Ngành chu kỳ (thép, hóa chất, vận tải biển, chứng khoán, bất động sản, ô tô) có lợi nhuận lên xuống mạnh theo kinh tế và giá hàng hóa. Ngành phòng thủ (điện, nước, dược, thực phẩm thiết yếu) có nhu cầu ổn định. Cái bẫy kinh điển của cổ phiếu chu kỳ: P/E thấp nhất đúng lúc lợi nhuận ở đỉnh, và cao nhất hoặc âm khi lợi nhuận ở đáy. Vì vậy với ngành chu kỳ nên nhìn P/B, lợi nhuận bình quân qua cả chu kỳ và vị trí của giá hàng hóa, thay vì P/E của bốn quý gần nhất.","en":"Cyclical industries (steel, chemicals, shipping, brokerages, real estate, autos) see profits swing hard with the economy and commodity prices. Defensive industries (power, water, pharma, staple foods) enjoy stable demand. The classic cyclical trap: P/E looks lowest exactly when earnings are at the peak, and highest or negative when earnings are at the trough. So for cyclicals look at P/B, average earnings across a full cycle and where the commodity price sits, rather than the trailing four-quarter P/E."}},{"h":{"vi":"Thép và hàng hóa cơ bản","en":"Steel and commodities"},"p":{"vi":"Doanh nghiệp hàng hóa không quyết định được giá bán nên lợi thế duy nhất là chi phí thấp. Chỉ số cốt lõi của thép là chênh lệch giữa giá thép (thép xây dựng, thép cuộn cán nóng HRC) và giá nguyên liệu (quặng sắt, than cốc, thép phế), cùng với hiệu suất sử dụng công suất và sản lượng tiêu thụ. Cần theo dõi thêm tồn kho: mua nguyên liệu giá cao rồi bán thành phẩm khi giá đã giảm tạo ra lỗ tồn kho rất nhanh. Chính sách sản lượng và xuất khẩu của Trung Quốc, nước sản xuất khoảng một nửa thép thế giới, chi phối giá toàn khu vực.","en":"Commodity producers cannot set their selling price, so the only durable edge is low cost. The core steel metric is the spread between steel prices (rebar, hot-rolled coil HRC) and input prices (iron ore, coking coal, scrap), together with capacity utilisation and sales volume. Watch inventories as well: buying inputs high and selling finished goods after prices have dropped creates inventory losses very quickly. Output and export policy in China, which makes roughly half of the world's steel, drives prices across the region."}},{"h":{"vi":"Ngân hàng","en":"Banks"},"p":{"vi":"Ngân hàng kiếm tiền từ chênh lệch lãi suất và phí. NIM (biên lãi ròng) = thu nhập lãi thuần chia cho tài sản sinh lãi bình quân. Tỷ lệ nợ xấu NPL = dư nợ nhóm 3 đến 5 chia cho tổng dư nợ; nên xem cả nợ nhóm 2 và nợ tái cơ cấu. Tỷ lệ bao phủ nợ xấu = dự phòng chia cho nợ xấu. CASA là tỷ trọng tiền gửi không kỳ hạn, nguồn vốn rẻ. CIR là chi phí hoạt động trên thu nhập, CAR là hệ số an toàn vốn. Định giá ngân hàng thường dùng P/B đặt cạnh ROE. Lợi nhuận ngân hàng có thể được làm đẹp bằng cách trích lập ít dự phòng.","en":"Banks earn the interest spread plus fees. NIM (net interest margin) = net interest income divided by average earning assets. The NPL ratio = loans in groups 3 to 5 divided by total loans; also check group-2 and restructured loans. The loan-loss coverage ratio = provisions divided by NPLs. CASA is the share of current-account deposits, a cheap funding source. CIR is operating cost to income, CAR is the capital adequacy ratio. Banks are usually valued on P/B set against ROE. Bank profits can be flattered simply by under-provisioning."}},{"h":{"vi":"Bán lẻ","en":"Retail"},"p":{"vi":"Tăng trưởng bán lẻ đến từ hai nguồn: mở thêm cửa hàng và bán được nhiều hơn ở cửa hàng cũ. Tăng trưởng doanh thu cửa hàng cũ (SSSG) chỉ tính các cửa hàng đã mở từ khoảng 12 tháng trở lên và là thước đo sức khỏe thật. Doanh thu tổng tăng nhờ mở mới ồ ạt trong khi SSSG âm là dấu hiệu cảnh báo. Các chỉ số khác: doanh thu trên mỗi cửa hàng hoặc mỗi mét vuông, biên lợi nhuận gộp, số ngày tồn kho, vòng quay tiền mặt và thời gian hoàn vốn một cửa hàng. Bán lẻ có biên mỏng nên quản lý tồn kho quyết định thành bại.","en":"Retail growth comes from two sources: opening new stores and selling more in existing ones. Same-store sales growth (SSSG) counts only stores open for about 12 months or more and is the true health gauge. Total revenue rising on aggressive openings while SSSG is negative is a warning sign. Other metrics: sales per store or per square metre, gross margin, inventory days, the cash conversion cycle and the payback period of one store. Retail margins are thin, so inventory management decides success or failure."}},{"h":{"vi":"Bất động sản","en":"Real estate"},"p":{"vi":"Lợi nhuận bất động sản ghi nhận khi bàn giao, thường trễ một đến ba năm sau khi bán hàng. Vì thế doanh số ký bán (presales) và khoản người mua trả tiền trước trên bảng cân đối kế toán cho biết lợi nhuận tương lai tốt hơn báo cáo kết quả kinh doanh hiện tại. Cần xem quỹ đất và tình trạng pháp lý, tỷ lệ nợ vay ròng trên vốn chủ sở hữu, lịch đáo hạn trái phiếu và dòng tiền kinh doanh. Ngành này nhạy cảm nhất với lãi suất và tín dụng: khi tín dụng siết, doanh nghiệp đòn bẩy cao gặp khó trước dù sổ sách vẫn báo lãi.","en":"Property profits are booked at handover, typically one to three years after the sale. So contracted presales and customer advances on the balance sheet tell you more about future profit than the current income statement. Check the land bank and its legal status, net debt to equity, the bond maturity schedule and operating cash flow. This is the industry most sensitive to rates and credit: when credit tightens, highly leveraged developers get into trouble first even while the books still show a profit."}}],"example":{"vi":"So sánh hai ngân hàng giả định. Ngân hàng A: thu nhập lãi thuần 20.000 tỷ, tài sản sinh lãi bình quân 500.000 tỷ, NIM = 4,0%; nợ xấu 1,0%, bao phủ 200%, ROE 20%, P/B 1,8. Ngân hàng B: NIM 4,5%, nợ xấu 3,0%, bao phủ 60%, ROE 22%, P/B 1,0. B trông rẻ và sinh lời hơn. Nhưng nếu B nâng bao phủ lên 100% như mức thận trọng, họ phải trích thêm 40% của khối nợ xấu, tức 1,2% tổng dư nợ, đủ lấy đi một phần đáng kể lợi nhuận của một năm. Sau điều chỉnh, ROE thật của B thấp hơn rõ rệt và P/B 1,0 không còn rẻ như vẻ ngoài. Chỉ số ngành giúp bạn nhìn thấy chất lượng đằng sau con số lợi nhuận.","en":"Compare two hypothetical banks. Bank A: net interest income 20,000 billion, average earning assets 500,000 billion, NIM = 4.0%; NPL 1.0%, coverage 200%, ROE 20%, P/B 1.8. Bank B: NIM 4.5%, NPL 3.0%, coverage 60%, ROE 22%, P/B 1.0. B looks cheaper and more profitable. But if B raised coverage to a prudent 100%, it would need extra provisions equal to 40% of its bad loans, that is 1.2% of total lending, enough to take away a sizeable part of a year's profit. After that adjustment B's true ROE is clearly lower and a P/B of 1.0 is not as cheap as it looks. Industry metrics let you see the quality behind the profit figure."},"story":{"title":{"vi":"Thép 2021-2022: P/E thấp ở đỉnh chu kỳ","en":"Steel 2021-2022: low P/E at the top of the cycle"},"text":{"vi":"Năm 2021, giá thép toàn cầu tăng vọt khi kinh tế mở cửa lại sau đại dịch. Hòa Phát, nhà sản xuất thép lớn nhất Việt Nam, báo lãi sau thuế kỷ lục khoảng 34.500 tỷ đồng, gấp hơn hai lần năm trước. Cuối năm đó cổ phiếu giao dịch ở mức P/E một chữ số, và nhiều nhà đầu tư cá nhân coi đó là rẻ. Nhưng sang năm 2022, giá thép quay đầu trong khi than cốc tăng mạnh, nhu cầu xây dựng trong nước chững lại vì tín dụng bất động sản bị siết, tỷ giá và lãi suất cùng tăng. Công ty báo lỗ khoảng 1.800 tỷ đồng trong quý 3 và khoảng 2.000 tỷ đồng trong quý 4 năm 2022, phải tạm dừng một số lò cao. Giá cổ phiếu giảm hơn một nửa từ đỉnh. Doanh nghiệp vẫn là nhà sản xuất chi phí thấp và sau đó hồi phục, nhưng ai mua vì P/E thấp ở đỉnh đã phải chịu một chặng đường rất đau. Bài học: với ngành chu kỳ, lợi nhuận kỷ lục và P/E thấp thường là tín hiệu thận trọng, không phải tín hiệu rẻ.","en":"In 2021 global steel prices surged as economies reopened after the pandemic. Hoa Phat, Vietnam's largest steelmaker, reported a record net profit of about 34,500 billion dong, more than double the previous year. Late that year the shares traded on a single-digit P/E and many retail investors called that cheap. But in 2022 steel prices rolled over while coking coal spiked, domestic construction demand stalled as property credit was squeezed, and both the exchange rate and interest rates rose. The company posted losses of about 1,800 billion dong in the third quarter and about 2,000 billion dong in the fourth quarter of 2022 and idled some blast furnaces. The share price fell by more than half from its peak. The firm remained a low-cost producer and later recovered, but anyone who bought for the low P/E at the top endured a very painful ride. The lesson: in a cyclical industry, record earnings and a low P/E are more often a caution sign than a bargain sign."}},"mistakes":{"vi":["Dùng P/E bốn quý gần nhất để kết luận cổ phiếu chu kỳ rẻ khi lợi nhuận đang ở đỉnh.","So sánh chỉ số tài chính giữa các ngành khác nhau, ví dụ đem nợ trên vốn của ngân hàng so với doanh nghiệp sản xuất.","Nhìn tăng trưởng doanh thu tổng của nhà bán lẻ mà không tách phần đến từ cửa hàng cũ.","Đánh giá doanh nghiệp bất động sản bằng lợi nhuận quý hiện tại thay vì doanh số bán hàng, dòng tiền và lịch trả nợ."],"en":["Using the trailing P/E to call a cyclical stock cheap while earnings are at their peak.","Comparing ratios across unrelated industries, such as a bank's leverage with a manufacturer's.","Looking at a retailer's total revenue growth without separating the part that comes from existing stores.","Judging a developer by the current quarter's profit instead of presales, cash flow and its debt schedule."]},"practice":{"vi":"Mở chế độ Cổ phiếu trên StockGym với rổ gồm cả mã chu kỳ lẫn mã phòng thủ, ví dụ HPG, VCB, MWG và VNM, khung tuần, bắt đầu từ năm 2021. Tiến từng nến và so sánh biên độ dao động của từng mã; bảng tổng kết theo từng mã thường cho thấy mã chu kỳ đóng góp cả phần lãi lớn nhất lẫn mức sụt giảm lớn nhất.","en":"Open Stocks mode on StockGym with a basket holding cyclical and defensive names, for example HPG, VCB, MWG and VNM, on the weekly timeframe starting in 2021. Step candle by candle and compare how far each one swings; the per-symbol session summary will often show the cyclical name delivering both the biggest gains and the deepest drawdown."}},{"id":"fa-redflags","title":{"vi":"Dấu hiệu cảnh báo kế toán và gian lận","en":"Accounting red flags and fraud"},"summary":{"vi":"Lợi nhuận là ý kiến, tiền mặt là sự thật. Bài này chỉ ra những dấu hiệu trên báo cáo tài chính cho thấy con số có thể đã được làm đẹp, để bạn tránh xa trước khi quá muộn.","en":"Profit is an opinion, cash is a fact. This lesson shows the signs in financial statements that suggest the numbers may have been dressed up, so you can step away before it is too late."},"points":[{"h":{"vi":"Ghi nhận doanh thu quá tay","en":"Aggressive revenue recognition"},"p":{"vi":"Doanh thu chỉ nên ghi nhận khi hàng hóa, dịch vụ đã chuyển giao và khả năng thu tiền là chắc chắn. Các thủ thuật thường gặp: dồn hàng cho đại lý cuối quý (nhồi kênh), ghi doanh thu trước khi giao hàng, bán cho chính bên liên quan, hoặc ghi một lần khoản thu trải nhiều năm. Dấu hiệu nhận biết: khoản phải thu tăng nhanh hơn doanh thu, số ngày thu tiền bình quân (phải thu chia doanh thu nhân 365) kéo dài dần qua các quý, doanh thu tăng đột biến vào quý cuối năm, và hàng bán bị trả lại tăng ở quý sau.","en":"Revenue should be booked only when goods or services have been delivered and collection is reasonably certain. Common tricks: loading distributors at quarter-end (channel stuffing), booking sales before delivery, selling to your own related parties, or recognising multi-year income up front. Tell-tale signs: receivables growing faster than revenue, days sales outstanding (receivables divided by revenue times 365) lengthening quarter after quarter, a revenue spike in the final quarter of the year, and rising sales returns in the following quarter."}},{"h":{"vi":"Có lãi mà không có tiền","en":"Profit without cash"},"p":{"vi":"So sánh lợi nhuận sau thuế với lưu chuyển tiền thuần từ hoạt động kinh doanh (CFO) trong nhiều năm. Doanh nghiệp lành mạnh thường có tỷ lệ CFO trên lợi nhuận quanh mức 1 hoặc cao hơn nếu cộng dồn ba đến năm năm. Lãi đều đặn nhưng CFO âm kéo dài, phải liên tục vay nợ hoặc phát hành cổ phiếu để sống là cảnh báo nghiêm trọng. Hãy xem tiền đang nằm ở đâu: phải thu, tồn kho, trả trước cho người bán hay chi phí xây dựng dở dang tăng mãi không kết chuyển. Lưu ý ngoại lệ: doanh nghiệp đang mở rộng nhanh có thể tạm thời âm CFO một cách hợp lý.","en":"Compare net profit with cash flow from operations (CFO) over several years. A healthy business usually shows cumulative CFO to net profit of about 1 or more across three to five years. Steady profits with persistently negative CFO, kept alive only by constant borrowing or share issuance, is a serious warning. Find where the money is sitting: receivables, inventory, prepayments to suppliers, or construction-in-progress that keeps growing and is never transferred. Note the exception: a fast-expanding firm can legitimately run negative CFO for a while."}},{"h":{"vi":"Giao dịch với bên liên quan","en":"Related-party transactions"},"p":{"vi":"Bên liên quan gồm cổ đông lớn, lãnh đạo, người thân của họ và các công ty họ kiểm soát. Rủi ro nằm ở chỗ tài sản của công ty đại chúng bị chuyển ra ngoài: cho vay không tài sản bảo đảm, ứng trước tiền mua hàng hoặc mua tài sản từ công ty của chủ tịch với giá cao, bán hàng cho công ty sân sau để tạo doanh thu, bảo lãnh nợ cho bên thứ ba. Hãy đọc thuyết minh báo cáo tài chính phần bên liên quan, các khoản phải thu khác, đầu tư ủy thác và hợp tác kinh doanh. Quy mô lớn so với vốn chủ sở hữu và diễn giải mơ hồ là lý do đủ để đứng ngoài.","en":"Related parties include major shareholders, executives, their relatives and the companies they control. The risk is that assets of the listed company are siphoned out: unsecured loans, prepayments or asset purchases from the chairman's firm at inflated prices, sales to affiliated shells to manufacture revenue, guarantees for third-party debt. Read the notes on related parties, other receivables, entrusted investments and business cooperation contracts. Amounts that are large relative to equity combined with vague explanations are reason enough to stay away."}},{"h":{"vi":"Kiểm toán và quản trị","en":"Auditors and governance"},"p":{"vi":"Ý kiến kiểm toán có bốn dạng: chấp nhận toàn phần, ngoại trừ, trái ngược và từ chối đưa ra ý kiến. Bất cứ dạng nào khác chấp nhận toàn phần đều cần đọc kỹ lý do. Cảnh báo khác: thay công ty kiểm toán thường xuyên hoặc đổi từ hãng lớn sang hãng nhỏ ít tên tuổi, kế toán trưởng hay giám đốc tài chính từ chức đột ngột, chậm nộp báo cáo, lợi nhuận sau kiểm toán lệch mạnh so với báo cáo tự lập, và đoạn 'vấn đề cần nhấn mạnh' về khả năng hoạt động liên tục. Kiểm toán không bảo đảm là không có gian lận; nó chỉ làm xác suất thấp đi.","en":"An audit opinion comes in four forms: unqualified, qualified, adverse and disclaimer. Anything other than unqualified deserves a careful read of the reasons. Other warnings: frequent auditor changes or a switch from a major firm to a little-known one, the sudden resignation of the chief accountant or CFO, late filings, audited profit differing sharply from the self-prepared figures, and an emphasis-of-matter paragraph on going concern. An audit does not guarantee there is no fraud; it only lowers the probability."}},{"h":{"vi":"Biên lợi nhuận đẹp bất thường","en":"Margins that are too good"},"p":{"vi":"Nếu một doanh nghiệp bán sản phẩm tương tự đối thủ mà biên lợi nhuận gộp hoặc ROE cao hơn hẳn mặt bằng ngành trong nhiều năm, phải có lời giải thích kinh tế rõ ràng: thương hiệu, quy mô, công nghệ, vị trí. Không có thì nên nghi ngờ. Các cách thổi biên phổ biến là vốn hóa chi phí (đưa chi phí vào tài sản thay vì kết quả kinh doanh), kéo dài thời gian khấu hao, không trích lập dự phòng giảm giá tồn kho và nợ khó đòi, và ghi thu nhập bất thường như lãi đánh giá lại tài sản vào lợi nhuận cốt lõi. Lợi nhuận tăng đều quá mượt mà qua mọi chu kỳ cũng là điều đáng ngờ.","en":"If a firm sells much the same product as its rivals yet shows gross margins or ROE far above the industry for years, there must be a clear economic explanation: brand, scale, technology, location. If there is none, be suspicious. Common ways to inflate margins are capitalising costs (parking expenses in assets instead of the income statement), stretching depreciation lives, skipping provisions for inventory write-downs and doubtful debts, and counting one-off items such as revaluation gains as core profit. Earnings that rise too smoothly through every cycle are suspect as well."}}],"example":{"vi":"Công ty X (giả định) báo cáo ba năm liên tiếp: doanh thu 1.000, 1.300 và 1.700 tỷ đồng; lợi nhuận sau thuế 100, 140 và 190 tỷ. Trông rất đẹp. Nhưng khoản phải thu lần lượt là 150, 320 và 620 tỷ, tức số ngày thu tiền tăng từ khoảng 55 lên 90 rồi 133 ngày. Lưu chuyển tiền từ kinh doanh là +60, -40 và -150 tỷ: cộng ba năm lãi 430 tỷ nhưng tiền từ kinh doanh âm 130 tỷ. Trong cùng thời gian nợ vay tăng từ 200 lên 700 tỷ và công ty phát hành thêm cổ phiếu hai lần. Kết luận hợp lý: tăng trưởng đang được tài trợ bằng tiền của chủ nợ và cổ đông chứ chưa phải của khách hàng; cần lời giải thích thuyết phục trước khi tin vào con số lợi nhuận.","en":"Hypothetical Company X reports three consecutive years: revenue of 1,000, 1,300 and 1,700 billion dong; net profit of 100, 140 and 190 billion. It looks excellent. But receivables are 150, 320 and 620 billion, so days sales outstanding go from about 55 to 90 and then 133 days. Operating cash flow is +60, -40 and -150 billion: three years of profit total 430 billion while cash from operations is minus 130 billion. Over the same period debt rises from 200 to 700 billion and the company issues new shares twice. The sensible conclusion: growth is being financed by lenders and shareholders, not yet by customers; you need a convincing explanation before trusting the profit figure."},"story":{"title":{"vi":"Luckin Coffee: đếm khách ngoài cửa hàng","en":"Luckin Coffee: counting customers at the door"},"text":{"vi":"Luckin Coffee, chuỗi cà phê Trung Quốc thành lập năm 2017, niêm yết trên sàn Nasdaq vào tháng 5 năm 2019 với câu chuyện tăng trưởng thần tốc: hàng nghìn cửa hàng mở trong hai năm và tham vọng vượt Starbucks tại Trung Quốc. Cuối tháng 1 năm 2020, hãng bán khống Muddy Waters công bố một báo cáo ẩn danh, trong đó người viết cho biết đã thuê người đến đếm khách và quay hơn 11.000 giờ video tại các cửa hàng, rồi kết luận số ly bán mỗi ngày bị thổi phồng. Công ty phủ nhận. Nhưng ngày 2 tháng 4 năm 2020, chính Luckin thừa nhận khoảng 2,2 tỷ nhân dân tệ doanh số năm 2019 là ngụy tạo. Cổ phiếu mất khoảng ba phần tư giá trị trong một phiên, bị hủy niêm yết khỏi Nasdaq vài tháng sau, và công ty đồng ý nộp phạt 180 triệu đô la cho cơ quan quản lý chứng khoán Mỹ. Bài học: tăng trưởng quá nhanh và quá đẹp cần được kiểm chứng bằng thực tế ngoài báo cáo, và cắt lỗ là lớp bảo vệ cuối cùng khi phân tích của bạn bỏ sót gian lận.","en":"Luckin Coffee, a Chinese coffee chain founded in 2017, listed on Nasdaq in May 2019 with a story of breakneck growth: thousands of stores opened in two years and an ambition to overtake Starbucks in China. In late January 2020 the short seller Muddy Waters published an anonymous report whose author said they had hired people to count customers and record more than 11,000 hours of video at stores, concluding that daily cups sold were overstated. The company denied it. But on 2 April 2020 Luckin itself admitted that about 2.2 billion yuan of 2019 sales had been fabricated. The shares lost roughly three quarters of their value in a single session, were delisted from Nasdaq a few months later, and the company agreed to pay a 180 million dollar penalty to the US securities regulator. The lesson: growth that is too fast and too pretty must be checked against reality outside the reports, and a stop-loss is your last line of defence when your analysis misses a fraud."}},"mistakes":{"vi":["Chỉ đọc báo cáo kết quả kinh doanh mà bỏ qua báo cáo lưu chuyển tiền tệ và phần thuyết minh.","Coi một dấu hiệu cảnh báo đơn lẻ là bằng chứng gian lận, hoặc ngược lại, bỏ qua khi nhiều dấu hiệu xuất hiện cùng lúc.","Tin rằng có công ty kiểm toán lớn ký tên thì số liệu chắc chắn đúng.","Giữ cổ phiếu vì đã lỗ nặng dù câu chuyện kế toán ngày càng xấu đi."],"en":["Reading only the income statement and skipping the cash flow statement and the notes.","Treating a single red flag as proof of fraud, or the opposite, shrugging when several appear together.","Assuming that a big-name auditor's signature makes the numbers certainly right.","Holding on because the loss is already large even as the accounting story keeps getting worse."]},"practice":{"vi":"Trên StockGym bạn không đọc được báo cáo tài chính, nhưng luyện được lớp bảo vệ cuối cùng: ở chế độ Phái sinh hoặc Cổ phiếu, đặt cắt lỗ cho mọi lệnh ngay khi vào và không dời nó ra xa. Chọn một giai đoạn có nến sập mạnh, tiến từng nến, rồi xem trong nhật ký giao dịch khoản lỗ lớn nhất của bạn có vượt mức đã định hay không.","en":"StockGym does not show financial statements, but it lets you drill the last line of defence: in Derivatives or Stocks mode, attach a stop-loss to every trade the moment you enter and never drag it further away. Pick a period with a violent sell-off, step candle by candle, then check in the trade journal whether your largest loss stayed within the limit you set."}},{"id":"fa-events","title":{"vi":"Sự kiện doanh nghiệp: kết quả kinh doanh, cổ tức, phát hành và pha loãng","en":"Corporate events: earnings, dividends, issuance and dilution"},"summary":{"vi":"Mùa báo cáo, ngày chốt quyền, phát hành thêm hay mua lại cổ phiếu đều làm giá biến động và làm thay đổi phần sở hữu của bạn. Hiểu đúng cơ chế giúp bạn không hoảng vì một cú 'giảm giá' chỉ là điều chỉnh kỹ thuật.","en":"Earnings season, record dates, new share issues and buybacks all move the price and change the slice of the company you own. Knowing the mechanics keeps you from panicking over a 'drop' that is only a technical adjustment."},"points":[{"h":{"vi":"Mùa báo cáo và kế hoạch kinh doanh","en":"Earnings season and guidance"},"p":{"vi":"Doanh nghiệp niêm yết công bố kết quả mỗi quý; ở Việt Nam báo cáo quý thường ra trong vòng 20 đến 30 ngày sau khi kết thúc quý, còn ở Mỹ mùa báo cáo kéo dài vài tuần sau mỗi quý. Giá phản ứng với chênh lệch giữa kết quả và kỳ vọng, không phải với con số tuyệt đối: lãi tăng 30% vẫn có thể làm giá giảm nếu thị trường chờ 50%. Triển vọng do ban lãnh đạo đưa ra (ở Mỹ gọi là guidance, ở Việt Nam là kế hoạch trình đại hội cổ đông) thường quan trọng hơn kết quả quá khứ. Biến động quanh ngày công bố lớn hơn bình thường và có thể tạo khoảng trống giá.","en":"Listed companies report every quarter; in Vietnam quarterly statements usually arrive within 20 to 30 days of quarter-end, while in the US earnings season runs for several weeks after each quarter. Prices react to the gap between results and expectations, not to the absolute number: profit up 30% can still send the stock down if the market was waiting for 50%. Management's outlook (guidance in the US, the plan submitted to the annual general meeting in Vietnam) often matters more than past results. Volatility around the release is higher than normal and can produce price gaps."}},{"h":{"vi":"Cổ tức tiền mặt và cổ tức cổ phiếu","en":"Cash dividends versus stock dividends"},"p":{"vi":"Cổ tức tiền mặt là tiền thật rời khỏi công ty vào
