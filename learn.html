tài khoản cổ đông; tỷ suất cổ tức = cổ tức mỗi cổ phần chia cho giá thị trường. Lưu ý ở Việt Nam tỷ lệ cổ tức thường công bố theo mệnh giá 10.000 đồng: 'cổ tức 20%' nghĩa là 2.000 đồng mỗi cổ phiếu, với giá 50.000 đồng thì tỷ suất chỉ 4%. Cổ tức bằng cổ phiếu và cổ phiếu thưởng không đem lại giá trị mới: số cổ phiếu tăng, giá điều chỉnh giảm tương ứng, tổng giá trị nắm giữ không đổi. Nó chỉ cho thấy công ty giữ lại lợi nhuận để tái đầu tư.","en":"A cash dividend is real money leaving the company for shareholders' accounts; dividend yield = dividend per share divided by market price. Note that in Vietnam the dividend rate is usually quoted on the 10,000 dong par value: a '20% dividend' means 2,000 dong per share, which at a 50,000 dong price is only a 4% yield. Stock dividends and bonus shares create no new value: the share count rises, the price is adjusted down in proportion, and the total value of your holding is unchanged. They merely signal that the company is retaining profit to reinvest."}},{"h":{"vi":"Ngày giao dịch không hưởng quyền và điều chỉnh giá","en":"Ex-dividend date and price adjustment"},"p":{"vi":"Để nhận quyền, bạn phải mua trước ngày giao dịch không hưởng quyền, tức ngày làm việc liền trước ngày đăng ký cuối cùng theo chu kỳ thanh toán hiện hành. Vào ngày không hưởng quyền, sở giao dịch điều chỉnh giá tham chiếu theo công thức: giá điều chỉnh = (giá đóng cửa trước đó + giá phát hành quyền mua nhân tỷ lệ quyền mua - cổ tức tiền mặt) chia cho (1 + tỷ lệ cổ tức cổ phiếu, cổ phiếu thưởng + tỷ lệ quyền mua). Giá giảm trên biểu đồ lúc này không phải là thua lỗ. Biểu đồ điều chỉnh sẽ sửa lùi giá quá khứ để các chỉ báo không bị méo.","en":"To receive the entitlement you must buy before the ex-rights date, which is the business day immediately before the record date under the current settlement cycle. On the ex date the exchange adjusts the reference price using: adjusted price = (previous close + rights issue price times rights ratio - cash dividend) divided by (1 + stock dividend and bonus ratio + rights ratio). The lower price on the chart at that point is not a loss. Adjusted charts back-adjust historical prices so that indicators are not distorted."}},{"h":{"vi":"Phát hành quyền mua và pha loãng","en":"Rights issues and dilution"},"p":{"vi":"Phát hành quyền mua cho cổ đông hiện hữu là cách công ty huy động vốn mới bằng cách cho cổ đông mua thêm cổ phiếu với giá thấp hơn thị trường. Nếu bạn không thực hiện quyền, tỷ lệ sở hữu giảm và bạn mất phần chênh lệch giá, trừ khi bán được quyền. Câu hỏi quan trọng nhất là tiền huy động dùng làm gì: mở rộng dự án sinh lời cao là tốt, trả nợ hay bù lỗ thường là tín hiệu kém hơn. Pha loãng được đo bằng EPS: lợi nhuận không đổi mà số cổ phiếu tăng 30% thì EPS giảm khoảng 23%. Phát hành riêng lẻ giá thấp cho một nhóm nhỏ gây pha loãng cho những cổ đông còn lại.","en":"A rights issue raises new capital by letting existing shareholders buy extra shares below the market price. If you do not exercise, your ownership percentage shrinks and you lose the price discount unless you can sell the rights. The key question is what the money is for: expanding a high-return project is good, repaying debt or plugging losses is usually a weaker sign. Dilution shows up in EPS: with unchanged profit and 30% more shares, EPS falls by about 23%. A cheap private placement to a small group dilutes all the remaining shareholders."}},{"h":{"vi":"Mua lại cổ phiếu","en":"Share buybacks"},"p":{"vi":"Khi công ty dùng tiền mua lại cổ phiếu của chính mình rồi hủy, số cổ phiếu lưu hành giảm và EPS, ROE tăng dù lợi nhuận không đổi. Mua lại tạo giá trị khi cổ phiếu đang rẻ hơn giá trị nội tại và công ty thừa tiền; nó hủy hoại giá trị khi mua ở giá cao hoặc vay nợ để mua. Hãy phân biệt công bố và thực hiện: nhiều chương trình được đăng ký nhưng chỉ mua một phần nhỏ. Cũng cần kiểm tra xem mua lại có chỉ để bù cho lượng cổ phiếu phát hành cho nhân viên hay không; nếu số cổ phiếu lưu hành không giảm thì cổ đông không được lợi.","en":"When a company uses cash to repurchase and cancel its own shares, the share count falls and EPS and ROE rise even if profit is flat. Buybacks create value when the stock trades below intrinsic value and the company has surplus cash; they destroy value when done at high prices or with borrowed money. Separate announcement from execution: many programmes are registered but only partly completed. Also check whether the buyback merely offsets shares issued to employees; if the outstanding share count does not fall, shareholders gain nothing."}},{"h":{"vi":"ESOP","en":"ESOP"},"p":{"vi":"ESOP là chương trình phát hành cổ phiếu cho người lao động, thường với giá ưu đãi (ở Việt Nam phổ biến là bằng mệnh giá 10.000 đồng hoặc miễn phí) và có thời gian hạn chế chuyển nhượng. Mục đích tốt là gắn lợi ích nhân sự chủ chốt với cổ đông. Mặt trái là pha loãng: phần chênh giữa giá thị trường và giá phát hành là giá trị chuyển từ cổ đông sang nhân viên. Một chương trình 1-2% mỗi năm ở doanh nghiệp tăng trưởng tốt có thể chấp nhận được; phát hành lớn, đều đặn, giá rất thấp và dồn vào một vài lãnh đạo là dấu hiệu quản trị kém. Hãy theo dõi thời điểm hết hạn chế chuyển nhượng vì nguồn cung có thể tăng.","en":"An ESOP issues shares to employees, usually at a preferential price (in Vietnam commonly at the 10,000 dong par value or for free) with a lock-up period. The good purpose is to align key staff with shareholders. The flip side is dilution: the gap between market price and issue price is value transferred from shareholders to employees. A programme of 1-2% a year at a fast-growing firm may be acceptable; large, regular, very cheap issues concentrated on a few executives signal poor governance. Watch the date when the lock-up ends, because supply can increase."}}],"example":{"vi":"Cổ phiếu Y đóng cửa 50.000 đồng trước ngày không hưởng quyền. Công ty trả cổ tức tiền mặt 2.000 đồng và cổ tức cổ phiếu 20%. Giá tham chiếu điều chỉnh = (50.000 - 2.000) / (1 + 0,20) = 40.000 đồng. Bạn có 1.000 cổ phiếu trị giá 50 triệu; sau điều chỉnh bạn có 1.200 cổ phiếu nhân 40.000 = 48 triệu, cộng 2 triệu tiền mặt (trước thuế), tổng vẫn là 50 triệu. Trường hợp quyền mua: tỷ lệ 2:1 (hai cổ phiếu được mua một) giá 10.000 đồng khi thị giá 30.000 đồng. Giá lý thuyết sau quyền = (30.000 + 10.000 nhân 0,5) / (1 + 0,5) = khoảng 23.300 đồng. Nếu không mua và không bán quyền, bạn mất khoảng 6.700 đồng trên mỗi cổ phiếu đang nắm giữ.","en":"Stock Y closes at 50,000 dong before the ex date. The company pays a 2,000 dong cash dividend and a 20% stock dividend. Adjusted reference price = (50,000 - 2,000) / (1 + 0.20) = 40,000 dong. You hold 1,000 shares worth 50 million; after the adjustment you hold 1,200 shares times 40,000 = 48 million, plus 2 million in cash (before tax), still 50 million in total. A rights case: a 2:1 ratio (one new share for every two held) at 10,000 dong when the market price is 30,000 dong. Theoretical ex-rights price = (30,000 + 10,000 times 0.5) / (1 + 0.5) = about 23,300 dong. If you neither subscribe nor sell the rights, you lose about 6,700 dong on every share you hold."},"story":{"title":{"vi":"Lan và cú 'sập 20%' buổi sáng","en":"Lan and the morning '20% crash'"},"text":{"vi":"Lan là một nhà đầu tư mới (ví dụ minh họa). Cô mua 2.000 cổ phiếu của một công ty tiêu dùng ở giá 60.000 đồng và ngủ ngon vì tin vào doanh nghiệp. Ba tuần sau, vừa mở ứng dụng lúc 9 giờ, cô thấy giá chỉ còn 48.000 đồng. Tài khoản hiện lỗ 20%. Không kịp đọc tin, Lan đặt lệnh bán toàn bộ ngay trong phiên vì sợ có tin xấu mà mình chưa biết. Buổi tối, một người bạn chỉ cho cô thông báo từ hai tuần trước: hôm đó là ngày giao dịch không hưởng quyền nhận cổ phiếu thưởng tỷ lệ 4:1. Giá tham chiếu được điều chỉnh thành 60.000 / 1,25 = 48.000 đồng, và 500 cổ phiếu thưởng sẽ về tài khoản sau vài tuần. Lan đã bán 2.000 cổ phiếu ở giá sau điều chỉnh, nhưng vì cô nắm giữ qua ngày chốt nên vẫn nhận 500 cổ phiếu thưởng; cô không mất tiền, song đã rời khỏi một vị thế mình muốn giữ vì hoảng loạn, rồi mua lại ở giá cao hơn và tốn hai lần phí. Bài học: luôn theo dõi lịch sự kiện của cổ phiếu mình nắm, và kiểm tra lý do trước khi phản ứng với một khoảng trống giá.","en":"Lan is a new investor (an illustration). She buys 2,000 shares of a consumer company at 60,000 dong and sleeps well because she trusts the business. Three weeks later she opens her app at 9 a.m. and sees the price at 48,000 dong. Her account shows a 20% loss. Without reading any news, Lan sells everything during the session, afraid of bad news she has not heard. That evening a friend shows her an announcement from two weeks earlier: that day was the ex date for a 4:1 bonus share issue. The reference price was adjusted to 60,000 / 1.25 = 48,000 dong, and 500 bonus shares would reach her account a few weeks later. Lan sold 2,000 shares at the adjusted price, but because she held through the record date she still receives the 500 bonus shares; she did not lose money, yet she left a position she wanted to keep out of panic, then bought back higher and paid fees twice. The lesson: always track the event calendar of what you own, and check the reason before reacting to a price gap."}},"mistakes":{"vi":["Mua cổ phiếu ngay trước ngày chốt quyền để 'ăn cổ tức' mà không biết giá sẽ bị điều chỉnh giảm tương ứng, còn cổ tức tiền mặt thì bị khấu trừ thuế.","Nhầm tỷ lệ cổ tức tính trên mệnh giá với tỷ suất cổ tức tính trên thị giá.","Coi cổ phiếu thưởng là quà tặng và bỏ qua việc EPS bị chia cho số cổ phiếu nhiều hơn.","Giữ vị thế lớn qua ngày công bố kết quả kinh doanh mà không tính đến khoảng trống giá có thể nhảy qua mức cắt lỗ."],"en":["Buying just before the record date to 'capture the dividend' without realising the price is adjusted down by the same amount, and that cash dividends are taxed at source.","Confusing the dividend rate quoted on par value with the dividend yield on the market price.","Treating bonus shares as a gift and overlooking that EPS is now divided across more shares.","Carrying a large position through an earnings release without allowing for a gap that can jump past the stop-loss."]},"practice":{"vi":"Trên StockGym, mở AAPL, NVDA hoặc TSLA trên khung ngày, tiến từng nến và dùng công cụ đường dọc để đánh dấu những nến có khoảng trống giá lớn, thường rơi vào mùa báo cáo. Thử hai cách ở chế độ Cổ phiếu: giữ vị thế qua nến đó và đóng trước nến đó, rồi so sánh mức sụt giảm trong bảng tổng kết phiên. Giá ở đó khớp theo giá mở cửa khi có khoảng trống, nên bạn sẽ thấy cắt lỗ có thể bị trượt.","en":"On StockGym, open AAPL, NVDA or TSLA on the daily timeframe, step one candle at a time and use the vertical line tool to mark candles with large gaps, which usually fall in earnings season. In Stocks mode try both approaches: holding through such a candle and closing before it, then compare drawdown in the session summary. Stops there fill at the open when price gaps, so you will see how a stop-loss can slip."}},{"id":"fa-combine","title":{"vi":"Kết hợp tất cả: từ ý tưởng đến kế hoạch giao dịch","en":"Putting it together: from idea to trading plan"},"summary":{"vi":"Phân tích cơ bản trả lời câu hỏi MUA GÌ, phân tích kỹ thuật trả lời câu hỏi KHI NÀO, và quản trị rủi ro trả lời BAO NHIÊU. Bài này ghép chúng thành một quy trình có luận điểm và điều kiện thoát rõ ràng.","en":"Fundamentals answer WHAT to buy, technicals answer WHEN, and risk management answers HOW MUCH. This lesson joins them into one process with a clear thesis and exit conditions."},"points":[{"h":{"vi":"Từ trên xuống và từ dưới lên","en":"Top-down and bottom-up"},"p":{"vi":"Cách tiếp cận từ trên xuống bắt đầu từ vĩ mô (lãi suất, tín dụng, chu kỳ), chọn ngành được hưởng lợi, rồi mới chọn doanh nghiệp tốt nhất trong ngành. Cách từ dưới lên bắt đầu từ từng doanh nghiệp: mô hình kinh doanh, lợi thế cạnh tranh, tài chính và định giá, ít quan tâm bối cảnh chung. Từ trên xuống giúp bạn đứng đúng phía của dòng tiền nhưng dễ sa vào dự báo vĩ mô; từ dưới lên tìm ra doanh nghiệp xuất sắc nhưng có thể mua đúng lúc cả thị trường đi xuống. Trong thực tế nên dùng cả hai: từ dưới lên để lập danh sách theo dõi, từ trên xuống để quyết định mức độ mạnh tay.","en":"The top-down approach starts with macro (rates, credit, the cycle), picks the industries that benefit, and only then selects the best company in each. Bottom-up starts with the individual company: business model, competitive advantage, financials and valuation, with little regard for the backdrop. Top-down keeps you on the right side of the money flow but tempts you into macro forecasting; bottom-up finds excellent businesses but may have you buying as the whole market falls. In practice use both: bottom-up to build the watchlist, top-down to decide how aggressive to be."}},{"h":{"vi":"Danh sách kiểm tra nghiên cứu","en":"A research checklist"},"p":{"vi":"Một danh sách ngắn, dùng lặp lại, tốt hơn một bản phân tích dài viết một lần. Sáu câu hỏi cốt lõi: Một, doanh nghiệp kiếm tiền bằng cách nào và tôi có hiểu không. Hai, lợi thế cạnh tranh là gì và có bền không. Ba, tăng trưởng doanh thu, biên lợi nhuận và ROE năm năm qua ra sao. Bốn, nợ vay có an toàn không và lợi nhuận có đi kèm dòng tiền không. Năm, ban lãnh đạo có đối xử công bằng với cổ đông nhỏ không. Sáu, giá hiện tại đã phản ánh bao nhiêu kỳ vọng so với lịch sử và so với ngành. Không trả lời được câu nào thì coi như chưa đủ điều kiện mua.","en":"A short checklist used repeatedly beats a long analysis written once. Six core questions: One, how does the business make money and do I understand it. Two, what is the competitive advantage and is it durable. Three, how have revenue growth, margins and ROE behaved over five years. Four, is the debt safe and is profit backed by cash flow. Five, does management treat minority shareholders fairly. Six, how much expectation is already in the price versus history and versus peers. If you cannot answer one of them, treat the stock as not yet qualified."}},{"h":{"vi":"Cơ bản chọn MUA GÌ, kỹ thuật chọn KHI NÀO","en":"Fundamentals for WHAT, technicals for WHEN"},"p":{"vi":"Một cổ phiếu tốt có thể đi ngang hoặc giảm nhiều năm trước khi thị trường công nhận giá trị. Biểu đồ không cho biết doanh nghiệp tốt hay xấu, nhưng cho biết người mua hay người bán đang thắng thế. Cách ghép phổ biến: chỉ giao dịch những mã đã qua danh sách kiểm tra; chờ giá nằm trên đường trung bình dài hạn như SMA200 hoặc phá vỡ một nền tích lũy với khối lượng tăng rồi mới mua; đặt cắt lỗ theo cấu trúc biểu đồ. Cách này không bảo đảm lợi nhuận và đôi khi làm bạn mua cao hơn đáy, nhưng nó giảm thời gian chôn vốn và buộc bạn có điểm sai rõ ràng.","en":"A good stock can drift sideways or down for years before the market recognises its value. A chart does not tell you whether the business is good, but it does tell you whether buyers or sellers are in control. A common way to combine them: trade only names that have passed the checklist; wait for price to sit above a long-term average such as SMA200, or to break out of a base on rising volume, before buying; place the stop by chart structure. This guarantees nothing and sometimes means buying well above the low, but it cuts dead-money time and forces you to define where you are wrong."}},{"h":{"vi":"Viết luận điểm đầu tư","en":"Write the thesis"},"p":{"vi":"Luận điểm là hai ba câu trả lời: vì sao cổ phiếu này sẽ có giá trị cao hơn, điều gì sẽ khiến thị trường nhận ra (chất xúc tác) và trong khoảng thời gian nào. Ví dụ: 'Biên lợi nhuận sẽ phục hồi từ 8% về 12% trong bốn quý tới nhờ giá nguyên liệu giảm; thị trường đang định giá như thể biên 8% là vĩnh viễn'. Luận điểm phải kiểm chứng được bằng số liệu công bố hằng quý. Viết ra giấy trước khi mua giúp bạn chống lại hai thói quen nguy hiểm: đổi lý do giữ cổ phiếu khi giá giảm, và bán non khi giá tăng dù luận điểm vẫn đúng.","en":"A thesis is two or three sentences answering: why will this stock be worth more, what will make the market notice (the catalyst), and over what time frame. For example: 'Margins will recover from 8% to 12% over the next four quarters as input prices fall; the market is pricing the stock as if 8% were permanent'. The thesis must be testable against quarterly disclosures. Writing it down before buying protects you from two dangerous habits: changing your reason for holding when the price falls, and selling too early when the price rises although the thesis is intact."}},{"h":{"vi":"Ba điều kiện thoát","en":"Three exit conditions"},"p":{"vi":"Xác định trước khi vào lệnh. Thứ nhất, thoát vì luận điểm sai: số liệu mới bác bỏ lý do mua, ví dụ biên lợi nhuận tiếp tục giảm hoặc xuất hiện dấu hiệu kế toán xấu; bán dù đang lãi hay lỗ. Thứ hai, thoát vì giá: mức cắt lỗ kỹ thuật bị phá, thường đặt dưới đáy gần nhất hoặc một bội số ATR, với khối lượng lệnh sao cho mỗi lần sai chỉ mất khoảng 1-2% tài khoản. Thứ ba, thoát vì đạt mục tiêu: giá đã phản ánh đầy đủ giá trị ước tính, hoặc có cơ hội tốt hơn hẳn. Không có điều kiện thoát thì quyết định bán sẽ do cảm xúc đưa ra.","en":"Define them before you enter. First, the thesis exit: new data contradicts the reason you bought, such as margins falling further or an accounting red flag appearing; sell whether you are up or down. Second, the price exit: the technical stop is broken, usually set below the latest swing low or a multiple of ATR, with position size chosen so that each mistake costs roughly 1-2% of the account. Third, the target exit: price fully reflects your estimate of value, or a clearly better opportunity appears. Without exit conditions, the decision to sell will be made by emotion."}}],"example":{"vi":"Tài khoản 500 triệu đồng. Cổ phiếu Z (giả định) qua danh sách kiểm tra: ROE 20%, nợ thấp, dòng tiền kinh doanh dương, P/E 11 so với trung bình năm năm là 14. Luận điểm: lợi nhuận tăng 15% mỗi năm trong hai năm, P/E trở về 14, giá trị ước tính khoảng 84.000 đồng so với giá 50.000. Kỹ thuật: giá vừa vượt nền tích lũy sáu tháng ở 50.000 và nằm trên SMA200; đáy gần nhất 46.500, đặt cắt lỗ 46.000. Rủi ro mỗi cổ phiếu 4.000 đồng. Chấp nhận mất 1% tài khoản, tức 5 triệu, nên mua 5.000.000 / 4.000 = 1.250 cổ phiếu, làm tròn 1.200, giá trị 60 triệu (12% tài khoản). Thoát khi: thủng 46.000; hoặc hai quý liên tiếp lợi nhuận tăng dưới 5%; hoặc giá đạt vùng 84.000.","en":"A 500 million dong account. Hypothetical stock Z passes the checklist: ROE 20%, low debt, positive operating cash flow, P/E 11 against a five-year average of 14. Thesis: profit grows 15% a year for two years and the P/E returns to 14, giving an estimated value of about 84,000 dong against a 50,000 price. Technicals: price has just broken out of a six-month base at 50,000 and sits above SMA200; the latest swing low is 46,500, so the stop goes at 46,000. Risk per share is 4,000 dong. Accepting a 1% account loss, 5 million, you buy 5,000,000 / 4,000 = 1,250 shares, rounded to 1,200, worth 60 million (12% of the account). Exit when: 46,000 breaks; or profit grows less than 5% for two consecutive quarters; or price reaches the 84,000 area."},"story":{"title":{"vi":"Peter Lynch: ý tưởng ở trung tâm mua sắm, quyết định ở bàn làm việc","en":"Peter Lynch: ideas at the mall, decisions at the desk"},"text":{"vi":"Peter Lynch quản lý quỹ Fidelity Magellan từ năm 1977 đến năm 1990, đạt lợi nhuận bình quân khoảng 29% mỗi năm, và tài sản của quỹ tăng từ khoảng 18 triệu đô la lên khoảng 14 tỷ đô la. Ông nổi tiếng với lời khuyên hãy đầu tư vào những gì bạn biết. Trong cuốn One Up on Wall Street, ông kể việc vợ ông, bà Carolyn, thích loại tất L'eggs bán ở siêu thị đã dẫn ông đến cổ phiếu Hanes, một trong những khoản đầu tư thành công của quỹ. Nhiều người chỉ nhớ nửa đầu câu chuyện. Nửa sau là điều Lynch nhấn mạnh nhiều lần: thích một sản phẩm chỉ là manh mối để bắt đầu nghiên cứu. Ông vẫn kiểm tra doanh thu, lợi nhuận, nợ, đối thủ và định giá, rồi theo dõi lại câu chuyện của công ty sau mỗi quý; khi câu chuyện thay đổi, ông bán. Bài học: ý tưởng có thể đến từ đời sống hằng ngày, nhưng quyết định xuống tiền phải đi qua danh sách kiểm tra, và mỗi vị thế cần một luận điểm mà bạn sẵn sàng thừa nhận là đã sai.","en":"Peter Lynch ran the Fidelity Magellan fund from 1977 to 1990, averaging a return of about 29% a year, while the fund's assets grew from about 18 million dollars to about 14 billion. He is famous for the advice to invest in what you know. In his book One Up on Wall Street he tells how his wife Carolyn's liking for L'eggs hosiery, sold in supermarkets, led him to Hanes stock, one of the fund's successful investments. Many people remember only the first half of the story. The second half is what Lynch stressed repeatedly: liking a product is merely a lead for starting research. He still checked sales, earnings, debt, competitors and valuation, then re-examined the company's story every quarter; when the story changed, he sold. The lesson: ideas can come from everyday life, but the decision to commit money must pass through the checklist, and every position needs a thesis you are willing to admit has failed."}},"mistakes":{"vi":["Mua vì biểu đồ đẹp rồi khi giá giảm lại tự nhủ mình là nhà đầu tư dài hạn theo cơ bản.","Phân tích cơ bản rất kỹ nhưng không có mức cắt lỗ và không tính khối lượng lệnh theo rủi ro.","Tìm thêm thông tin ủng hộ quan điểm sẵn có thay vì tìm bằng chứng bác bỏ luận điểm.","Dồn phần lớn tài khoản vào một ý tưởng duy nhất vì quá tự tin vào nghiên cứu của mình."],"en":["Buying because the chart looks good and then, when the price falls, telling yourself you are a long-term fundamental investor.","Doing thorough fundamental work but having no stop-loss and no risk-based position size.","Hunting for information that supports your existing view instead of evidence that would disprove the thesis.","Putting most of the account into a single idea out of overconfidence in your own research."]},"practice":{"vi":"Trên StockGym, mở chế độ Cổ phiếu với rổ FPT, HPG, VCB, MWG, VNM trên khung ngày và bật SMA200. Quy tắc luyện tập: chỉ mua mã nằm trên SMA200 và vừa vượt nền tích lũy bạn đã vẽ bằng công cụ hộp, kéo cắt lỗ xuống dưới đáy gần nhất và tính số cổ phiếu sao cho mỗi lệnh rủi ro 1% vốn. Sau phiên, xuất nhật ký ra CSV và kiểm tra xem bạn đã thoát theo kế hoạch hay theo cảm xúc.","en":"On StockGym, open Stocks mode with the basket FPT, HPG, VCB, MWG, VNM on the daily timeframe and switch on SMA200. Drill rule: buy only names that are above SMA200 and have just broken out of a base you marked with the box tool, drag the stop-loss below the latest swing low and size each position to risk 1% of capital. After the session, export the journal to CSV and check whether you exited by plan or by emotion."}}]},{"key":"wz","vip":true,"lessons":[{"id":"wz-probabilities","title":{"vi":"Tư duy xác suất: mỗi lệnh chỉ là một trong chuỗi lệnh","en":"Thinking in probabilities: each trade is one of a series"},"summary":{"vi":"Người giao dịch giỏi không đoán trúng tương lai, họ lặp lại một lợi thế nhỏ đủ nhiều lần. Bài này đổi cách bạn nhìn một lệnh thắng, một lệnh thua và cả một chuỗi thua.","en":"Good traders do not predict the future; they repeat a small edge often enough. This lesson changes how you look at a single win, a single loss and a losing streak."}},{"id":"wz-loss","title":{"vi":"Thua cho giỏi: nghệ thuật cắt lỗ không do dự","en":"Losing well: the art of cutting without hesitation"},"summary":{"vi":"Thứ phân biệt người sống sót với người cháy tài khoản không phải là tỷ lệ thắng mà là cách họ thua. Bài này biến khoản lỗ từ nỗi đau thành một chi phí kinh doanh đã tính trước.","en":"What separates survivors from blown accounts is not the win rate but the way they lose. This lesson turns a loss from a wound into a business expense you budgeted in advance."}},{"id":"wz-biases","title":{"vi":"Sợ mất mát và hiệu ứng ngược vị thế: chốt lãi non, gồng lỗ dài","en":"Loss aversion and the disposition effect: selling winners, holding losers"},"summary":{"vi":"Bộ não cảm nhận nỗi đau mất tiền mạnh gấp khoảng hai lần niềm vui được cùng số tiền đó, và chính điều này khiến ta bán cổ phiếu tốt quá sớm, ôm cổ phiếu xấu quá lâu. Hiểu cơ chế là bước đầu để viết quy tắc chống lại nó.","en":"The brain feels the pain of losing money about twice as strongly as the pleasure of gaining the same amount, and that is exactly why we sell good positions too early and hold bad ones too long. Understanding the mechanism is the first step to writing rules against it."}},{"id":"wz-fomo-revenge","title":{"vi":"FOMO, giao dịch trả thù và giao dịch quá mức","en":"FOMO, revenge trading and overtrading"},"summary":{"vi":"Phần lớn tài khoản không chết vì phương pháp tồi mà vì vài ngày mất kiểm soát. Bài này chỉ ra các ngòi nổ và đưa ra bộ cầu chì: giới hạn lỗ ngày, thời gian nguội và trần số lệnh.","en":"Most accounts do not die from a bad method but from a few days of lost control. This lesson identifies the triggers and gives you circuit breakers: a daily loss limit, cool-down periods and a cap on the number of trades."}},{"id":"wz-confirm","title":{"vi":"Sáu thiên kiến của người phân tích và quy tắc đối trị","en":"Six biases of the analyst and a counter-rule for each"},"summary":{"vi":"Biểu đồ không nói dối, nhưng bộ não đọc biểu đồ thì có. Bài này điểm mặt sáu lỗi suy nghĩ phổ biến nhất, cách chúng hiện ra trên biểu đồ và một quy tắc cụ thể để chặn từng lỗi.","en":"Charts do not lie, but the brain reading them does. This lesson names the six most common thinking errors, shows how each appears on a chart and gives one concrete rule to block it."}},{"id":"wz-plan","title":{"vi":"Kế hoạch giao dịch và bảng kiểm trước khi vào lệnh","en":"The trading plan and the pre-trade checklist"},"summary":{"vi":"Kế hoạch là nơi bạn ra quyết định khi còn tỉnh táo để lúc thị trường chạy bạn chỉ việc thực thi. Bài này cho bạn khung bảy phần của một lệnh hoàn chỉnh, cách viết quy tắc nếu-thì và một luật không được phá: không dời điểm dừng ra xa.","en":"A plan is where you make decisions while calm, so that when the market moves you only execute. This lesson gives you the seven parts of a complete trade, how to write if-then rules, and one rule that must never be broken: do not move the stop further away."}},{"id":"wz-risk-ruin","title":{"vi":"Rủi ro cháy tài khoản và tâm lý khi sụt giảm vốn","en":"Risk of ruin and the psychology of drawdown"},"summary":{"vi":"Chuỗi thua dài không phải là xui xẻo, nó là điều chắc chắn sẽ đến về mặt toán học. Bài này dạy bạn đặt khối lượng sao cho chuỗi thua tệ nhất cũng chỉ làm bạn khó chịu chứ không loại bạn khỏi cuộc chơi.","en":"A long losing streak is not bad luck, it is a mathematical certainty. This lesson shows how to size positions so that even your worst streak is an annoyance, not the end of your trading."}},{"id":"wz-journal","title":{"vi":"Nhật ký giao dịch và buổi xem lại hàng tuần","en":"The trade journal and the weekly review"},"summary":{"vi":"Trí nhớ của trader luôn nói dối theo hướng có lợi cho cái tôi. Nhật ký là dữ liệu duy nhất cho bạn biết lợi thế thật của mình nằm ở đâu và sai lầm nào đang ngốn nhiều tiền nhất.","en":"A trader's memory always lies in favour of the ego. A journal is the only data that tells you where your real edge is and which mistake is costing you the most money."}},{"id":"wz-routine","title":{"vi":"Trạng thái, thói quen và kiểm soát tilt","en":"State, routine and tilt control"},"summary":{"vi":"Cùng một trader, cùng một hệ thống, nhưng ngày ngủ đủ và ngày đang cay cú cho ra hai kết quả khác hẳn. Bài này xây cho bạn một quy trình trước phiên, bộ quy tắc dừng và cách nhận ra tilt trước khi nó kịp phá tài khoản.","en":"Same trader, same system, yet a well-rested day and an angry day produce completely different results. This lesson builds a pre-market routine, a set of stop rules and a way to spot tilt before it wrecks the account."}},{"id":"wz-winning","title":{"vi":"Để lệnh thắng chạy và xử lý chuỗi thắng thua","en":"Letting winners run and handling streaks"},"summary":{"vi":"Phần lớn lợi nhuận của một trader theo xu hướng đến từ một số ít lệnh thắng lớn, nên chốt non là cách chắc chắn nhất để thua dù tỷ lệ thắng cao. Bài này bàn về dời cắt lỗ theo giá, nhồi lệnh đúng chiều, và giữ đầu lạnh sau chuỗi thắng cũng như chuỗi thua.","en":"Most of a trend trader's profit comes from a handful of big winners, so cutting them short is the surest way to lose despite a high win rate. This lesson covers trailing stops, adding in the right direction, and keeping a cool head after both winning and losing streaks."}},{"id":"wz-process","title":{"vi":"Quy trình quan trọng hơn kết quả","en":"Process over outcome"},"summary":{"vi":"Một lệnh đúng vẫn có thể thua và một lệnh ẩu vẫn có thể thắng, nên chấm điểm bản thân bằng lãi lỗ từng lệnh là tự huấn luyện mình theo sự ngẫu nhiên. Bài này dạy bạn chấm điểm sự thực thi, giữ nhất quán và coi việc ngồi yên là một kỹ năng.","en":"A good trade can lose and a sloppy trade can win, so grading yourself by the profit of each trade means training yourself on randomness. This lesson teaches you to grade execution, stay consistent and treat sitting still as a skill."}},{"id":"wz-wizards","title":{"vi":"Bài học từ các phù thủy thị trường","en":"Lessons from the market wizards"},"summary":{"vi":"Livermore, nhóm Rùa, Paul Tudor Jones, Ed Seykota giao dịch ở những thời đại và phong cách khác nhau, nhưng những gì họ nói về rủi ro và kỷ luật giống nhau đến kỳ lạ. Bài này rút ra phần chung đó, cùng những lần họ trả giá khi tự phá luật của mình.","en":"Livermore, the Turtles, Paul Tudor Jones and Ed Seykota traded in different eras and styles, yet what they say about risk and discipline is strikingly alike. This lesson distils that common core, along with the price they paid when they broke their own rules."}}]}]};

// ---------- mở khóa VIP: PBKDF2 -> HMAC-SHA256 làm dòng khóa (CTR) + thẻ xác thực; nội dung nén deflate ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptVip(code){
  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) throw new Error('old');
  const raw = b64(VIP), salt = raw.subarray(0, 16), nonce = raw.subarray(16, 32), tag = raw.subarray(32, 64), ct = raw.subarray(64);
  const pw = new TextEncoder().encode(String(code).replace(/\s+/g, '').toUpperCase());
  const base = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256'}, base, 512));
  const hk = (b, use) => crypto.subtle.importKey('raw', b, {name: 'HMAC', hash: 'SHA-256'}, false, [use]);
  const ek = await hk(bits.slice(0, 32), 'sign'), mk = await hk(bits.slice(32), 'verify');
  const msg = new Uint8Array(16 + ct.length); msg.set(nonce); msg.set(ct, 16);
  if (!await crypto.subtle.verify('HMAC', mk, tag, msg)) throw new Error('bad');
  const nb = Math.ceil(ct.length / 32), pt = new Uint8Array(ct.length), jobs = [];
  for (let i = 0; i < nb; i++){
    const c = new Uint8Array(20); c.set(nonce); new DataView(c.buffer).setUint32(16, i);
    jobs.push(crypto.subtle.sign('HMAC', ek, c).then(k => { const ks = new Uint8Array(k), o = i * 32; for (let j = 0; j < 32 && o + j < ct.length; j++) pt[o + j] = ct[o + j] ^ ks[j]; }));
  }
  await Promise.all(jobs);
  const txt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
  return JSON.parse(txt);
}

      <div class="nav">${prev ? `<button class="b" data-go="${r.sec}/${prev.id}">${t('prev')}${esc(L(prev.title))}</button>` : `<button class="b" data-go="${r.sec}">${esc(t('all'))}</button>`}${next ? `<button class="b" data-go="${r.sec}/${next.id}">${esc(L(next.title))}${t('next')}</button>` : `<button class="b" data-go="${r.sec}">${esc(t('all'))}</button>`}</div></article>`;
  } else {
    h = `<div class="hero"><h1>${esc(t(r.sec))}${sec.vip ? '<span class="vipb">VIP</span>' : ''}</h1><p>${esc(t(r.sec + '_d'))}</p></div>`;
    if (locked) h += `<div class="lock"><h2>🔒 ${esc(t('vip_h'))}</h2><p>${esc(t('vip_p'))}<a href="${TG}" target="_blank" rel="noopener"><b>@Stockwizard</b></a>.</p>
      <form id="vform"><input id="vcode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${esc(t('vip_ph'))}"><button class="b go" type="submit">${esc(t('vip_btn'))}</button><a class="b tg" href="${TG}" target="_blank" rel="noopener">${esc(t('vip_tg'))}</a></form><div class="msg" id="vmsg"></div></div>
      <h4 style="margin:0 0 10px;color:var(--ink3);font-size:12px;letter-spacing:.9px;text-transform:uppercase">${esc(t('vip_in'))}</h4>`;
    else if (sec.vip) h += `<p style="color:var(--gold);margin:-6px 0 14px">✓ ${esc(t('vip_ok'))} · <a href="#" id="vout">${esc(t('vip_out'))}</a></p>`;
    h += `<div class="cards">` + list.map((l, i) => `<${locked ? 'div' : 'a href="#' + r.sec + '/' + l.id + '"'} class="card"><span class="n">${String(i + 1).padStart(2, '0')}${locked ? ' · 🔒' : ''}</span><b>${esc(L(l.title))}</b><span>${esc(L(l.summary))}</span></${locked ? 'div' : 'a'}>`).join('') + `</div>`;
  }
  $('main').innerHTML = h;
  const f = $('vform'); if (f) f.onsubmit = e => { e.preventDefault(); const v = $('vcode').value; if (v.trim()) unlock(v); };
  const o = $('vout'); if (o) o.onclick = e => { e.preventDefault(); WZ = null; ls.set('sg_vip', null); render(); };
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ location.hash = g.dataset.go; return; }
  const s = e.target.closest('[data-sec]'); if (s){ location.hash = s.dataset.sec; return; }
});
let LASTH = null;
window.addEventListener('hashchange', () => { render(); if (location.hash !== LASTH) window.scrollTo(0, 0); LASTH = location.hash; });
$('bLang').onclick = () => { LANG = LANG === 'vi' ? 'en' : 'vi'; ls.set('sg_lang', LANG); try { const u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null, '', u); } catch(e){} render(); };
render();
{ const c = ls.get('sg_vip'); if (c) unlock(c, true); }
</script>
</body>
</html>
